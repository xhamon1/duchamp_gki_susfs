name: Build GKI Kernel with Custom Options

on:
  workflow_dispatch:
    inputs:
      compiler:
        description: 'Select Compiler'
        required: true
        default: 'AOSP'
        type: choice
        options:
          - 'AOSP'
          - 'GreenForce'
          - 'Neutron'
          - 'WeebX'
          - 'Zyc'

      kernel_version:
        description: 'Kernel Version'
        required: true
        default: '6.1'
        type: choice
        options:
          - '6.1'

      root_manager:
        description: 'Select Root Manager'
        required: true
        default: 'KernelSU-Next'
        type: choice
        options:
          - 'KernelSU-Next'
          - 'SukiSU-Ultra'
          - 'ReSukiSU'
          - 'Vanilla'

      susfs_status:
        description: 'SUSFS'
        required: true
        default: 'enable'
        type: choice
        options:
          - 'enable'
          - 'disable'

      lto_mode:
        description: 'LTO Mode'
        required: true
        default: 'NONE'
        type: choice
        options:
          - 'NONE'
          - 'THIN'
          - 'FULL'

      run_mode:
        description: 'Run Mode'
        required: true
        default: 'Build'
        type: choice
        options:
          - 'Build'
          - 'Test Only'


jobs:
  build:
    name: Build GKI
    runs-on: ubuntu-22.04

    steps:

      # =========================================================
      # CLEAN RUNNER
      # =========================================================

      - name: Maximize Build Space
        run: |
          set -e

          echo "Cleaning unnecessary preinstalled software..."

          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY" || true

          echo
          echo "Available disk space:"
          df -h


      # =========================================================
      # CHECKOUT USER REPOSITORY
      # =========================================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # =========================================================
      # DEPENDENCIES
      # =========================================================

      - name: Install Dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            cpio \
            curl \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            lz4 \
            patch \
            python3 \
            python3-pip \
            rsync \
            unzip \
            wget \
            zip

          echo
          echo "Installed versions:"
          git --version
          python3 --version
          curl --version | head -n 1


      # =========================================================
      # COMPILER
      #
      # Android Common Kernel manifest already provides the
      # correct hermetic AOSP Clang toolchain.
      #
      # Custom compiler support is intentionally disabled for
      # this first stable build.
      # =========================================================

      - name: Validate Compiler Selection
        env:
          COMPILER: ${{ github.event.inputs.compiler }}
        run: |
          set -e

          echo "Selected compiler: $COMPILER"

          if [ "$COMPILER" != "AOSP" ]; then
            echo "::error::Custom compiler '$COMPILER' is not yet supported by this Kleaf workspace."
            echo "::error::Please select AOSP."
            exit 1
          fi

          echo "Using AOSP/Kleaf hermetic toolchain."


      # =========================================================
      # INSTALL REPO TOOL
      # =========================================================

      - name: Install Repo Tool
        run: |
          set -e

          mkdir -p "$HOME/bin"

          curl -L \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"

          chmod a+x "$HOME/bin/repo"

          echo "$HOME/bin" >> "$GITHUB_PATH"

          export PATH="$HOME/bin:$PATH"

          repo --version


      # =========================================================
      # INITIALIZE OFFICIAL ANDROID COMMON KERNEL MANIFEST
      #
      # The official manifest for Android 14 / 6.1 provides:
      #
      # common
      # build/kernel
      # prebuilts/clang
      # prebuilts/bazel
      # prebuilts/build-tools
      # etc.
      #
      # This is the important correction compared with the
      # previous workflow.
      # =========================================================

      - name: Initialize GKI Manifest
        env:
          KERNEL_VERSION: ${{ github.event.inputs.kernel_version }}
        run: |
          set -e

          BRANCH="common-android14-${KERNEL_VERSION}"

          echo "=========================================="
          echo "Android Kernel Manifest"
          echo "Branch: $BRANCH"
          echo "=========================================="

          rm -rf kernel_source

          mkdir -p kernel_source

          cd kernel_source

          repo init \
            -u https://android.googlesource.com/kernel/manifest \
            -b "$BRANCH" \
            --depth=1 \
            --no-clone-bundle \
            --no-tags

          echo
          echo "Manifest initialized."


      # =========================================================
      # SYNC OFFICIAL KERNEL WORKSPACE
      # =========================================================

      - name: Sync GKI Source
        run: |
          set -e

          cd kernel_source

          echo "=========================================="
          echo "Syncing Android Common Kernel workspace"
          echo "=========================================="

          for attempt in 1 2 3; do

            echo
            echo "Repo sync attempt $attempt / 3"

            if repo sync \
              -c \
              -j4 \
              --no-clone-bundle \
              --no-tags \
              --optimized-fetch \
              --prune \
              --force-sync; then

              echo
              echo "Repo sync completed successfully."
              break
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "::error::repo sync failed after 3 attempts."
              exit 1
            fi

            echo "Sync failed. Retrying in 15 seconds..."
            sleep 15

          done


      # =========================================================
      # VERIFY OFFICIAL WORKSPACE
      # =========================================================

      - name: Verify GKI Workspace
        run: |
          set -e

          cd kernel_source

          echo "=========================================="
          echo "Checking GKI workspace"
          echo "=========================================="

          echo
          echo "Workspace:"
          pwd

          echo
          echo "Required paths:"

          test -d common
          test -d build/kernel
          test -f common/BUILD.bazel
          test -f build/kernel/kleaf/bazel.sh
          test -f build/kernel/kleaf/bazel.WORKSPACE
          test -e tools/bazel
          test -e WORKSPACE

          echo
          echo "All required Kleaf files found."

          echo
          echo "tools/bazel:"
          ls -l tools/bazel

          echo
          echo "WORKSPACE:"
          ls -l WORKSPACE

          echo
          echo "Kernel commit:"
          cd common
          git log -1 --oneline

          echo
          echo "Kleaf commit:"
          cd ../build/kernel
          git log -1 --oneline


      # =========================================================
      # ROOT MANAGER
      #
      # IMPORTANT:
      # Kernel source is kernel_source/common.
      # =========================================================

      - name: Apply Root Manager
        if: ${{ github.event.inputs.root_manager != 'Vanilla' }}
        env:
          ROOT_MANAGER: ${{ github.event.inputs.root_manager }}
        run: |
          set -e

          cd kernel_source/common

          echo "=========================================="
          echo "Applying Root Manager"
          echo "Manager: $ROOT_MANAGER"
          echo "=========================================="

          case "$ROOT_MANAGER" in

            "KernelSU-Next")
              echo "Installing KernelSU-Next..."

              curl -LSs \
                https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/kernel/setup.sh \
                | bash -s main
              ;;

            "SukiSU-Ultra")
              echo "Installing SukiSU-Ultra..."

              curl -LSs \
                https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh \
                | bash -s main
              ;;

            "ReSukiSU")
              echo "Installing ReSukiSU..."

              curl -LSs \
                https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh \
                | bash -s main
              ;;

            *)
              echo "::error::Unknown root manager."
              exit 1
              ;;
          esac

          echo
          echo "Root manager installation completed."


      # =========================================================
      # SUSFS
      # =========================================================

      - name: Download and Apply SUSFS Patch
        if: ${{ github.event.inputs.susfs_status == 'enable' && github.event.inputs.root_manager != 'Vanilla' }}
        run: |
          set -e

          cd kernel_source/common

          echo "=========================================="
          echo "Downloading SUSFS"
          echo "=========================================="

          rm -rf susfs4ksu

          git clone \
            --depth=1 \
            --single-branch \
            --branch gki-android14-6.1 \
            https://gitlab.com/simonpunk/susfs4ksu.git \
            susfs4ksu

          echo
          echo "SUSFS commit:"
          cd susfs4ksu
          git log -1 --oneline
          cd ..

          echo
          echo "Copying SUSFS files..."

          if [ -d susfs4ksu/kernel_patches/fs ]; then
            cp -rf susfs4ksu/kernel_patches/fs/. fs/
          fi

          if [ -d susfs4ksu/kernel_patches/include ]; then
            cp -rf susfs4ksu/kernel_patches/include/. include/
          fi

          echo
          echo "Applying SUSFS patch..."

          PATCH_FILE="susfs4ksu/kernel_patches/50_add_susfs_in_gki-android14-6.1.patch"

          if [ ! -f "$PATCH_FILE" ]; then
            echo "::error::SUSFS patch was not found."
            echo "$PATCH_FILE"
            exit 1
          fi

          patch \
            -p1 \
            --ignore-whitespace \
            < "$PATCH_FILE"

          echo
          echo "SUSFS patch applied successfully."


      # =========================================================
      # VERIFY MODIFICATIONS
      # =========================================================

      - name: Verify Kernel Modifications
        env:
          ROOT_MANAGER: ${{ github.event.inputs.root_manager }}
          SUSFS: ${{ github.event.inputs.susfs_status }}
        run: |
          set -e

          cd kernel_source/common

          echo "=========================================="
          echo "Verifying kernel modifications"
          echo "=========================================="

          echo
          echo "Root manager: $ROOT_MANAGER"
          echo "SUSFS: $SUSFS"

          if [ "$ROOT_MANAGER" != "Vanilla" ]; then
            echo
            echo "KernelSU-related files:"
            find . \
              -maxdepth 3 \
              -type f \
              \( \
                -iname "*kernelsu*" \
                -o -iname "*ksu*" \
              \) \
              | head -n 50 || true
          fi

          if [ "$SUSFS" = "enable" ]; then
            echo
            echo "Searching SUSFS configuration..."

            grep -R \
              "KSU_SUSFS" \
              . \
              --include='Kconfig*' \
              --include='*.c' \
              --include='*.h' \
              2>/dev/null \
              | head -n 20 || true
          fi


      # =========================================================
      # BUILD CONFIGURATION
      # =========================================================

      - name: Show Build Configuration
        env:
          COMPILER: ${{ github.event.inputs.compiler }}
          KERNEL_VERSION: ${{ github.event.inputs.kernel_version }}
          ROOT_MANAGER: ${{ github.event.inputs.root_manager }}
          SUSFS: ${{ github.event.inputs.susfs_status }}
          LTO: ${{ github.event.inputs.lto_mode }}
          RUN_MODE: ${{ github.event.inputs.run_mode }}
        run: |
          echo
          echo "=========================================="
          echo "BUILD CONFIGURATION"
          echo "=========================================="
          echo "Compiler     : $COMPILER"
          echo "Kernel       : Android 14 - $KERNEL_VERSION"
          echo "Root Manager : $ROOT_MANAGER"
          echo "SUSFS        : $SUSFS"
          echo "LTO          : $LTO"
          echo "Run Mode     : $RUN_MODE"
          echo "=========================================="


      # =========================================================
      # TEST KLEAF
      # =========================================================

      - name: Test Kleaf Target
        if: ${{ github.event.inputs.run_mode == 'Test Only' }}
        run: |
          set -e

          cd kernel_source

          echo "=========================================="
          echo "Testing Kleaf target"
          echo "=========================================="

          tools/bazel query //common:kernel_aarch64_dist

          echo
          echo "Kleaf target resolved successfully."


      # =========================================================
      # BUILD GKI
      #
      # Android 14 / 6.1 official common kernel target:
      #
      # //common:kernel_aarch64_dist
      #
      # LTO is configured before the target.
      # =========================================================

      - name: Build GKI Kernel
        if: ${{ github.event.inputs.run_mode == 'Build' }}
        env:
          LTO_MODE: ${{ github.event.inputs.lto_mode }}
        run: |
          set -e

          cd kernel_source

          echo "=========================================="
          echo "Preparing GKI build"
          echo "=========================================="

          case "$LTO_MODE" in

            "NONE")
              LTO_ARG="none"
              ;;

            "THIN")
              LTO_ARG="thin"
              ;;

            "FULL")
              LTO_ARG="full"
              ;;

            *)
              echo "::error::Invalid LTO mode."
              exit 1
              ;;

          esac

          echo
          echo "Selected LTO: $LTO_ARG"

          echo
          echo "Bazel version:"
          tools/bazel --version

          echo
          echo "Kleaf flags:"
          tools/bazel build \
            --lto="$LTO_ARG" \
            //build/kernel/kleaf:print_flags

          echo
          echo "=========================================="
          echo "Starting GKI build"
          echo "=========================================="

          tools/bazel run \
            --lto="$LTO_ARG" \
            //common:kernel_aarch64_dist \
            -- \
            --destdir="$GITHUB_WORKSPACE/kernel_source/out/dist"

          echo
          echo "=========================================="
          echo "GKI BUILD FINISHED"
          echo "=========================================="


      # =========================================================
      # VERIFY ARTIFACTS
      # =========================================================

      - name: Verify Kernel Artifacts
        if: ${{ github.event.inputs.run_mode == 'Build' }}
        run: |
          set -e

          DIST_DIR="$GITHUB_WORKSPACE/kernel_source/out/dist"

          echo "=========================================="
          echo "Verifying kernel artifacts"
          echo "=========================================="

          if [ ! -d "$DIST_DIR" ]; then
            echo "::error::Distribution directory does not exist."
            exit 1
          fi

          FILE_COUNT=$(find "$DIST_DIR" -type f | wc -l)

          echo
          echo "Files generated: $FILE_COUNT"

          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "::error::No artifacts were generated."
            exit 1
          fi

          echo
          echo "=========================================="
          echo "ARTIFACTS"
          echo "=========================================="

          find "$DIST_DIR" \
            -type f \
            -printf '%P\n' \
            | sort

          echo
          echo "Important files:"

          find "$DIST_DIR" \
            -type f \
            \( \
              -name "Image" \
              -o -name "Image.lz4" \
              -o -name "Image.lz4-dtb" \
              -o -name "boot.img" \
              -o -name "vendor_boot.img" \
              -o -name "*.ko" \
            \) \
            -print \
            | sort || true


      # =========================================================
      # BUILD MANIFEST
      # =========================================================

      - name: Create Build Manifest
        if: ${{ github.event.inputs.run_mode == 'Build' }}
        env:
          COMPILER: ${{ github.event.inputs.compiler }}
          KERNEL_VERSION: ${{ github.event.inputs.kernel_version }}
          ROOT_MANAGER: ${{ github.event.inputs.root_manager }}
          SUSFS: ${{ github.event.inputs.susfs_status }}
          LTO: ${{ github.event.inputs.lto_mode }}
        run: |
          set -e

          DIST_DIR="$GITHUB_WORKSPACE/kernel_source/out/dist"

          {
            echo "GKI BUILD MANIFEST"
            echo "=================="
            echo
            echo "Kernel: Android 14 - $KERNEL_VERSION"
            echo "Compiler: $COMPILER"
            echo "Root Manager: $ROOT_MANAGER"
            echo "SUSFS: $SUSFS"
            echo "LTO: $LTO"
            echo
            echo "Common kernel commit:"
            cd "$GITHUB_WORKSPACE/kernel_source/common"
            git log -1 --oneline
            echo
            echo "Kleaf commit:"
            cd "$GITHUB_WORKSPACE/kernel_source/build/kernel"
            git log -1 --oneline
            echo
            echo "Artifacts:"
            find "$DIST_DIR" \
              -type f \
              -printf '%P\n' \
              | sort
          } > "$DIST_DIR/BUILD-MANIFEST.txt"

          echo "Build manifest created."


      # =========================================================
      # UPLOAD
      # =========================================================

      - name: Upload Kernel Artifacts
        if: ${{ github.event.inputs.run_mode == 'Build' }}
        uses: actions/upload-artifact@v4
        with:
          name: GKI-${{ github.event.inputs.kernel_version }}-${{ github.event.inputs.compiler }}-${{ github.event.inputs.root_manager }}-SUSFS-${{ github.event.inputs.susfs_status }}-LTO-${{ github.event.inputs.lto_mode }}
          path: |
            kernel_source/out/dist/**
          if-no-files-found: error
          retention-days: 7


      # =========================================================
      # SUMMARY
      # =========================================================

      - name: Build Summary
        if: always()
        env:
          COMPILER: ${{ github.event.inputs.compiler }}
          KERNEL_VERSION: ${{ github.event.inputs.kernel_version }}
          ROOT_MANAGER: ${{ github.event.inputs.root_manager }}
          SUSFS: ${{ github.event.inputs.susfs_status }}
          LTO: ${{ github.event.inputs.lto_mode }}
          RUN_MODE: ${{ github.event.inputs.run_mode }}
        run: |
          echo
          echo "=========================================="
          echo "BUILD SUMMARY"
          echo "=========================================="
          echo "Compiler     : $COMPILER"
          echo "Kernel       : Android 14 - $KERNEL_VERSION"
          echo "Root Manager : $ROOT_MANAGER"
          echo "SUSFS        : $SUSFS"
          echo "LTO          : $LTO"
          echo "Run Mode     : $RUN_MODE"
          echo "=========================================="
