name: Build GKI Kernel with Custom Options

on:
  workflow_dispatch:
    inputs:
      compiler:
        description: 'Select Compiler (Clang)'
        required: true
        default: 'AOSP'
        type: choice
        options:
          - 'AOSP'
          - 'GreenForce'
          - 'Neutron'
          - 'WeebX'
          - 'Zyc'

      kernel_version:
        description: 'Kernel Version'
        required: true
        default: '6.1'
        type: choice
        options:
          - '6.1'

      root_manager:
        description: 'Select Root Manager / Mode'
        required: true
        default: 'KernelSU-Next'
        type: choice
        options:
          - 'KernelSU-Next'
          - 'SukiSU-Ultra'
          - 'ReSukiSU'
          - 'Vanilla'

      susfs_status:
        description: 'SUSFS'
        required: true
        default: 'enable'
        type: choice
        options:
          - 'enable'
          - 'disable'

      lto_mode:
        description: 'LTO Mode'
        required: true
        default: 'NONE'
        type: choice
        options:
          - 'NONE'
          - 'THIN'
          - 'FULL'

      run_mode:
        description: 'Run Mode'
        required: true
        default: 'Build'
        type: choice
        options:
          - 'Build'
          - 'Test Only'


jobs:
  build:
    name: Build GKI
    runs-on: ubuntu-22.04

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      KERNEL_DIR: ${{ github.workspace }}/kernel_source
      DIST_DIR: ${{ github.workspace }}/kernel_dist

    steps:

      # ============================================================
      # MAXIMIZE BUILD SPACE
      # ============================================================

      - name: Maximize Build Space
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "Free space before cleanup"
          echo "=========================================="

          df -h

          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo rm -rf /usr/local/lib/android/sdk
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/lib/jvm

          echo "=========================================="
          echo "Free space after cleanup"
          echo "=========================================="

          df -h


      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout Repository
        uses: actions/checkout@v5


      # ============================================================
      # INSTALL DEPENDENCIES
      # ============================================================

      - name: Install Dependencies
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ca-certificates \
            cpio \
            curl \
            flex \
            git \
            git-lfs \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            libxml2-utils \
            lz4 \
            openssl \
            patch \
            python3 \
            python3-pip \
            rsync \
            unzip \
            wget \
            zip \
            xz-utils \
            openjdk-17-jdk

          git lfs install --skip-repo


      # ============================================================
      # INSTALL REPO TOOL
      # ============================================================

      - name: Install Repo Tool
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/.bin"

          curl -L \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/.bin/repo"

          chmod +x "$HOME/.bin/repo"

          echo "$HOME/.bin" >> "$GITHUB_PATH"

          export PATH="$HOME/.bin:$PATH"

          repo --version


      # ============================================================
      # SETUP CLANG
      # ============================================================

      - name: Setup Clang Compiler
        env:
          SELECTED_COMPILER: ${{ github.event.inputs.compiler }}
        shell: bash
        run: |
          set -e

          mkdir -p "$GITHUB_WORKSPACE/clang"

          echo "=========================================="
          echo "Selected compiler: $SELECTED_COMPILER"
          echo "=========================================="

          case "$SELECTED_COMPILER" in

            "GreenForce")
              git clone \
                --depth=1 \
                --single-branch \
                https://github.com/greenforce-project/greenforce_clang.git \
                "$GITHUB_WORKSPACE/clang"
              ;;

            "Neutron")
              git clone \
                --depth=1 \
                --single-branch \
                https://github.com/Neutron-Toolchains/clang-llvm-prebuilt.git \
                "$GITHUB_WORKSPACE/clang"
              ;;

            "WeebX")
              git clone \
                --depth=1 \
                --single-branch \
                https://github.com/WeebX-Toolchains/clang-llvm-prebuilt.git \
                "$GITHUB_WORKSPACE/clang"
              ;;

            "Zyc")
              git clone \
                --depth=1 \
                --single-branch \
                https://github.com/ZyCromerZ/Clang.git \
                "$GITHUB_WORKSPACE/clang"
              ;;

            "AOSP")
              echo "Using AOSP/Kleaf resolved Clang toolchain."
              ;;

            *)
              echo "::error::Unknown compiler: $SELECTED_COMPILER"
              exit 1
              ;;

          esac

          if [ "$SELECTED_COMPILER" != "AOSP" ]; then

            echo
            echo "=========================================="
            echo "Searching custom Clang"
            echo "=========================================="

            find "$GITHUB_WORKSPACE/clang" \
              -maxdepth 5 \
              -type f \
              -name clang \
              -print \
              | head -n 20

            if ! find "$GITHUB_WORKSPACE/clang" \
              -maxdepth 5 \
              -type f \
              -name clang \
              -print \
              | grep -q .; then

              echo "::error::clang binary was not found."
              exit 1
            fi

          fi


      # ============================================================
      # INITIALIZE GKI MANIFEST
      # ============================================================

      - name: Initialize GKI Manifest
        env:
          K_VER: ${{ github.event.inputs.kernel_version }}
        shell: bash
        run: |
          set -e

          rm -rf "$KERNEL_DIR"

          mkdir -p "$KERNEL_DIR"

          cd "$KERNEL_DIR"

          echo "=========================================="
          echo "Initializing Android Common Kernel"
          echo "Branch: common-android14-$K_VER"
          echo "=========================================="

          repo init \
            -u https://android.googlesource.com/kernel/manifest \
            -b "common-android14-$K_VER" \
            --depth=1 \
            --no-clone-bundle \
            --no-repo-verify

          echo
          echo "Repo manifest initialized."
          echo "The revision snapshot will be generated after repo sync."


      # ============================================================
      # SYNC GKI SOURCE
      # ============================================================

      - name: Sync GKI Source
        shell: bash
        run: |
          set -e

          cd "$KERNEL_DIR"

          echo "=========================================="
          echo "Synchronizing Android Common Kernel"
          echo "=========================================="

          repo sync \
            -c \
            --no-tags \
            --no-clone-bundle \
            --optimized-fetch \
            --prune \
            --force-sync \
            -j2

          echo
          echo "=========================================="
          echo "Verifying Kleaf workspace"
          echo "=========================================="

          REQUIRED_PATHS=(
            "common"
            "build/kernel"
            "tools"
            "prebuilts"
            "external"
          )

          for path in "${REQUIRED_PATHS[@]}"; do
            if [ ! -e "$path" ]; then
              echo "::error::Required path missing after repo sync: $path"
              echo
              echo "Top-level workspace:"
              ls -la
              echo
              echo "Repo projects:"
              repo list -p || true
              exit 1
            fi

            echo "OK: $path"
          done

          echo
          echo "Kleaf/Bazel:"
          if [ ! -x tools/bazel ]; then
            echo "::error::tools/bazel is missing or not executable."
            ls -la tools || true
            exit 1
          fi

          tools/bazel --version || true

          echo
          echo "Kernel build repository:"
          git -C build/kernel rev-parse --show-toplevel
          git -C build/kernel rev-parse HEAD

          echo
          echo "Common kernel:"
          git -C common log -1 --oneline || true

          echo
          echo "Generating pinned manifest after all repo projects exist..."
          repo manifest -r > "$GITHUB_WORKSPACE/repo-manifest.xml"

          echo "Manifest saved to:"
          echo "$GITHUB_WORKSPACE/repo-manifest.xml"


      # ============================================================
      # VALIDATE ROOT MANAGER / SUSFS COMBINATION
      # ============================================================

      - name: Validate Root Manager Selection
        env:
          ROOT_MGR: ${{ github.event.inputs.root_manager }}
          SUSFS: ${{ github.event.inputs.susfs_status }}
        shell: bash
        run: |
          set -e

          echo "Root manager : $ROOT_MGR"
          echo "SUSFS        : $SUSFS"

          if [ "$SUSFS" = "enable" ] && [ "$ROOT_MGR" != "KernelSU-Next" ]; then
            echo "::error::This workflow only supports SUSFS integration with KernelSU-Next."
            echo "::error::Select KernelSU-Next when SUSFS is enabled."
            exit 1
          fi


      # ============================================================
      # INSTALL REPO TOOL AGAIN INTO PATH FOR SUBSEQUENT STEPS
      # ============================================================

      - name: Verify Repo Environment
        shell: bash
        run: |
          set -e

          export PATH="$HOME/.bin:$PATH"

          echo "repo:"
          repo --version

          echo
          echo "python:"
          python3 --version

          echo
          echo "java:"
          java -version 2>&1 | head -n 3


      # ============================================================
      # CLONE SUSFS
      # ============================================================

      - name: Download SUSFS Source
        if: ${{ github.event.inputs.susfs_status == 'enable' }}
        shell: bash
        run: |
          set -e

          cd "$KERNEL_DIR"

          rm -rf susfs4ksu

          echo "=========================================="
          echo "Downloading SUSFS"
          echo "=========================================="

          git clone \
            --depth=3 \
            --no-tags \
            --single-branch \
            -b gki-android14-6.1-dev \
            https://gitlab.com/pershoot/susfs4ksu.git \
            susfs4ksu

          echo
          echo "SUSFS commit:"
          git -C susfs4ksu log -1 --oneline

          echo
          echo "Checking required SUSFS files..."

          SUSFS_FILES=(
            "kernel_patches/50_add_susfs_in_gki-android14-6.1_GKI.patch"
            "kernel_patches/60_scope-minimized_manual_hooks.patch"
            "kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch"
          )

          for file in "${SUSFS_FILES[@]}"; do

            if [ ! -f "$KERNEL_DIR/susfs4ksu/$file" ]; then
              echo "::error::Missing SUSFS file:"
              echo "$file"

              echo
              echo "Available patch files:"
              find "$KERNEL_DIR/susfs4ksu/kernel_patches" \
                -type f \
                -name "*.patch" \
                -print \
                | sort

              exit 1
            fi

            echo "OK: $file"

          done


      # ============================================================
      # APPLY SUSFS SOURCE + GKI PATCHES
      # ============================================================

      - name: Apply SUSFS GKI Patches
        if: ${{ github.event.inputs.susfs_status == 'enable' }}
        shell: bash
        run: |
          set -e

          cd "$KERNEL_DIR"

          COMMON="$KERNEL_DIR/common"
          SUSFS="$KERNEL_DIR/susfs4ksu"

          echo "=========================================="
          echo "Installing SUSFS source files"
          echo "=========================================="

          cp -a \
            "$SUSFS/kernel_patches/fs/." \
            "$COMMON/fs/"

          cp -a \
            "$SUSFS/kernel_patches/include/linux/." \
            "$COMMON/include/linux/"

          echo
          echo "SUSFS source files copied."

          echo
          echo "=========================================="
          echo "Copying SUSFS patches"
          echo "=========================================="

          cp -p \
            "$SUSFS/kernel_patches/50_add_susfs_in_gki-android14-6.1_GKI.patch" \
            "$COMMON/"

          cp -p \
            "$SUSFS/kernel_patches/60_scope-minimized_manual_hooks.patch" \
            "$COMMON/"

          echo
          echo "=========================================="
          echo "Applying GKI SUSFS patch"
          echo "=========================================="

          cd "$COMMON"

          patch \
            -p1 \
            -u \
            -i 50_add_susfs_in_gki-android14-6.1_GKI.patch

          echo
          echo "GKI SUSFS patch applied successfully."

          echo
          echo "=========================================="
          echo "Applying manual hooks patch"
          echo "=========================================="

          patch \
            -p1 \
            -u \
            -i 60_scope-minimized_manual_hooks.patch

          echo
          echo "Manual hooks patch applied successfully."


      # ============================================================
      # INSTALL ROOT MANAGER
      # ============================================================

      - name: Apply Root Manager
        if: ${{ github.event.inputs.root_manager != 'Vanilla' }}
        env:
          ROOT_MGR: ${{ github.event.inputs.root_manager }}
          SUSFS: ${{ github.event.inputs.susfs_status }}
        shell: bash
        run: |
          set -e

          cd "$KERNEL_DIR"

          echo "=========================================="
          echo "Installing Root Manager"
          echo "=========================================="

          echo "Root manager: $ROOT_MGR"
          echo "SUSFS: $SUSFS"

          case "$ROOT_MGR" in

            "KernelSU-Next")

              if [ "$SUSFS" = "enable" ]; then

                echo
                echo "Installing SUSFS-compatible KernelSU-Next..."

                curl -LSs \
                  "https://raw.githubusercontent.com/pershoot/KernelSU-Next/refs/heads/next-susfs/kernel/setup.sh" \
                  | bash -s next-susfs

              else

                echo
                echo "Installing standard KernelSU-Next..."

                curl -LSs \
                  "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/kernel/setup.sh" \
                  | bash -s main

              fi

              ;;

            "SukiSU-Ultra")

              echo
              echo "Installing SukiSU-Ultra..."

              curl -LSs \
                "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" \
                | bash -s main

              ;;

            "ReSukiSU")

              echo
              echo "Installing ReSukiSU..."

              curl -LSs \
                "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" \
                | bash -s main

              ;;

            *)

              echo "::error::Unknown root manager: $ROOT_MGR"
              exit 1

              ;;

          esac

          echo
          echo "=========================================="
          echo "Root manager installation completed"
          echo "=========================================="


      # ============================================================
      # APPLY SUSFS KERNELSU PATCH
      # ============================================================

      - name: Apply SUSFS KernelSU Patch
        if: ${{ github.event.inputs.susfs_status == 'enable' && github.event.inputs.root_manager == 'KernelSU-Next' }}
        shell: bash
        run: |
          set -e

          cd "$KERNEL_DIR"

          COMMON="$KERNEL_DIR/common"
          SUSFS="$KERNEL_DIR/susfs4ksu"
          KSU_DIR="$COMMON/KernelSU"
          KSU_PATCH="$SUSFS/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch"

          echo "=========================================="
          echo "Applying SUSFS KernelSU patch"
          echo "=========================================="

          if [ ! -d "$KSU_DIR" ]; then
            echo "::error::KernelSU directory was not found:"
            echo "$KSU_DIR"
            find "$COMMON" -maxdepth 2 -type d -iname '*kernelsu*' -print || true
            exit 1
          fi

          if [ ! -f "$KSU_PATCH" ]; then
            echo "::error::SUSFS KernelSU patch was not found:"
            echo "$KSU_PATCH"
            exit 1
          fi

          cp -f "$KSU_PATCH" "$KSU_DIR/10_enable_susfs_for_ksu.patch"

          cd "$KSU_DIR"

          echo "KernelSU directory:"
          pwd

          echo
          echo "Testing patch applicability..."

          if ! patch --dry-run --forward --batch -p1               < 10_enable_susfs_for_ksu.patch; then
            echo "::error::SUSFS KernelSU patch cannot be applied cleanly."
            echo
            echo "KernelSU HEAD:"
            git log -1 --oneline || true
            echo
            echo "Patch:"
            sed -n '1,220p' 10_enable_susfs_for_ksu.patch
            exit 1
          fi

          patch --forward --batch -p1             < 10_enable_susfs_for_ksu.patch

          echo
          echo "SUSFS KernelSU patch applied successfully."


      # ============================================================
      # REMOVE PROTECTED EXPORTS / PATCH FILES
      # ============================================================

      - name: Finalize SUSFS Integration
        if: ${{ github.event.inputs.susfs_status == 'enable' && github.event.inputs.root_manager == 'KernelSU-Next' }}
        shell: bash
        run: |
          set -e

          cd "$KERNEL_DIR"

          COMMON="$KERNEL_DIR/common"

          echo "=========================================="
          echo "Finalizing SUSFS integration"
          echo "=========================================="

          echo
          echo "Removing protected exports..."

          if [ -f "$COMMON/BUILD.bazel" ]; then

            sed -i \
              '/^[[:space:]]*"protected_exports_list"[[:space:]]*:[[:space:]]*"android\/abi_gki_protected_exports_aarch64",$/d' \
              "$COMMON/BUILD.bazel"

          fi

          echo
          echo "Removing protected export files..."

          rm -f \
            "$COMMON"/android/abi_gki_protected_exports_*


          echo
          echo "Removing temporary SUSFS patches..."

          rm -f \
            "$COMMON/50_add_susfs_in_gki-android14-6.1_GKI.patch" \
            "$COMMON/60_scope-minimized_manual_hooks.patch" \
            "$COMMON/KernelSU/10_enable_susfs_for_ksu.patch"


          echo
          echo "Checking KernelSU..."

          if [ ! -d "$COMMON/KernelSU" ]; then
            echo "::error::KernelSU directory was not found."
            exit 1
          fi

          find "$COMMON/KernelSU" \
            -maxdepth 2 \
            -type f \
            | head -n 30


          echo
          echo "Checking SUSFS source..."

          find "$COMMON" \
            -type f \
            \( \
              -name "susfs*.c" \
              -o -name "susfs*.h" \
            \) \
            -print \
            | sort


          echo
          echo "Checking SUSFS config..."

          grep -R \
            "CONFIG_KSU_SUSFS" \
            "$COMMON" \
            --include="Kconfig*" \
            --include="*.c" \
            --include="*.h" \
            2>/dev/null \
            | head -n 50 || true


      # ============================================================
      # VERIFY KERNEL MODIFICATIONS
      # ============================================================

      - name: Verify Kernel Modifications
        shell: bash
        run: |
          set -e

          cd "$KERNEL_DIR"

          echo "=========================================="
          echo "Kernel Workspace"
          echo "=========================================="

          echo
          echo "Kernel commit:"
          git -C common log -1 --oneline || true

          echo
          echo "Git status:"
          git -C common status --short || true

          echo
          echo "KernelSU:"
          if [ -d common/KernelSU ]; then
            echo "KernelSU installed."
          else
            echo "KernelSU not installed."
          fi

          echo
          echo "Kleaf:"
          if [ -x tools/bazel ]; then
            echo "Kleaf/Bazel available."
          else
            echo "::error::tools/bazel is missing."
            exit 1
          fi


      # ============================================================
      # TEST ONLY
      # ============================================================

      - name: Test Kleaf Target
        if: ${{ github.event.inputs.run_mode == 'Test Only' }}
        shell: bash
        run: |
          set -e

          cd "$KERNEL_DIR"

          echo "=========================================="
          echo "Testing Kleaf target"
          echo "=========================================="

          tools/bazel query //common:kernel_aarch64_dist

          echo
          echo "Kleaf target is available."

          if [ "${{ github.event.inputs.susfs_status }}" = "enable" ]; then

            echo
            echo "Checking SUSFS..."

            grep -R \
              "CONFIG_KSU_SUSFS" \
              common \
              --include="Kconfig*" \
              --include="*.c" \
              --include="*.h" \
              2>/dev/null \
              | head -n 30 || true

          fi


      # ============================================================
      # SHOW BUILD CONFIGURATION
      # ============================================================

      - name: Show Build Configuration
        if: ${{ github.event.inputs.run_mode == 'Build' }}
        env:
          LTO_MODE: ${{ github.event.inputs.lto_mode }}
          SELECTED_COMPILER: ${{ github.event.inputs.compiler }}
          ROOT_MGR: ${{ github.event.inputs.root_manager }}
          SUSFS: ${{ github.event.inputs.susfs_status }}
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "BUILD CONFIGURATION"
          echo "=========================================="

          echo "Kernel       : Android 14 / 6.1"
          echo "Compiler     : $SELECTED_COMPILER"
          echo "Root Manager : $ROOT_MGR"
          echo "SUSFS        : $SUSFS"
          echo "LTO          : $LTO_MODE"
          echo "Runner       : ubuntu-22.04"

          echo
          echo "Workspace:"
          du -sh "$KERNEL_DIR" || true

          echo
          echo "Disk:"
          df -h


      # ============================================================
      # BUILD GKI
      # ============================================================

      - name: Build GKI Kernel
        if: ${{ github.event.inputs.run_mode == 'Build' }}
        env:
          LTO_MODE: ${{ github.event.inputs.lto_mode }}
          SELECTED_COMPILER: ${{ github.event.inputs.compiler }}
        shell: bash
        run: |
          set -e

          cd "$KERNEL_DIR"

          rm -rf "$DIST_DIR"
          mkdir -p "$DIST_DIR"

          case "$LTO_MODE" in
            "NONE")
              LTO_VALUE="none"
              ;;
            "THIN")
              LTO_VALUE="thin"
              ;;
            "FULL")
              LTO_VALUE="full"
              ;;
            *)
              echo "::error::Invalid LTO mode: $LTO_MODE"
              exit 1
              ;;
          esac

          echo "=========================================="
          echo "Starting GKI build"
          echo "=========================================="

          echo "Compiler : $SELECTED_COMPILER"
          echo "LTO      : $LTO_VALUE"
          echo "Dist dir : $DIST_DIR"

          BAZEL_ARGS=(
            "--config=fast"
            "--config=stamp"
            "--lto=$LTO_VALUE"
          )

          if [ "$SELECTED_COMPILER" != "AOSP" ]; then

            CLANG_ROOT="$GITHUB_WORKSPACE/clang"

            echo
            echo "=========================================="
            echo "Using custom Clang"
            echo "=========================================="

            echo "Clang root:"
            echo "$CLANG_ROOT"

            CLANG_BIN=""

            if [ -x "$CLANG_ROOT/bin/clang" ]; then
              CLANG_BIN="$CLANG_ROOT/bin"
            else

              FOUND_CLANG="$(find "$CLANG_ROOT" \
                -type f \
                -name clang \
                -perm -111 \
                | head -n 1 || true)"

              if [ -n "$FOUND_CLANG" ]; then
                CLANG_BIN="$(dirname "$FOUND_CLANG")"
              fi

            fi

            if [ -z "$CLANG_BIN" ]; then
              echo "::error::Unable to locate custom Clang."
              find "$CLANG_ROOT" -type f -name clang -print | head -n 50 || true
              exit 1
            fi

            echo "Custom Clang bin:"
            echo "$CLANG_BIN"

            export PATH="$CLANG_BIN:$PATH"

            echo
            echo "clang:"
            clang --version | head -n 5

            BAZEL_ARGS+=(
              "--user_clang_toolchain"
            )

            export KLEAF_USER_CLANG_TOOLCHAIN_PATH="$CLANG_BIN"

          else

            echo
            echo "Using Kleaf resolved AOSP Clang toolchain."

          fi

          echo
          echo "=========================================="
          echo "Bazel arguments"
          echo "=========================================="

          printf '%s\n' "${BAZEL_ARGS[@]}"

          echo
          echo "=========================================="
          echo "Kleaf build"
          echo "=========================================="

          tools/bazel run \
            "${BAZEL_ARGS[@]}" \
            //common:kernel_aarch64_dist \
            -- \
            --dist_dir="$DIST_DIR"


      # ============================================================
      # VERIFY KERNEL ARTIFACTS
      # ============================================================

      - name: Verify Kernel Artifacts
        if: ${{ github.event.inputs.run_mode == 'Build' }}
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "Kernel Artifacts"
          echo "=========================================="

          if [ ! -d "$DIST_DIR" ]; then
            echo "::error::Distribution directory does not exist."
            exit 1
          fi

          echo
          echo "Files:"
          find "$DIST_DIR" \
            -maxdepth 3 \
            -type f \
            -printf '%p\n' \
            | sort

          echo
          echo "=========================================="
          echo "Artifact sizes"
          echo "=========================================="

          du -ah "$DIST_DIR" \
            | sort -h \
            | tail -n 50

          echo
          echo "=========================================="
          echo "Important kernel files"
          echo "=========================================="

          FOUND_IMAGE=0

          for file in \
            "$DIST_DIR/Image" \
            "$DIST_DIR/Image.gz" \
            "$DIST_DIR/Image.lz4" \
            "$DIST_DIR/boot.img"; do

            if [ -f "$file" ]; then
              echo "FOUND: $file"
              FOUND_IMAGE=1
            fi

          done

          if [ "$FOUND_IMAGE" -eq 0 ]; then
            echo "::warning::No standard Image file found at the top level."
            echo "Searching recursively..."

            find "$DIST_DIR" \
              -type f \
              \( \
                -name "Image" \
                -o -name "Image.gz" \
                -o -name "Image.lz4" \
                -o -name "boot.img" \
              \) \
              -print
          fi


      # ============================================================
      # CREATE BUILD MANIFEST
      # ============================================================

      - name: Create Build Manifest
        if: ${{ github.event.inputs.run_mode == 'Build' }}
        env:
          SELECTED_COMPILER: ${{ github.event.inputs.compiler }}
          ROOT_MGR: ${{ github.event.inputs.root_manager }}
          SUSFS: ${{ github.event.inputs.susfs_status }}
          LTO_MODE: ${{ github.event.inputs.lto_mode }}
        shell: bash
        run: |
          set -e

          MANIFEST="$DIST_DIR/build-manifest.txt"

          {
            echo "=========================================="
            echo "GKI BUILD MANIFEST"
            echo "=========================================="
            echo
            echo "Repository : ${{ github.repository }}"
            echo "Commit     : ${{ github.sha }}"
            echo "Run ID     : ${{ github.run_id }}"
            echo
            echo "Kernel     : Android 14 / 6.1"
            echo "Compiler   : $SELECTED_COMPILER"
            echo "Root       : $ROOT_MGR"
            echo "SUSFS      : $SUSFS"
            echo "LTO        : $LTO_MODE"
            echo
            echo "Kernel commit:"
            git -C "$KERNEL_DIR/common" log -1 --oneline
            echo
            echo "SUSFS commit:"

            if [ -d "$KERNEL_DIR/susfs4ksu/.git" ]; then
              git -C "$KERNEL_DIR/susfs4ksu" log -1 --oneline
            else
              echo "N/A"
            fi

            echo
            echo "KernelSU commit:"

            if [ -d "$KERNEL_DIR/common/KernelSU/.git" ]; then
              git -C "$KERNEL_DIR/common/KernelSU" log -1 --oneline
            else
              echo "N/A"
            fi

            echo
            echo "=========================================="
          } > "$MANIFEST"

          cat "$MANIFEST"


      # ============================================================
      # UPLOAD ARTIFACTS
      # ============================================================

      - name: Upload Kernel Artifacts
        if: ${{ github.event.inputs.run_mode == 'Build' }}
        uses: actions/upload-artifact@v7
        with:
          name: GKI-android14-6.1-${{ github.event.inputs.compiler }}-${{ github.event.inputs.root_manager }}-SUSFS-${{ github.event.inputs.susfs_status }}-LTO-${{ github.event.inputs.lto_mode }}
          if-no-files-found: error
          compression-level: 0
          path: |
            kernel_dist/**


      # ============================================================
      # BUILD SUMMARY
      # ============================================================

      - name: Build Summary
        if: always()
        env:
          SELECTED_COMPILER: ${{ github.event.inputs.compiler }}
          ROOT_MGR: ${{ github.event.inputs.root_manager }}
          SUSFS: ${{ github.event.inputs.susfs_status }}
          LTO_MODE: ${{ github.event.inputs.lto_mode }}
          RUN_MODE: ${{ github.event.inputs.run_mode }}
        shell: bash
        run: |
          echo
          echo "=========================================="
          echo "BUILD SUMMARY"
          echo "=========================================="
          echo
          echo "Kernel       : Android 14 / 6.1"
          echo "Compiler     : $SELECTED_COMPILER"
          echo "Root Manager : $ROOT_MGR"
          echo "SUSFS        : $SUSFS"
          echo "LTO          : $LTO_MODE"
          echo "Run Mode     : $RUN_MODE"
          echo
          echo "=========================================="

          if [ -d "$DIST_DIR" ]; then
            echo
            echo "Artifacts:"
            find "$DIST_DIR" \
              -maxdepth 2 \
              -type f \
              -printf '%p\n' \
              | sort \
              | head -n 200
          fi

          echo
          echo "=========================================="
