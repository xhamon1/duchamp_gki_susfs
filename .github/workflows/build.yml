name: Build GKI Kernel with Custom Options

on:
  workflow_dispatch:
    inputs:
      compiler:
        description: 'Select Compiler (Clang)'
        required: true
        default: 'AOSP'
        type: choice
        options:
          - 'AOSP'
          - 'GreenForce'
          - 'Neutron'
          - 'WeebX'
          - 'Zyc'

      kernel_version:
        description: 'Kernel Version'
        required: true
        default: '6.1'
        type: choice
        options:
          - '6.1'

      root_manager:
        description: 'Select Root Manager / Mode'
        required: true
        default: 'KernelSU-Next'
        type: choice
        options:
          - 'KernelSU-Next'
          - 'SukiSU-Ultra'
          - 'ReSukiSU'
          - 'Vanilla'

      susfs_status:
        description: 'SUSFS'
        required: true
        default: 'enable'
        type: choice
        options:
          - 'enable'
          - 'disable'

      lto_mode:
        description: 'LTO Mode'
        required: true
        default: 'NONE'
        type: choice
        options:
          - 'NONE'
          - 'THIN'
          - 'FULL'

      run_mode:
        description: 'Run Mode'
        required: true
        default: 'Build'
        type: choice
        options:
          - 'Build'
          - 'Test Only'


jobs:
  build:
    name: Build GKI
    runs-on: ubuntu-22.04

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      KERNEL_DIR: ${{ github.workspace }}/kernel_source
      DIST_DIR: ${{ github.workspace }}/kernel_dist


    steps:

      # ============================================================
      # MAXIMIZE BUILD SPACE
      # ============================================================

      - name: Maximize Build Space
        shell: bash
        run: |
          set -e
          df -h
          sudo rm -rf /usr/share/dotnet /opt/ghc "/usr/local/share/boost" "$AGENT_TOOLSDIRECTORY" /usr/local/lib/android/sdk /usr/local/share/powershell /usr/lib/jvm
          df -h


      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout Repository
        uses: actions/checkout@v5


      # ============================================================
      # INSTALL DEPENDENCIES
      # ============================================================

      - name: Install Dependencies
        shell: bash
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ca-certificates cpio curl flex git git-lfs libelf-dev libncurses-dev libssl-dev jq libxml2-utils lz4 openssl patch python3 python3-pip rsync unzip wget zip xz-utils zstd openjdk-17-jdk
          git lfs install --skip-repo


      # ============================================================
      # INSTALL REPO TOOL
      # ============================================================

      - name: Install Repo Tool
        shell: bash
        run: |
          set -e
          mkdir -p "$HOME/.bin"
          curl -L https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/.bin/repo"
          chmod +x "$HOME/.bin/repo"
          echo "$HOME/.bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.bin:$PATH"
          repo --version


      # ============================================================
      # SETUP CLANG
      # ============================================================

      - name: Setup Clang Compiler
        env:
          SELECTED_COMPILER: ${{ github.event.inputs.compiler }}
        shell: bash
        run: |
          set -e
          rm -rf "$GITHUB_WORKSPACE/clang"
          mkdir -p "$GITHUB_WORKSPACE/clang"

          download_latest_release_tarball() {
            REPO="$1"
            DEST_DIR="$2"
            ASSET_URL="$(curl -sL -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/releases/latest" | jq -r '.assets[]?.browser_download_url' | grep -Ei '\.(tar\.zst|tar\.xz|tar\.gz|tgz)$' | head -n1)"
            if [ -z "$ASSET_URL" ] || [ "$ASSET_URL" = "null" ]; then
              ASSET_URL="$(curl -sL -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/releases" | jq -r '.[0].assets[]?.browser_download_url' | grep -Ei '\.(tar\.zst|tar\.xz|tar\.gz|tgz)$' | head -n1)"
            fi
            if [ -z "$ASSET_URL" ] || [ "$ASSET_URL" = "null" ]; then
              echo "::error::Could not find a downloadable release tarball for $REPO"
              exit 1
            fi
            FILENAME="$(basename "$ASSET_URL")"
            curl -Ls "$ASSET_URL" -o "$FILENAME"
            case "$FILENAME" in
              *.tar.zst)
                zstd -d -f --long=31 "$FILENAME" -o "${FILENAME%.zst}"
                tar -xf "${FILENAME%.zst}" -C "$DEST_DIR"
                rm -f "${FILENAME%.zst}"
                ;;
              *.tar.xz|*.tar.gz|*.tgz)
                tar -xf "$FILENAME" -C "$DEST_DIR"
                ;;
              *)
                exit 1
                ;;
            esac
            rm -f "$FILENAME"
          }

          case "$SELECTED_COMPILER" in
            "GreenForce") download_latest_release_tarball "greenforce-project/clang-llvm" "$GITHUB_WORKSPACE/clang" ;;
            "Neutron") download_latest_release_tarball "Neutron-Toolchains/clang-build-catalogue" "$GITHUB_WORKSPACE/clang" ;;
            "WeebX") download_latest_release_tarball "XSans0/WeebX-Clang" "$GITHUB_WORKSPACE/clang" ;;
            "Zyc") download_latest_release_tarball "ZyCromerZ/Clang" "$GITHUB_WORKSPACE/clang" ;;
            "AOSP") echo "Using AOSP toolchain" ;;
          esac


      # ============================================================
      # INITIALIZE & SYNC GKI SOURCE
      # ============================================================

      - name: Initialize & Sync GKI Source
        env:
          K_VER: ${{ github.event.inputs.kernel_version }}
        shell: bash
        run: |
          set -e
          rm -rf "$KERNEL_DIR"
          mkdir -p "$KERNEL_DIR"
          cd "$KERNEL_DIR"

          repo init -u https://android.googlesource.com/kernel/manifest -b "common-android14-$K_VER" --depth=1 --no-clone-bundle --no-repo-verify
          repo sync -c --no-tags --no-clone-bundle --optimized-fetch --prune --force-sync -j4

          repo manifest -r > "$GITHUB_WORKSPACE/repo-manifest.xml"


      # ============================================================
      # DOWNLOAD SUSFS
      # ============================================================

      - name: Download SUSFS Source
        if: ${{ github.event.inputs.susfs_status == 'enable' }}
        shell: bash
        run: |
          set -e
          cd "$KERNEL_DIR"
          rm -rf susfs4ksu
          git clone --depth=1 --no-tags --single-branch -b gki-android14-6.1 https://gitlab.com/simonpunk/susfs4ksu.git susfs4ksu


      # ============================================================
      # SMART AUTOMATIC COMPATIBLE COMMIT FINDER
      # ============================================================

      - name: Find Compatible Kernel Commit Automatically
        if: ${{ github.event.inputs.susfs_status == 'enable' }}
        shell: bash
        run: |
          set -e
          COMMON="$KERNEL_DIR/common"
          SUSFS="$KERNEL_DIR/susfs4ksu"
          SUSFS_GKI_PATCH="$SUSFS/kernel_patches/50_add_susfs_in_gki-android14-6.1.patch"
          
          cd "$COMMON"

          echo "Memeriksa kompatibilitas patch SUSFS pada HEAD terbaru..."
          if patch --dry-run --forward --batch -p1 < "$SUSFS_GKI_PATCH" > /dev/null 2>&1; then
            echo "HEAD sudah kompatibel secara otomatis!"
            exit 0
          fi

          echo "HEAD belum kompatibel. Mencari commit kompatibel terdekat di riwayat..."
          
          REMOTE="$(git remote | head -n1)"
          git fetch --depth=300 "$REMOTE" || git fetch --unshallow "$REMOTE"

          FOUND_COMMIT=""
          for COMMIT in $(git log --first-parent --format='%H' -n 250); do
            git checkout --quiet --detach "$COMMIT"
            if patch --dry-run --forward --batch -p1 < "$SUSFS_GKI_PATCH" > /dev/null 2>&1; then
              FOUND_COMMIT="$COMMIT"
              break
            fi
          done

          if [ -z "$FOUND_COMMIT" ]; then
            echo "::error::Tidak ditemukan commit yang kompatibel dalam batas pencarian."
            exit 1
          fi

          echo "Commit kompatibel otomatis ditemukan:"
          git log -1 --oneline "$FOUND_COMMIT"
          git checkout --quiet --detach "$FOUND_COMMIT"


      # ============================================================
      # APPLY SUSFS SOURCE + PATCH
      # ============================================================

      - name: Apply SUSFS GKI Patch
        if: ${{ github.event.inputs.susfs_status == 'enable' }}
        shell: bash
        run: |
          set -e
          COMMON="$KERNEL_DIR/common"
          SUSFS="$KERNEL_DIR/susfs4ksu"

          cp -a "$SUSFS/kernel_patches/fs/." "$COMMON/fs/"
          cp -a "$SUSFS/kernel_patches/include/linux/." "$COMMON/include/linux/"

          SUSFS_GKI_PATCH="$SUSFS/kernel_patches/50_add_susfs_in_gki-android14-6.1.patch"
          cp -f "$SUSFS_GKI_PATCH" "$COMMON/50_add_susfs_in_gki-android14-6.1.patch"

          cd "$COMMON"
          patch --forward --batch -p1 < 50_add_susfs_in_gki-android14-6.1.patch
          rm -f 50_add_susfs_in_gki-android14-6.1.patch


      # ============================================================
      # APPLY ROOT MANAGER
      # ============================================================

      - name: Apply Root Manager
        if: ${{ github.event.inputs.root_manager != 'Vanilla' }}
        env:
          ROOT_MGR: ${{ github.event.inputs.root_manager }}
          SUSFS: ${{ github.event.inputs.susfs_status }}
        shell: bash
        run: |
          set -e
          cd "$KERNEL_DIR"

          case "$ROOT_MGR" in
            "KernelSU-Next")
              if [ "$SUSFS" = "enable" ]; then
                curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/kernel/setup.sh" | bash -s next
              else
                curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/kernel/setup.sh" | bash -s
              fi
              ;;
            "SukiSU-Ultra")
              curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s main
              ;;
            "ReSukiSU")
              curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash
              ;;
          esac


      # ============================================================
      # BUILD GKI KERNEL
      # ============================================================

      - name: Build GKI Kernel
        if: ${{ github.event.inputs.run_mode == 'Build' }}
        env:
          LTO_MODE: ${{ github.event.inputs.lto_mode }}
          SELECTED_COMPILER: ${{ github.event.inputs.compiler }}
        shell: bash
        run: |
          set -e
          cd "$KERNEL_DIR"
          rm -rf "$DIST_DIR"
          mkdir -p "$DIST_DIR"

          case "$LTO_MODE" in
            "NONE") LTO_VALUE="none" ;;
            "THIN") LTO_VALUE="thin" ;;
            "FULL") LTO_VALUE="full" ;;
          esac

          BAZEL_ARGS=("--config=fast" "--config=stamp" "--lto=$LTO_VALUE")

          if [ "$SELECTED_COMPILER" != "AOSP" ]; then
            CLANG_ROOT="$GITHUB_WORKSPACE/clang"
            FOUND_CLANG="$(find "$CLANG_ROOT" -type f -name clang -perm -111 | head -n 1)"
            CLANG_BIN="$(dirname "$FOUND_CLANG")"
            export PATH="$CLANG_BIN:$PATH"
            BAZEL_ARGS+=("--user_clang_toolchain")
            export KLEAF_USER_CLANG_TOOLCHAIN_PATH="$CLANG_BIN"
          fi

          tools/bazel run "${BAZEL_ARGS[@]}" //common:kernel_aarch64_dist -- --dist_dir="$DIST_DIR"


      # ============================================================
      # UPLOAD ARTIFACTS
      # ============================================================

      - name: Upload Kernel Artifacts
        if: ${{ github.event.inputs.run_mode == 'Build' }}
        uses: actions/upload-artifact@v7
        with:
          name: GKI-android14-6.1-${{ github.event.inputs.compiler }}-${{ github.event.inputs.root_manager }}-SUSFS-${{ github.event.inputs.susfs_status }}-LTO-${{ github.event.inputs.lto_mode }}
          if-no-files-found: error
          compression-level: 0
          path: |
            kernel_dist/**
