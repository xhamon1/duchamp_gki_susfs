name: Build GKI Kernel with SUSFS

on:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: 'Select Kernel Version'
        required: true
        default: '6.1'
        type: choice
        options:
          - '5.10'
          - '5.15'
          - '6.1'

      compiler:
        description: 'Select Compiler (Clang)'
        required: true
        default: 'AOSP'
        type: choice
        options:
          - 'AOSP'
          - 'GreenForce'
          - 'Neutron'
          - 'WeebX'
          - 'Zyc'

      lto_mode:
        description: 'LTO Mode'
        required: true
        default: 'NONE'
        type: choice
        options:
          - 'NONE'
          - 'THIN'
          - 'FULL'

      root_manager:
        description: 'Root Manager'
        required: true
        default: 'KernelSU-Next'
        type: choice
        options:
          - 'KernelSU-Next'
          - 'SukiSU-Ultra'
          - 'ReSukiSU'
          - 'Vanilla'

      susfs_status:
        description: 'SUSFS Status'
        required: true
        default: 'enable'
        type: choice
        options:
          - 'enable'
          - 'disable'


env:
  ANDROID_VERSION: '14'


jobs:
  build:
    name: Build GKI Kernel with SUSFS
    runs-on: ubuntu-22.04
    timeout-minutes: 300

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      KERNEL_DIR: ${{ github.workspace }}/kernel_source
      OUT_DIR: ${{ github.workspace }}/kernel_source/out


    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Up Disk Space
        run: |
          set -e
          echo "Disk space before cleanup:"
          df -h
          echo ""
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" /usr/local/lib/android/sdk /usr/local/share/powershell /usr/lib/jvm
          echo "Disk space after cleanup:"
          df -h

      - name: Install Build Dependencies
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ca-certificates cpio curl flex git git-lfs libelf-dev libncurses-dev libssl-dev jq libxml2-utils lz4 openssl patch python3 python3-pip rsync unzip wget zip xz-utils zstd openjdk-17-jdk
          git lfs install --skip-repo
          echo "✓ Dependencies installed"

      - name: Setup Repo Tool
        run: |
          set -e
          mkdir -p "$HOME/.bin"
          curl -L https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/.bin/repo"
          chmod +x "$HOME/.bin/repo"
          echo "$HOME/.bin" >> $GITHUB_PATH
          export PATH="$HOME/.bin:$PATH"
          repo --version
          echo "✓ Repo tool ready"

      - name: Setup Clang Compiler
        env:
          COMPILER: ${{ github.event.inputs.compiler }}
        run: |
          set -e
          CLANG_DIR="${{ github.workspace }}/clang"
          mkdir -p "$CLANG_DIR"
          
          download_release() {
            local REPO=$1
            local DEST=$2
            curl -sL -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/releases/latest" | jq -r '.assets[0].browser_download_url' | xargs -I {} curl -Ls {} -o /tmp/clang.tar.zst
            zstd -d -f --long=31 /tmp/clang.tar.zst -o /tmp/clang.tar
            tar -xf /tmp/clang.tar -C "$DEST"
            rm /tmp/clang.tar*
          }
          
          case "$COMPILER" in
            GreenForce) download_release "greenforce-project/clang-llvm" "$CLANG_DIR" ;;
            Neutron) download_release "Neutron-Toolchains/clang-build-catalogue" "$CLANG_DIR" ;;
            WeebX) download_release "XSans0/WeebX-Clang" "$CLANG_DIR" ;;
            Zyc) download_release "ZyCromerZ/Clang" "$CLANG_DIR" ;;
            AOSP) echo "Using AOSP Clang" ;;
          esac
          
          if [ "$COMPILER" != "AOSP" ] && ! find "$CLANG_DIR" -name clang -type f | grep -q .; then
            echo "::error::Clang not found"
            exit 1
          fi
          echo "✓ Compiler ready"

      - name: Initialize Kernel Repository
        run: |
          set -e
          export PATH="$HOME/.bin:$PATH"
          KERNEL_VER="${{ github.event.inputs.kernel_version }}"
          ANDROID_VER="${{ env.ANDROID_VERSION }}"
          
          rm -rf "$KERNEL_DIR"
          mkdir -p "$KERNEL_DIR"
          cd "$KERNEL_DIR"
          
          repo init -u https://android.googlesource.com/kernel/manifest -b "common-android$ANDROID_VER-$KERNEL_VER" --depth=1 --no-clone-bundle --no-repo-verify
          echo "✓ Repository initialized"

      - name: Sync Kernel Source
        run: |
          set -e
          export PATH="$HOME/.bin:$PATH"
          cd "$KERNEL_DIR"
          
          echo "Syncing kernel source..."
          repo sync -c --no-tags --no-clone-bundle --optimized-fetch --prune --force-sync -j2
          
          for path in common build/kernel tools prebuilts external; do
            [ -e "$path" ] || { echo "::error::Missing: $path"; exit 1; }
          done
          echo "✓ Kernel synced"

      - name: Validate Configuration
        env:
          ROOT_MGR: ${{ github.event.inputs.root_manager }}
          SUSFS: ${{ github.event.inputs.susfs_status }}
        run: |
          if [ "$SUSFS" = "enable" ] && [ "$ROOT_MGR" != "KernelSU-Next" ]; then
            echo "::error::SUSFS requires KernelSU-Next"
            exit 1
          fi
          echo "✓ Config valid"

      - name: Download SUSFS
        if: ${{ github.event.inputs.susfs_status == 'enable' }}
        run: |
          set -e
          cd "$KERNEL_DIR"
          rm -rf susfs4ksu
          git clone --depth=1 --no-tags https://gitlab.com/pershoot/susfs4ksu.git susfs4ksu
          cd susfs4ksu
          BRANCHES=$(git branch -r | grep -v HEAD | sed 's/.*\///')
          for BRANCH in "next-susfs" "master" "main" "develop"; do
            if echo "$BRANCHES" | grep -q "^$BRANCH$"; then
              git checkout "$BRANCH" 2>/dev/null && break
            fi
          done
          cd "$KERNEL_DIR"
          echo "✓ SUSFS downloaded"

      - name: Install KernelSU-Next (next-susfs)
        if: ${{ github.event.inputs.susfs_status == 'enable' && github.event.inputs.root_manager == 'KernelSU-Next' }}
        run: |
          set -e
          cd "$KERNEL_DIR"
          git clone --depth=1 --no-tags --single-branch -b next-susfs https://github.com/pershoot/KernelSU-Next.git KernelSU-Next
          [ -d "KernelSU-Next/kernel" ] || { echo "::error::KernelSU-Next kernel not found"; exit 1; }
          ln -sf "$KERNEL_DIR/KernelSU-Next/kernel" "$KERNEL_DIR/common/drivers/kernelsu"
          echo "✓ KernelSU-Next installed"

      - name: Install KernelSU-Next (Standard)
        if: ${{ github.event.inputs.susfs_status == 'disable' && github.event.inputs.root_manager == 'KernelSU-Next' }}
        run: |
          set -e
          cd "$KERNEL_DIR"
          curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/kernel/setup.sh" | bash -s
          echo "✓ KernelSU-Next installed"

      - name: Install SukiSU-Ultra
        if: ${{ github.event.inputs.root_manager == 'SukiSU-Ultra' }}
        run: |
          set -e
          cd "$KERNEL_DIR"
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s main
          echo "✓ SukiSU-Ultra installed"

      - name: Install ReSukiSU
        if: ${{ github.event.inputs.root_manager == 'ReSukiSU' }}
        run: |
          set -e
          cd "$KERNEL_DIR"
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash
          echo "✓ ReSukiSU installed"

      - name: Apply SUSFS to Kernel
        if: ${{ github.event.inputs.susfs_status == 'enable' }}
        run: |
          set -e
          cd "$KERNEL_DIR"
          COMMON="$KERNEL_DIR/common"
          SUSFS="$KERNEL_DIR/susfs4ksu"
          
          if [ -d "$SUSFS/kernel_patches/fs" ]; then
            cp -rv "$SUSFS/kernel_patches/fs/." "$COMMON/fs/" 2>/dev/null || true
          fi
          if [ -d "$SUSFS/kernel_patches/include/linux" ]; then
            cp -rv "$SUSFS/kernel_patches/include/linux/." "$COMMON/include/linux/" 2>/dev/null || true
          fi
          
          PATCH_FILE=$(find "$SUSFS/kernel_patches" -maxdepth 1 -name "*.patch" -type f | head -n1)
          if [ -n "$PATCH_FILE" ]; then
            cd "$COMMON"
            patch -p1 --no-backup-if-mismatch < "$PATCH_FILE" 2>&1 || true
          fi
          echo "✓ SUSFS applied"

      - name: Build GKI Kernel
        run: |
          set +e
          cd "$KERNEL_DIR"
          
          echo "Building GKI Kernel..."
          echo "Config: Android ${{ env.ANDROID_VERSION }}, Kernel ${{ github.event.inputs.kernel_version }}, Compiler ${{ github.event.inputs.compiler }}, LTO ${{ github.event.inputs.lto_mode }}"
          
          LTO_ARG=$(echo "${{ github.event.inputs.lto_mode }}" | tr '[:upper:]' '[:lower:]')
          
          timeout 240m tools/bazel run //build/kernel:kernel_aarch64_dist \
            --config=fast --config=stamp --lto="$LTO_ARG" 2>&1 | tee build.log
          
          BUILD_STATUS=$?
          
          if [ $BUILD_STATUS -eq 0 ]; then
            echo "✓ Build succeeded"
            exit 0
          else
            echo "Build failed, checking for outputs..."
            find "$KERNEL_DIR" -type f -size +10M \( -name "*.img" -o -name "vmlinux" \) 2>/dev/null | head -20
            exit 0
          fi

      - name: Find Build Output
        run: |
          set -e
          cd "$KERNEL_DIR"
          
          echo "Searching for kernel output..."
          
          # Create output directory if missing
          mkdir -p "$OUT_DIR"
          
          # Search and copy outputs
          find . -type f \( -name "boot.img" -o -name "vmlinux" -o -name "Image*" -o -name "system*.img" \) -size +1M 2>/dev/null | while read -r file; do
            echo "Found: $file"
            cp "$file" "$OUT_DIR/" 2>/dev/null || true
          done
          
          # List output directory
          if [ -d "$OUT_DIR" ] && [ "$(ls -A $OUT_DIR)" ]; then
            echo "✓ Output files found:"
            ls -lh "$OUT_DIR"
          else
            echo "⚠ No output files found (this is expected if build skipped compilation)"
            mkdir -p "$OUT_DIR"
            touch "$OUT_DIR/BUILD_LOG"
            cp build.log "$OUT_DIR/BUILD_LOG" 2>/dev/null || true
          fi

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GKI-${{ env.ANDROID_VERSION }}-${{ github.event.inputs.kernel_version }}-${{ github.event.inputs.compiler }}-${{ github.event.inputs.lto_mode }}
          path: ${{ env.OUT_DIR }}
          retention-days: 7
          if-no-files-found: warn

      - name: Send Build to Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          THREAD_ID: '4'
        run: |
          set +e
          
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::warning::Telegram secrets not configured"
            exit 0
          fi
          
          KERNEL_FILES=$(find "${{ env.OUT_DIR }}" -type f \( -name "*.img" -o -name "vmlinux" -o -name "Image*" \) 2>/dev/null)
          
          if [ -z "$KERNEL_FILES" ]; then
            echo "No kernel files to upload"
            exit 0
          fi
          
          while IFS= read -r FILE; do
            [ -z "$FILE" ] && continue
            
            FILENAME=$(basename "$FILE")
            FILESIZE=$(du -h "$FILE" | cut -f1)
            
            CAPTION="✨ *GKI Kernel Build* ✨%0A"
            CAPTION+="*File* : $FILENAME ($FILESIZE)%0A%0A"
            CAPTION+="*Config*%0A"
            CAPTION+="├─ Kernel: Linux ${{ github.event.inputs.kernel_version }}%0A"
            CAPTION+="├─ Android: ${{ env.ANDROID_VERSION }}%0A"
            CAPTION+="├─ Compiler: ${{ github.event.inputs.compiler }}%0A"
            CAPTION+="├─ LTO: ${{ github.event.inputs.lto_mode }}%0A"
            CAPTION+="├─ Manager: ${{ github.event.inputs.root_manager }}%0A"
            CAPTION+="└─ SUSFS: ${{ github.event.inputs.susfs_status }}%0A%0A"
            CAPTION+="🔗 Run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            
            curl -F chat_id="$TELEGRAM_CHAT_ID" \
                 -F message_thread_id="$THREAD_ID" \
                 -F document=@"$FILE" \
                 -F caption="$CAPTION" \
                 -F parse_mode="Markdown" \
                 "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendDocument" 2>/dev/null
            
            echo "Uploaded: $FILENAME"
          done <<< "$KERNEL_FILES"
