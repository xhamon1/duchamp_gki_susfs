name: Build GKI Kernel with Custom Options

on:
  workflow_dispatch:
    inputs:
      compiler:
        description: 'Pilih Compiler (Clang)'
        required: true
        default: 'AOSP'
        type: choice
        options:
          - 'AOSP'
          - 'Cirrus'
          - 'Neutron'
          - 'WeebX'
          - 'Zyc'
      kernel_version:
        description: 'Kernel Version'
        required: true
        default: '6.1'
        type: choice
        options:
          - '6.1'
      root_manager:
        description: 'Pilih Root Manager / Mode'
        required: true
        default: 'KernelSU-Next'
        type: choice
        options:
          - 'KernelSU-Next'
          - 'SukiSU-Ultra'
          - 'ReSukiSU'
          - 'Vanilla'
      susfs_status:
        description: 'SUSFS'
        required: true
        default: 'enable'
        type: choice
        options:
          - 'enable'
          - 'disable'
      run_mode:
        description: 'Run Mode'
        required: true
        default: 'Build'
        type: choice
        options:
          - 'Build'
          - 'Test Only'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Maximize Build Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev build-essential git wget python3 zip curl patch

      - name: Setup Clang Compiler
        run: |
          echo "Menggunakan Compiler: ${{ github.event.inputs.compiler }}"
          mkdir -p clang
          case "${{ github.event.inputs.compiler }}" in
            "AOSP")
              echo "Using AOSP Clang (Prebuilt)..."
              ;;
            "Cirrus")
              git clone https://github.com/greenforce-project/greenforce_clang -b main clang --depth=1
              ;;
            "Neutron")
              git clone https://github.com/Neutron-Toolchains/clang-llvm-prebuilt -b main clang --depth=1
              ;;
            "WeebX")
              git clone https://github.com/WeebX-Toolchains/clang-llvm-prebuilt -b main clang --depth=1
              ;;
            "Zyc")
              git clone https://github.com/ZyCromerZ/Clang -b master clang --depth=1
              ;;
          esac

      - name: Clone GKI Source
        run: |
          git clone https://android.googlesource.com/kernel/common -b android14-6.1 kernel_source --depth=1

      - name: Apply Root Manager Patch
        if: ${{ github.event.inputs.root_manager != 'Vanilla' }}
        run: |
          cd kernel_source
          case "${{ github.event.inputs.root_manager }}" in
            "KernelSU-Next")
              curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/kernel/setup.sh" | bash -s main
              ;;
            "SukiSU-Ultra")
              curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s main
              ;;
            "ReSukiSU")
              curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash -s main
              ;;
          esac

      - name: Download and Apply SUSFS Patch
        if: ${{ github.event.inputs.susfs_status == 'enable' && github.event.inputs.root_manager != 'Vanilla' }}
        run: |
          cd kernel_source
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android14-6.1 --depth=1
          cp -r susfs4ksu/kernel_patches/fs/* fs/
          cp -r susfs4ksu/kernel_patches/include/* include/
          patch -p1 -i susfs4ksu/kernel_patches/50_add_susfs_in_gki-android14-6.1.patch --ignore-whitespace || true

      - name: Build GKI Kernel
        if: github.event.inputs.run_mode == 'Build'
        run: |
          cd kernel_source
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
          tools/bazel run //common:kernel_aarch64_out_and_mismatched_modules || tools/bazel build //common:kernel_aarch64
          echo "Build process completed!"

      - name: Upload Kernel Artifacts
        if: github.event.inputs.run_mode == 'Build'
        uses: actions/upload-artifact@v4
        with:
          name: GKI-${{ github.event.inputs.kernel_version }}-${{ github.event.inputs.compiler }}-${{ github.event.inputs.root_manager }}
          path: |
            kernel_source/out/*/by-target/*
            kernel_source/out/kernel_aarch64/dist/*
