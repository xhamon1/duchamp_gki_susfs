name: Build GKI Kernel with SUSFS

on:
  workflow_dispatch:
    inputs:
      kernel_name:
        description: 'Kernel Name (used in the AK3 zip filename and banner)'
        required: true
        default: 'Amon_Kernel'
        type: string

      kernel_version:
        description: 'Select Kernel Version'
        required: true
        default: '6.1'
        type: choice
        options:
          - '5.10'
          - '5.15'
          - '6.1'

      kernel_sublevel:
        description: 'Kernel sublevel/patch number, e.g. "162", "178", "180" - leave as "latest" to auto-pick whatever commit the SUSFS patch is compatible with'
        required: true
        default: 'latest'
        type: string

      compiler:
        description: 'Select Compiler (Clang)'
        required: true
        default: 'AOSP'
        type: choice
        options:
          - 'AOSP'
          - 'GreenForce'
          - 'Neutron'
          - 'WeebX'
          - 'Zyc'

      lto_mode:
        description: 'LTO Mode'
        required: true
        default: 'NONE'
        type: choice
        options:
          - 'NONE'
          - 'THIN'
          - 'FULL'

      root_manager:
        description: 'Root Manager'
        required: true
        default: 'KernelSU-Next'
        type: choice
        options:
          - 'KernelSU-Next'
          - 'SukiSU-Ultra'
          - 'ReSukiSU'
          - 'Vanilla'

      susfs_status:
        description: 'SUSFS Status'
        required: true
        default: 'enable'
        type: choice
        options:
          - 'enable'
          - 'disable'

      experimental_mtk_modules:
        description: 'EXPERIMENTAL: inspect MediaTek device_modules source for duchamp (investigative only - does not change the flashable output yet)'
        required: true
        default: 'disable'
        type: choice
        options:
          - 'disable'
          - 'enable'


jobs:
  build:
    name: Build GKI Kernel with SUSFS
    runs-on: ubuntu-22.04
    timeout-minutes: 300

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      KERNEL_DIR: ${{ github.workspace }}/kernel_source
      DIST_DIR: ${{ github.workspace }}/kernel_dist


    steps:

      # ============================================================
      # CHECKOUT REPOSITORY
      # ============================================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # ============================================================
      # MAXIMIZE BUILD SPACE
      # ============================================================

      - name: Free Up Disk Space
        run: |
          set -e
          
          echo "=========================================="
          echo "Disk space before cleanup:"
          echo "=========================================="
          df -h
          
          echo ""
          echo "Removing unnecessary files..."
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo rm -rf /usr/local/lib/android/sdk
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/lib/jvm
          sudo rm -rf /usr/share/swift
          sudo rm -rf /opt/az
          sudo rm -rf /opt/microsoft
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/.ghcup
          sudo docker image prune -a -f 2>/dev/null || true
          sudo docker system prune -a -f 2>/dev/null || true
          
          echo ""
          echo "=========================================="
          echo "Disk space after cleanup:"
          echo "=========================================="
          df -h


      # ============================================================
      # INSTALL BUILD DEPENDENCIES
      # ============================================================

      - name: Install Build Dependencies
        run: |
          set -e
          
          echo "=========================================="
          echo "Installing build dependencies..."
          echo "=========================================="
          
          sudo apt-get update
          
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ca-certificates \
            cpio \
            curl \
            flex \
            git \
            git-lfs \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            jq \
            libxml2-utils \
            lz4 \
            openssl \
            patch \
            python3 \
            python3-pip \
            rsync \
            unzip \
            wget \
            zip \
            xz-utils \
            zstd \
            openjdk-17-jdk
          
          git lfs install --skip-repo
          
          echo "✓ All dependencies installed"


      # ============================================================
      # SETUP REPO TOOL
      # ============================================================

      - name: Setup Repo Tool
        run: |
          set -e
          
          echo "=========================================="
          echo "Setting up Repo tool..."
          echo "=========================================="
          
          mkdir -p "$HOME/.bin"
          
          curl -L \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/.bin/repo"
          
          chmod +x "$HOME/.bin/repo"
          
          echo "$HOME/.bin" >> $GITHUB_PATH
          
          export PATH="$HOME/.bin:$PATH"
          
          echo "Repo version:"
          repo --version
          
          echo "✓ Repo tool ready"


      # ============================================================
      # CACHE CLANG TOOLCHAIN (SPEEDS UP REPEAT BUILDS)
      # ============================================================
      #
      # The custom compiler options (GreenForce/Neutron/WeebX/Zyc)
      # download and extract a release tarball from GitHub every run -
      # this can be a few hundred MB. Caching the extracted result
      # means repeat runs with the same compiler choice skip that
      # entirely. No effect for AOSP (nothing is downloaded there).
      # ============================================================

      - name: Cache Clang Toolchain
        if: ${{ github.event.inputs.compiler != 'AOSP' }}
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/clang
          key: clang-${{ github.event.inputs.compiler }}-${{ github.run_id }}
          restore-keys: |
            clang-${{ github.event.inputs.compiler }}-


      # ============================================================
      # SETUP CLANG COMPILER
      # ============================================================

      - name: Setup Clang Compiler
        env:
          COMPILER: ${{ github.event.inputs.compiler }}
        run: |
          set -e
          
          echo "=========================================="
          echo "Setting up Clang Compiler"
          echo "=========================================="
          echo "Selected Compiler: $COMPILER"
          echo "=========================================="
          
          CLANG_DIR="${{ github.workspace }}/clang"
          mkdir -p "$CLANG_DIR"
          
          if [ "$COMPILER" != "AOSP" ] && [ -n "$(find "$CLANG_DIR" -maxdepth 4 -iname 'clang' -type f 2>/dev/null | head -n1)" ]; then
            echo "Found a cached, already-extracted toolchain - skipping download."
            find "$CLANG_DIR" -maxdepth 4 -iname 'clang' -type f | head -n1
          else
          # Function to download and extract release tarball
          download_release_tarball() {
            local REPO=$1
            local DEST=$2
            
            echo ""
            echo "Downloading latest release from: $REPO"
            
            # Try to get latest release
            ASSET_URL=$(curl -sL \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/releases/latest" \
              | jq -r '.assets[]?.browser_download_url' \
              | grep -Ei '\.(tar\.zst|tar\.xz|tar\.gz|tgz)$' \
              | head -n1)
            
            # If not found, try all releases
            if [ -z "$ASSET_URL" ] || [ "$ASSET_URL" = "null" ]; then
              echo "No latest release found, checking all releases..."
              ASSET_URL=$(curl -sL \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/$REPO/releases" \
                | jq -r '.[0].assets[]?.browser_download_url' \
                | grep -Ei '\.(tar\.zst|tar\.xz|tar\.gz|tgz)$' \
                | head -n1)
            fi
            
            if [ -z "$ASSET_URL" ] || [ "$ASSET_URL" = "null" ]; then
              echo "::error::Could not find release tarball for $REPO"
              exit 1
            fi
            
            echo "Download URL: $ASSET_URL"
            
            FILENAME=$(basename "$ASSET_URL")
            curl -Ls "$ASSET_URL" -o "$FILENAME"
            
            echo "Extracting $FILENAME..."
            case "$FILENAME" in
              *.tar.zst)
                zstd -d -f --long=31 "$FILENAME" -o "${FILENAME%.zst}"
                tar -xf "${FILENAME%.zst}" -C "$DEST"
                rm -f "${FILENAME%.zst}"
                ;;
              *.tar.xz|*.tar.gz|*.tgz)
                tar -xf "$FILENAME" -C "$DEST"
                ;;
              *)
                echo "::error::Unrecognized archive format: $FILENAME"
                exit 1
                ;;
            esac
            
            rm -f "$FILENAME"
            echo "Extraction complete"
          }
          
          # Download based on compiler selection
          case "$COMPILER" in
            GreenForce)
              echo "Downloading GreenForce Clang..."
              download_release_tarball "greenforce-project/clang-llvm" "$CLANG_DIR"
              ;;
            Neutron)
              echo "Downloading Neutron Clang..."
              download_release_tarball "Neutron-Toolchains/clang-build-catalogue" "$CLANG_DIR"
              ;;
            WeebX)
              echo "Downloading WeebX Clang..."
              download_release_tarball "XSans0/WeebX-Clang" "$CLANG_DIR"
              ;;
            Zyc)
              echo "Downloading ZyCromerZ Clang..."
              download_release_tarball "ZyCromerZ/Clang" "$CLANG_DIR"
              ;;
            AOSP)
              echo "Using AOSP/Kleaf Clang (resolved automatically)"
              ;;
            *)
              echo "::error::Unknown compiler: $COMPILER"
              exit 1
              ;;
          esac
          
          fi
          
          # Verify clang binary for custom toolchains
          if [ "$COMPILER" != "AOSP" ]; then
            echo ""
            echo "Verifying Clang installation..."
            
            if ! find "$CLANG_DIR" -maxdepth 6 -name clang -type f | grep -q .; then
              echo "::error::Clang binary not found after extraction"
              exit 1
            fi
            
            echo "✓ Clang found and ready"
          fi


      # ============================================================
      # RESOLVE ANDROID VERSION FOR SELECTED KERNEL VERSION
      # ============================================================
      #
      # GKI kernel/susfs branches are published as (android_version,
      # kernel_version) PAIRS - they are not independent. Android 14
      # pairs with kernel 6.1, Android 13 with 5.15, Android 12 with
      # 5.10. The previous version of this workflow hardcoded
      # ANDROID_VERSION=14 regardless of which kernel_version was
      # picked, which would have produced an invalid branch name like
      # "common-android14-5.10" (doesn't exist) the moment anyone
      # selected 5.10 or 5.15.
      # ============================================================

      - name: Resolve Android Version
        env:
          KERNEL_VER: ${{ github.event.inputs.kernel_version }}
        run: |
          set -e

          case "$KERNEL_VER" in
            "5.10")
              RESOLVED_ANDROID_VERSION="12"
              ;;
            "5.15")
              RESOLVED_ANDROID_VERSION="13"
              ;;
            "6.1")
              RESOLVED_ANDROID_VERSION="14"
              ;;
            *)
              echo "::error::No known Android version pairing for kernel $KERNEL_VER"
              exit 1
              ;;
          esac

          echo "=========================================="
          echo "Kernel $KERNEL_VER pairs with Android $RESOLVED_ANDROID_VERSION"
          echo "=========================================="
          echo "GKI branch will be: common-android$RESOLVED_ANDROID_VERSION-$KERNEL_VER"

          echo "ANDROID_VERSION=$RESOLVED_ANDROID_VERSION" >> "$GITHUB_ENV"


      # ============================================================
      # INITIALIZE KERNEL REPOSITORY
      # ============================================================

      - name: Initialize Kernel Repository
        run: |
          set -e
          
          export PATH="$HOME/.bin:$PATH"
          
          KERNEL_VER="${{ github.event.inputs.kernel_version }}"
          ANDROID_VER="${{ env.ANDROID_VERSION }}"
          
          echo "=========================================="
          echo "Initializing Kernel Repository"
          echo "=========================================="
          echo "Android Version: $ANDROID_VER"
          echo "Kernel Version: $KERNEL_VER"
          echo "Branch: common-android$ANDROID_VER-$KERNEL_VER"
          echo "=========================================="
          
          rm -rf "$KERNEL_DIR"
          mkdir -p "$KERNEL_DIR"
          cd "$KERNEL_DIR"
          
          echo ""
          echo "Running repo init..."
          repo init \
            -u https://android.googlesource.com/kernel/manifest \
            -b "common-android$ANDROID_VER-$KERNEL_VER" \
            --depth=1 \
            --no-clone-bundle \
            --no-repo-verify
          
          echo ""
          echo "✓ Repository initialized"


      # ============================================================
      # CACHE REPO MIRROR (SPEEDS UP REPEAT SYNCS)
      # ============================================================
      #
      # repo sync, plus the deeper git history our own "Select Kernel
      # Sublevel" and "Find Compatible Kernel Commit" steps fetch on
      # top of it, can mean pulling 1000+ commits of kernel history
      # from scratch on every single run. This caches the .repo git
      # object store so later runs start from a warm copy and only
      # fetch what changed since. It cannot make a build wrong: repo
      # sync/git fetch only ever ADD objects on top of whatever is
      # already there, they don't trust a cache for what HEAD actually
      # is - that's still resolved fresh from the remote every run.
      #
      # The key includes the run ID so every run saves a fresh (and
      # over time, deeper) cache; restore-keys picks up the most recent
      # prior run's cache for the same kernel version as a warm start.
      # Storage is self-managing - GitHub evicts the least-recently-used
      # cache entries once the per-repository cache limit is hit.
      # ============================================================

      - name: Cache Repo Mirror
        uses: actions/cache@v4
        with:
          path: ${{ env.KERNEL_DIR }}/.repo
          key: repo-mirror-${{ github.event.inputs.kernel_version }}-${{ github.run_id }}
          restore-keys: |
            repo-mirror-${{ github.event.inputs.kernel_version }}-


      # ============================================================
      # SYNC KERNEL SOURCE
      # ============================================================

      - name: Sync Kernel Source
        run: |
          set -e
          
          export PATH="$HOME/.bin:$PATH"
          
          cd "$KERNEL_DIR"
          
          echo "=========================================="
          echo "Syncing Kernel Source"
          echo "=========================================="
          
          echo ""
          echo "Running repo sync (this may take a while)..."
          repo sync \
            -c \
            --no-tags \
            --no-clone-bundle \
            --optimized-fetch \
            --prune \
            --force-sync \
            -j2
          
          echo ""
          echo "=========================================="
          echo "Verifying Kernel Workspace"
          echo "=========================================="
          
          REQUIRED_PATHS=(
            "common"
            "build/kernel"
            "tools"
            "prebuilts"
            "external"
          )
          
          for path in "${REQUIRED_PATHS[@]}"; do
            if [ ! -e "$path" ]; then
              echo "::error::Required path missing: $path"
              exit 1
            fi
            echo "✓ $path"
          done
          
          echo ""
          echo "=========================================="
          echo "Kernel Repository Info"
          echo "=========================================="
          
          echo ""
          echo "Common kernel commit:"
          git -C common log -1 --oneline
          
          echo ""
          echo "Build kernel commit:"
          git -C build/kernel log -1 --oneline
          
          echo ""
          echo "✓ Kernel source synced successfully"


      # ============================================================
      # SELECT KERNEL SUBLEVEL
      # ============================================================
      #
      # By default the kernel checkout is whatever "repo sync" resolves
      # to (its latest commit), and if SUSFS is enabled, the "Find
      # Compatible Kernel Commit" step further moves that to whatever
      # commit the SUSFS patch happens to apply against. Neither of
      # those lets a person pick a specific sublevel (e.g. 6.1.180
      # instead of 6.1.162) on purpose - which matters because
      # different sublevels can behave differently on real hardware
      # (this is a legitimate way to test whether a device-specific
      # issue is tied to one particular kernel commit).
      # ============================================================

      - name: Select Kernel Sublevel
        env:
          KERNEL_VER: ${{ github.event.inputs.kernel_version }}
          SUBLEVEL: ${{ github.event.inputs.kernel_sublevel }}
        run: |
          set -e

          if [ "$SUBLEVEL" = "latest" ] || [ -z "$SUBLEVEL" ]; then
            echo "Kernel sublevel: latest (no pinning requested)"
            exit 0
          fi

          COMMON="$KERNEL_DIR/common"
          MAX_COMMITS_TO_TRY=1000
          FETCH_DEPTH=$((MAX_COMMITS_TO_TRY + 200))

          cd "$COMMON"

          echo "=========================================="
          echo "Looking for kernel $KERNEL_VER.$SUBLEVEL"
          echo "=========================================="

          CURRENT_SUBLEVEL="$(grep -m1 '^SUBLEVEL = ' Makefile | awk '{print $3}')"
          echo "HEAD is currently at sublevel: $CURRENT_SUBLEVEL"

          if [ "$CURRENT_SUBLEVEL" = "$SUBLEVEL" ]; then
            echo "Already at the requested sublevel."
            exit 0
          fi

          echo ""
          echo "Deepening history to search for it..."

          REMOTE="$(git remote | head -n1)"
          CURRENT_SHA="$(git rev-parse HEAD)"

          if git fetch --deepen="$FETCH_DEPTH" "$REMOTE"; then
            echo "Deepened using configured remote refspec."
          elif git fetch --depth="$FETCH_DEPTH" "$REMOTE" "$CURRENT_SHA"; then
            echo "Deepened by fetching current commit SHA directly."
          elif git fetch --unshallow "$REMOTE"; then
            echo "Fully unshallowed (this may take a while)."
          else
            echo "::error::Failed to fetch deeper history."
            exit 1
          fi

          git checkout --quiet --detach "$CURRENT_SHA"

          echo ""
          echo "Searching first-parent history..."

          FOUND_COMMIT=""
          TRIED=0

          for COMMIT in $(git log --first-parent --format='%H' -n "$MAX_COMMITS_TO_TRY"); do

            TRIED=$((TRIED + 1))

            THIS_SUBLEVEL="$(git show "$COMMIT:Makefile" 2>/dev/null | grep -m1 '^SUBLEVEL = ' | awk '{print $3}')"

            if [ "$THIS_SUBLEVEL" = "$SUBLEVEL" ]; then
              FOUND_COMMIT="$COMMIT"
              break
            fi

            if [ "$((TRIED % 100))" -eq 0 ]; then
              echo "...checked $TRIED / $MAX_COMMITS_TO_TRY commits so far"
            fi

          done

          if [ -z "$FOUND_COMMIT" ]; then
            echo "::error::No commit found for kernel $KERNEL_VER.$SUBLEVEL in the last $MAX_COMMITS_TO_TRY first-parent commits."
            echo "::error::Check the sublevel number is correct, or use 'latest' to skip pinning."
            exit 1
          fi

          echo ""
          echo "Found: $(git log -1 --oneline "$FOUND_COMMIT")"

          git checkout --quiet --detach "$FOUND_COMMIT"

          echo ""
          echo "✓ Kernel pinned to $KERNEL_VER.$SUBLEVEL"


      # ============================================================
      # VALIDATE CONFIGURATION
      # ============================================================

      - name: Validate Configuration
        env:
          ROOT_MGR: ${{ github.event.inputs.root_manager }}
          SUSFS: ${{ github.event.inputs.susfs_status }}
        run: |
          set -e
          
          echo "=========================================="
          echo "Validating Configuration"
          echo "=========================================="
          
          echo "Root Manager: $ROOT_MGR"
          echo "SUSFS Status: $SUSFS"
          echo "Compiler: ${{ github.event.inputs.compiler }}"
          echo "LTO Mode: ${{ github.event.inputs.lto_mode }}"
          
          # Validate SUSFS + Root Manager compatibility
          if [ "$SUSFS" = "enable" ] && [ "$ROOT_MGR" != "KernelSU-Next" ]; then
            echo ""
            echo "::error::SUSFS integration requires KernelSU-Next"
            echo "::error::Please select KernelSU-Next when SUSFS is enabled"
            exit 1
          fi
          
          echo ""
          echo "✓ Configuration is valid"


      # ============================================================
      # DOWNLOAD SUSFS
      # ============================================================

      - name: Download SUSFS
        if: ${{ github.event.inputs.susfs_status == 'enable' }}
        env:
          KERNEL_VER: ${{ github.event.inputs.kernel_version }}
        run: |
          set -e

          cd "$KERNEL_DIR"

          echo "=========================================="
          echo "Downloading SUSFS"
          echo "=========================================="

          rm -rf susfs4ksu

          SUSFS_REMOTE="https://gitlab.com/pershoot/susfs4ksu.git"

          # ------------------------------------------------------------
          # NOTE: susfs4ksu publishes one branch PER (android, kernel)
          # version pair, e.g. "gki-android14-6.1-dev". Cloning without
          # specifying a branch (as this step used to do) grabs whatever
          # GitLab's default branch happens to be - which is NOT a GKI
          # branch, and does not contain the right patch file. We query
          # the actual remote branch list first (no clone needed for
          # this) and match against the naming patterns SUSFS actually
          # uses, instead of guessing.
          # ------------------------------------------------------------

          echo ""
          echo "Querying available branches on $SUSFS_REMOTE ..."

          REMOTE_BRANCHES="$(
            git ls-remote --heads "$SUSFS_REMOTE" \
              | sed 's@.*refs/heads/@@' \
              | sort
          )"

          echo "$REMOTE_BRANCHES"

          SUSFS_BRANCH=""

          for CANDIDATE in \
            "gki-android$ANDROID_VERSION-$KERNEL_VER-dev" \
            "gki-android$ANDROID_VERSION-$KERNEL_VER"; do

            if echo "$REMOTE_BRANCHES" | grep -qx "$CANDIDATE"; then
              SUSFS_BRANCH="$CANDIDATE"
              break
            fi

          done

          if [ -z "$SUSFS_BRANCH" ]; then

            echo ""
            echo "::error::No susfs4ksu branch found matching android$ANDROID_VERSION-$KERNEL_VER"
            echo "::error::Tried: gki-android$ANDROID_VERSION-$KERNEL_VER-dev, gki-android$ANDROID_VERSION-$KERNEL_VER"
            echo "::error::susfs4ksu may not support this Android/kernel combination."

            exit 1

          fi

          echo ""
          echo "Using branch: $SUSFS_BRANCH"

          git clone \
            --depth=1 \
            --no-tags \
            --single-branch \
            -b "$SUSFS_BRANCH" \
            "$SUSFS_REMOTE" \
            susfs4ksu

          echo ""
          echo "SUSFS commit (branch HEAD, latest):"
          git -C susfs4ksu log -1 --oneline

          # ------------------------------------------------------------
          # NOTE: this previously pinned to a specific, months-old
          # commit (sourced from WildKernels' tested pairing) to avoid
          # an API mismatch between susfs4ksu and pershoot/KernelSU-Next.
          # Switched back to tracking branch HEAD directly: an old pin
          # can itself become a source of problems (e.g. it may predate
          # symbol/KMI fixes present in more recent commits), and the
          # "Verify SUSFS + KernelSU-Next Compatibility" step further
          # down the pipeline already catches a genuine API mismatch in
          # seconds rather than after a wasted 30+ minute build, so it
          # is safe to rely on that instead of a hardcoded pin here.
          # ------------------------------------------------------------

          echo "SUSFS commit:"
          git -C susfs4ksu log -1 --oneline

          echo ""
          echo "=========================================="
          echo "SUSFS Contents"
          echo "=========================================="

          echo ""
          echo "Kernel patches:"
          find susfs4ksu/kernel_patches -maxdepth 1 -name "*.patch" -type f | sort || echo "No patches found"

          echo ""
          echo "Source directories:"
          find susfs4ksu/kernel_patches -maxdepth 1 -type d | sort || echo "No directories found"

          echo ""
          echo "=========================================="
          echo "Locating the GKI patch file for this branch"
          echo "=========================================="

          EXPECTED_PATCH="susfs4ksu/kernel_patches/50_add_susfs_in_gki-android$ANDROID_VERSION-$KERNEL_VER.patch"

          if [ -f "$EXPECTED_PATCH" ]; then
            echo "Found expected patch: $EXPECTED_PATCH"
          else
            echo "::warning::Expected patch not found at: $EXPECTED_PATCH"
            echo "Falling back to a name-matched search..."

            MATCHED_PATCH="$(
              find susfs4ksu/kernel_patches \
                -maxdepth 1 \
                -type f \
                -iname "*android$ANDROID_VERSION-$KERNEL_VER*.patch" \
                | head -n1
            )"

            if [ -z "$MATCHED_PATCH" ]; then
              echo "::error::No GKI patch file found for android$ANDROID_VERSION-$KERNEL_VER on branch $SUSFS_BRANCH."
              echo "::error::Available patches were listed above - none matched this kernel version."
              exit 1
            fi

            echo "Found by name match: $MATCHED_PATCH"
          fi

          echo ""
          echo "✓ SUSFS downloaded successfully"


      # ============================================================
      # FIND KERNEL COMMIT COMPATIBLE WITH SUSFS PATCH
      # ============================================================
      #
      # repo sync fetches the LATEST HEAD of the common-android branch,
      # which moves forward as Google lands new commits. The SUSFS GKI
      # patch is generated against a specific older snapshot, so once
      # HEAD has moved on, hunks stop matching and the patch fails to
      # apply cleanly. This step deepens history and walks backwards
      # (mainline commits only, skipping the thousands pulled in by
      # each merge from upstream Linux) until it finds a commit the
      # patch actually applies to, then checks the kernel out there.
      # ============================================================

      - name: Find Compatible Kernel Commit for SUSFS Patch
        if: ${{ github.event.inputs.susfs_status == 'enable' }}
        env:
          KERNEL_VER: ${{ github.event.inputs.kernel_version }}
          SUBLEVEL: ${{ github.event.inputs.kernel_sublevel }}
        run: |
          set -e

          COMMON="$KERNEL_DIR/common"
          SUSFS_GKI_PATCH="$KERNEL_DIR/susfs4ksu/kernel_patches/50_add_susfs_in_gki-android$ANDROID_VERSION-$KERNEL_VER.patch"

          if [ ! -f "$SUSFS_GKI_PATCH" ]; then
            SUSFS_GKI_PATCH="$(
              find "$KERNEL_DIR/susfs4ksu/kernel_patches" \
                -maxdepth 1 \
                -type f \
                -iname "*android$ANDROID_VERSION-$KERNEL_VER*.patch" \
                | head -n1
            )"
          fi

          if [ -z "$SUSFS_GKI_PATCH" ] || [ ! -f "$SUSFS_GKI_PATCH" ]; then
            echo "::error::Could not locate the GKI SUSFS patch file to test against."
            exit 1
          fi

          MAX_COMMITS_TO_TRY=1000
          FETCH_DEPTH=$((MAX_COMMITS_TO_TRY + 200))

          cd "$COMMON"

          echo "=========================================="
          echo "Kernel commit from repo sync (HEAD)"
          echo "=========================================="

          git log -1 --oneline

          echo ""
          echo "Patch being tested: $(basename "$SUSFS_GKI_PATCH")"

          echo ""
          echo "=========================================="
          echo "Checking if the patch already applies at HEAD"
          echo "=========================================="

          if patch \
            --dry-run \
            --forward \
            --batch \
            -p1 \
            < "$SUSFS_GKI_PATCH" > /dev/null 2>&1; then

            echo "HEAD is already compatible. No changes needed."

          else

            if [ "$SUBLEVEL" != "latest" ] && [ -n "$SUBLEVEL" ]; then
              echo "::error::Kernel $KERNEL_VER.$SUBLEVEL was explicitly requested, but the SUSFS patch does not apply cleanly to it."
              echo "::error::Not auto-searching for a different sublevel, since that would silently give you something other than what you asked for."
              echo "::error::Either try a different sublevel, or set kernel_sublevel back to 'latest' to let this step auto-pick a compatible one."
              exit 1
            fi

            echo "HEAD is NOT compatible. Searching history for a commit that is..."

            echo ""
            echo "=========================================="
            echo "Deepening shallow checkout of 'common'"
            echo "=========================================="

            REMOTE="$(git remote | head -n1)"

            if [ -z "$REMOTE" ]; then
              echo "::error::No git remote found for common kernel checkout."
              exit 1
            fi

            echo "Remote: $REMOTE"

            CURRENT_SHA="$(git rev-parse HEAD)"

            if git fetch --deepen="$FETCH_DEPTH" "$REMOTE"; then
              echo "Deepened using configured remote refspec."
            elif git fetch --depth="$FETCH_DEPTH" "$REMOTE" "$CURRENT_SHA"; then
              echo "Deepened by fetching current commit SHA directly."
            elif git fetch --unshallow "$REMOTE"; then
              echo "Fully unshallowed (this may take a while)."
            else
              echo "::error::Failed to fetch deeper history for the common kernel checkout."
              exit 1
            fi

            git checkout --quiet --detach "$CURRENT_SHA"

            echo ""
            echo "Commits available locally now (first-parent / mainline only):"
            git log --first-parent --oneline | wc -l

            echo ""
            echo "=========================================="
            echo "Searching for a compatible commit"
            echo "=========================================="

            FOUND_COMMIT=""
            TRIED=0

            for COMMIT in $(git log --first-parent --format='%H' -n "$MAX_COMMITS_TO_TRY"); do

              TRIED=$((TRIED + 1))

              git checkout --quiet --detach "$COMMIT"

              if patch \
                --dry-run \
                --forward \
                --batch \
                -p1 \
                < "$SUSFS_GKI_PATCH" > /dev/null 2>&1; then

                FOUND_COMMIT="$COMMIT"
                break

              fi

              if [ "$((TRIED % 50))" -eq 0 ]; then
                echo "...tried $TRIED / $MAX_COMMITS_TO_TRY commits so far, none compatible yet"
              fi

            done

            if [ -z "$FOUND_COMMIT" ]; then
              echo "::error::No compatible kernel commit found in the last $MAX_COMMITS_TO_TRY first-parent commits ($TRIED checked)."
              echo "::error::The SUSFS patch may target a much older kernel snapshot,"
              echo "::error::or the susfs4ksu branch needs to be updated for this kernel branch."
              exit 1
            fi

            echo ""
            echo "Compatible commit found after checking $TRIED commit(s):"
            git log -1 --oneline "$FOUND_COMMIT"

            git checkout --quiet --detach "$FOUND_COMMIT"

          fi

          echo ""
          echo "=========================================="
          echo "Final kernel commit to be used for the build"
          echo "=========================================="

          git log -1 --oneline


      # ============================================================
      # INSTALL KERNELSU-NEXT WITH SUSFS
      # ============================================================

      - name: Install KernelSU-Next (dev Branch, latest)
        if: ${{ github.event.inputs.susfs_status == 'enable' && github.event.inputs.root_manager == 'KernelSU-Next' }}
        run: |
          set -e
          
          cd "$KERNEL_DIR"
          
          echo "=========================================="
          echo "Installing KernelSU-Next with SUSFS Support"
          echo "=========================================="

          # ------------------------------------------------------------
          # NOTE: the "next-susfs" branch was confirmed stale on
          # 2026-08-13 - its driver code called susfs functions using an
          # older calling convention than susfs4ksu declares in susfs.h.
          # The "dev" branch is the actively maintained one instead.
          # This previously pinned "dev" to a specific months-old commit
          # (from a tested WildKernels pairing), but that pin can itself
          # become the problem over time (e.g. predating KMI/symbol
          # fixes). Tracking branch HEAD directly now; the "Verify SUSFS
          # + KernelSU-Next Compatibility" step further down still
          # catches a genuine API mismatch in seconds rather than after
          # a wasted 30+ minute build.
          # ------------------------------------------------------------

          echo ""
          echo "Cloning KernelSU-Next (dev branch, latest)..."
          
          git clone \
            --depth=1 \
            --no-tags \
            --single-branch \
            -b dev \
            https://github.com/pershoot/KernelSU-Next.git \
            KernelSU-Next
          
          echo ""
          echo "KernelSU-Next commit:"
          git -C KernelSU-Next log -1 --oneline
          
          echo ""
          echo "Verifying KernelSU-Next structure..."
          
          if [ ! -d "KernelSU-Next/kernel" ]; then
            echo "::error::KernelSU-Next kernel directory not found"
            echo "Available directories:"
            ls -la KernelSU-Next/
            exit 1
          fi
          
          echo "✓ kernel directory found"
          
          echo ""
          echo "Creating symlink: common/drivers/kernelsu -> KernelSU-Next/kernel"
          ln -sf "$KERNEL_DIR/KernelSU-Next/kernel" "$KERNEL_DIR/common/drivers/kernelsu"
          
          echo ""
          echo "✓ KernelSU-Next with SUSFS installed"


      # ============================================================
      # VERIFY SUSFS <-> KERNELSU-NEXT API COMPATIBILITY
      # ============================================================
      #
      # susfs4ksu and pershoot/KernelSU-Next (dev branch) are
      # maintained independently and can drift out of sync with each
      # other upstream. Both are now pinned to a tested-compatible pair
      # (see the "Download SUSFS" and "Install KernelSU-Next" steps
      # above), but this check stays as a safety net: if a pin ever
      # becomes stale or unreachable and falls back to branch HEAD,
      # susfs.h's function signatures may no longer match how
      # KernelSU-Next's core_hook.c calls them, and the full kernel
      # build would fail ~20-30+ minutes into compilation with
      # "incompatible pointer types" / "use of undeclared identifier"
      # errors deep in drivers/kernelsu/.
      #
      # This is a best-effort static check, not a real compiler - it
      # greps for the two failure patterns actually seen in practice
      # (referenced-but-undefined identifiers, and functions declared
      # 'void' in susfs.h but assigned to a variable at the call site)
      # so a real incompatibility fails in seconds instead of after
      # half an hour of wasted build time.
      # ============================================================

      - name: Verify SUSFS + KernelSU-Next Compatibility
        if: ${{ github.event.inputs.susfs_status == 'enable' && github.event.inputs.root_manager == 'KernelSU-Next' }}
        run: |
          set -e

          SUSFS_H="$KERNEL_DIR/susfs4ksu/kernel_patches/include/linux/susfs.h"
          KSU_SRC_DIR="$KERNEL_DIR/KernelSU-Next/kernel"

          echo "=========================================="
          echo "Verifying SUSFS <-> KernelSU-Next compatibility"
          echo "=========================================="

          if [ ! -f "$SUSFS_H" ]; then
            echo "::error::susfs.h not found at $SUSFS_H"
            exit 1
          fi

          if [ ! -d "$KSU_SRC_DIR" ]; then
            echo "::error::KernelSU-Next kernel source not found at $KSU_SRC_DIR"
            exit 1
          fi

          ISSUES_FOUND=0

          echo ""
          echo "Checking for identifiers referenced by KernelSU-Next but not"
          echo "defined anywhere in susfs.h..."

          REFERENCED_IDS="$(
            grep -rhoE '\b(DATA_ADB_[A-Z_]+|CMD_SUSFS_[A-Z_]+)\b' \
              "$KSU_SRC_DIR" \
              2>/dev/null \
            | sort -u
          )"

          for ID in $REFERENCED_IDS; do
            if ! grep -q "$ID" "$SUSFS_H" 2>/dev/null; then
              echo "  MISSING: $ID (used in KernelSU-Next, not found in susfs.h)"
              ISSUES_FOUND=$((ISSUES_FOUND + 1))
            fi
          done

          echo ""
          echo "Checking for susfs_*() functions whose return type doesn't"
          echo "match how KernelSU-Next calls them..."

          VOID_FUNCS="$(
            grep -oE '^void[[:space:]]+susfs_[A-Za-z0-9_]+' "$SUSFS_H" \
              | awk '{print $2}' \
              | sort -u
          )"

          for FN in $VOID_FUNCS; do
            if grep -rqE "=[[:space:]]*${FN}\(" "$KSU_SRC_DIR" 2>/dev/null; then
              echo "  MISMATCH: $FN() is declared 'void' in susfs.h, but KernelSU-Next assigns its result to a variable"
              ISSUES_FOUND=$((ISSUES_FOUND + 1))
            fi
          done

          echo ""

          if [ "$ISSUES_FOUND" -gt 0 ]; then
            echo "::error::Found $ISSUES_FOUND SUSFS <-> KernelSU-Next mismatch(es)."
            echo "::error::susfs4ksu and/or pershoot/KernelSU-Next fell back to branch HEAD"
            echo "::error::instead of their tested pin (see warnings above), and HEAD-to-HEAD"
            echo "::error::they are out of sync right now - this is not a bug in this"
            echo "::error::workflow, it's a live compatibility gap between two"
            echo "::error::independently-updated projects. Options:"
            echo "::error::  1) Re-run later - both projects are actively maintained"
            echo "::error::  2) Check whether the pinned commits in this workflow are still current"
            echo "::error::  3) Consider a pre-integrated kernel source instead"
            exit 1
          fi

          echo "No obvious mismatches found (best-effort check - not a guarantee)."
          echo "Proceeding to the full build."


      # ============================================================
      # INSTALL KERNELSU-NEXT STANDARD (WITHOUT SUSFS)
      # ============================================================

      - name: Install KernelSU-Next (Standard)
        if: ${{ github.event.inputs.susfs_status == 'disable' && github.event.inputs.root_manager == 'KernelSU-Next' }}
        run: |
          set -e
          
          cd "$KERNEL_DIR"
          
          echo "=========================================="
          echo "Installing Standard KernelSU-Next"
          echo "=========================================="
          
          echo ""
          echo "Downloading setup script..."
          curl -LSs \
            "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/kernel/setup.sh" \
            | bash -s
          
          echo ""
          echo "Verifying installation..."
          
          if [ ! -d "$KERNEL_DIR/KernelSU-Next" ] && [ ! -d "$KERNEL_DIR/KernelSU" ]; then
            echo "::warning::KernelSU-Next directory not found in expected locations"
          fi
          
          echo ""
          echo "✓ KernelSU-Next installed"


      # ============================================================
      # INSTALL SUKISU-ULTRA
      # ============================================================

      - name: Install SukiSU-Ultra
        if: ${{ github.event.inputs.root_manager == 'SukiSU-Ultra' }}
        run: |
          set -e
          
          cd "$KERNEL_DIR"
          
          echo "=========================================="
          echo "Installing SukiSU-Ultra"
          echo "=========================================="
          
          echo ""
          echo "Downloading setup script..."
          curl -LSs \
            "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" \
            | bash -s main
          
          echo ""
          echo "✓ SukiSU-Ultra installed"


      # ============================================================
      # INSTALL RESUKISU
      # ============================================================

      - name: Install ReSukiSU
        if: ${{ github.event.inputs.root_manager == 'ReSukiSU' }}
        run: |
          set -e
          
          cd "$KERNEL_DIR"
          
          echo "=========================================="
          echo "Installing ReSukiSU"
          echo "=========================================="
          
          echo ""
          echo "Downloading setup script..."
          curl -LSs \
            "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" \
            | bash
          
          echo ""
          echo "✓ ReSukiSU installed"


      # ============================================================
      # VANILLA KERNEL (NO ROOT MANAGER)
      # ============================================================

      - name: Vanilla Kernel (No Root Manager)
        if: ${{ github.event.inputs.root_manager == 'Vanilla' }}
        run: |
          set -e
          
          echo "=========================================="
          echo "Building Vanilla Kernel"
          echo "=========================================="
          echo ""
          echo "No root manager will be integrated"
          echo "✓ Proceeding with vanilla kernel build"


      # ============================================================
      # CAPTURE ROOT MANAGER INFO
      # ============================================================
      #
      # Whichever root manager step above actually ran left its source
      # checked out in a known directory. This grabs a short commit SHA
      # from it (so the Telegram caption can show exactly what was
      # built, not a guessed/live "latest" number we have no reliable
      # way to query) and the matching community Telegram link the
      # person asked to use as the reference source for each manager.
      # ============================================================

      - name: Capture Root Manager Info
        run: |
          set -e

          ROOT_MANAGER="${{ github.event.inputs.root_manager }}"
          ROOT_MANAGER_COMMIT=""
          ROOT_MANAGER_TG_URL=""

          case "$ROOT_MANAGER" in
            "KernelSU-Next")
              ROOT_MANAGER_TG_URL="https://t.me/ksunext_ci"
              for CANDIDATE in "$KERNEL_DIR/KernelSU-Next" "$KERNEL_DIR/KernelSU"; do
                if [ -d "$CANDIDATE/.git" ]; then
                  ROOT_MANAGER_COMMIT="$(git -C "$CANDIDATE" rev-parse --short HEAD)"
                  break
                fi
              done
              ;;
            "SukiSU-Ultra")
              ROOT_MANAGER_TG_URL="https://t.me/SukiKSU"
              for CANDIDATE in "$KERNEL_DIR/KernelSU" "$KERNEL_DIR/SukiSU-Ultra"; do
                if [ -d "$CANDIDATE/.git" ]; then
                  ROOT_MANAGER_COMMIT="$(git -C "$CANDIDATE" rev-parse --short HEAD)"
                  break
                fi
              done
              ;;
            "ReSukiSU")
              ROOT_MANAGER_TG_URL="https://t.me/ReSukiSU/4"
              for CANDIDATE in "$KERNEL_DIR/KernelSU" "$KERNEL_DIR/ReSukiSU"; do
                if [ -d "$CANDIDATE/.git" ]; then
                  ROOT_MANAGER_COMMIT="$(git -C "$CANDIDATE" rev-parse --short HEAD)"
                  break
                fi
              done
              ;;
            "Vanilla")
              : # no root manager, nothing to capture
              ;;
          esac

          echo "Root manager : $ROOT_MANAGER"
          echo "Commit       : ${ROOT_MANAGER_COMMIT:-N/A}"
          echo "Telegram     : ${ROOT_MANAGER_TG_URL:-N/A}"

          echo "ROOT_MANAGER_COMMIT=$ROOT_MANAGER_COMMIT" >> "$GITHUB_ENV"
          echo "ROOT_MANAGER_TG_URL=$ROOT_MANAGER_TG_URL" >> "$GITHUB_ENV"


      # ============================================================
      # APPLY SUSFS TO KERNEL
      # ============================================================

      - name: Apply SUSFS to Kernel
        if: ${{ github.event.inputs.susfs_status == 'enable' }}
        env:
          KERNEL_VER: ${{ github.event.inputs.kernel_version }}
        run: |
          set -e

          cd "$KERNEL_DIR"

          COMMON="$KERNEL_DIR/common"
          SUSFS="$KERNEL_DIR/susfs4ksu"

          echo "=========================================="
          echo "Applying SUSFS to Kernel"
          echo "=========================================="

          echo ""
          echo "Copying SUSFS source files..."

          if [ -d "$SUSFS/kernel_patches/fs" ]; then
            echo "Copying SUSFS filesystem code..."
            cp -rv "$SUSFS/kernel_patches/fs/." "$COMMON/fs/" 2>/dev/null || true
            echo "✓ fs modules copied"
          fi

          if [ -d "$SUSFS/kernel_patches/include/linux" ]; then
            echo "Copying SUSFS headers..."
            cp -rv "$SUSFS/kernel_patches/include/linux/." "$COMMON/include/linux/" 2>/dev/null || true
            echo "✓ headers copied"
          fi

          echo ""
          echo "=========================================="
          echo "Locating the matching SUSFS patch file"
          echo "=========================================="

          PATCH_FILE="$SUSFS/kernel_patches/50_add_susfs_in_gki-android$ANDROID_VERSION-$KERNEL_VER.patch"

          if [ ! -f "$PATCH_FILE" ]; then
            echo "::warning::Expected patch not found at: $PATCH_FILE"
            echo "Falling back to a name-matched search..."

            PATCH_FILE="$(
              find "$SUSFS/kernel_patches" \
                -maxdepth 1 \
                -type f \
                -iname "*android$ANDROID_VERSION-$KERNEL_VER*.patch" \
                | head -n1
            )"
          fi

          if [ -z "$PATCH_FILE" ] || [ ! -f "$PATCH_FILE" ]; then
            echo "::error::No SUSFS patch file found for android$ANDROID_VERSION-$KERNEL_VER."
            exit 1
          fi

          echo "Using patch: $(basename "$PATCH_FILE")"

          cd "$COMMON"

          echo ""
          echo "Testing patch compatibility..."

          if ! patch --dry-run --forward -p1 < "$PATCH_FILE" > /dev/null 2>&1; then
            echo "::error::SUSFS patch does not apply cleanly at the commit selected by"
            echo "::error::'Find Compatible Kernel Commit for SUSFS Patch'. This should not"
            echo "::error::happen - please re-run, and if it persists, report this combo:"
            echo "::error::  kernel=$KERNEL_VER android=$ANDROID_VERSION"
            exit 1
          fi

          echo "Patch is compatible, applying..."
          patch --forward -p1 < "$PATCH_FILE"
          echo "✓ SUSFS patch applied successfully"

          echo ""
          echo "✓ SUSFS preparation complete"


      # ============================================================
      # ============================================================
      # BRAND KERNEL VERSION STRING
      # ============================================================
      #
      # By default the kernel's version string (what shows up under
      # Settings > About > Kernel version, and what `uname -r` prints)
      # only contains the raw upstream info, e.g.
      # "6.1.162-android14-11-g0e9240ec2cfa-dirty" - nothing that
      # identifies this as a custom build. The kernel build scripts
      # (scripts/setlocalversion) automatically pick up and append the
      # contents of any "localversion*" file placed in the source root,
      # which is the standard, built-in way every mainline Linux kernel
      # supports for this - no custom patching needed.
      # ============================================================

      - name: Brand Kernel Version String
        run: |
          set -e

          RAW_NAME="${{ github.event.inputs.kernel_name }}"
          SAFE_NAME="$(echo "$RAW_NAME" | tr -c '[:alnum:]_-' '_' | sed 's/_\+/_/g; s/^_//; s/_$//')"

          if [ -z "$SAFE_NAME" ]; then
            SAFE_NAME="Kernel"
          fi

          if [ "$SAFE_NAME" != "$RAW_NAME" ]; then
            echo "::warning::kernel_name '$RAW_NAME' contains characters not safe for a kernel version string, using '$SAFE_NAME' instead"
          fi

          echo "-$SAFE_NAME" > "$KERNEL_DIR/common/localversion-name"

          echo "Wrote $KERNEL_DIR/common/localversion-name:"
          cat "$KERNEL_DIR/common/localversion-name"


      # ============================================================
      # BAZEL DISK CACHE (SPEEDS UP REPEAT BUILDS)
      # ============================================================
      #
      # Bazel's disk cache is content-addressed: an entry is only ever
      # reused if its inputs hash-match exactly, so this cannot produce
      # a wrong/stale build - a cache hit is always genuinely identical
      # work, just skipped. This mainly speeds up re-runs with the same
      # kernel/compiler/lto/root-manager/susfs combination (very common
      # while iterating on build options), and still gives partial
      # reuse (toolchain setup, unrelated object files) even when the
      # kernel commit resolved by the SUSFS compatibility search above
      # differs between runs.
      # ============================================================

      - name: Setup Bazel Disk Cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel-disk
          key: >-
            bazel-disk-${{ runner.os }}-${{ github.event.inputs.kernel_version }}-${{ github.event.inputs.compiler }}-${{ github.event.inputs.lto_mode }}-${{ github.event.inputs.root_manager }}-${{ github.event.inputs.susfs_status }}-${{ github.sha }}
          restore-keys: |
            bazel-disk-${{ runner.os }}-${{ github.event.inputs.kernel_version }}-${{ github.event.inputs.compiler }}-${{ github.event.inputs.lto_mode }}-${{ github.event.inputs.root_manager }}-${{ github.event.inputs.susfs_status }}-
            bazel-disk-${{ runner.os }}-${{ github.event.inputs.kernel_version }}-


      # ============================================================
      # BUILD KERNEL
      # ============================================================

      - name: Build GKI Kernel
        env:
          LTO_MODE: ${{ github.event.inputs.lto_mode }}
          KERNEL_VER: ${{ github.event.inputs.kernel_version }}
          ANDROID_VER: ${{ env.ANDROID_VERSION }}
        run: |
          set +e
          
          cd "$KERNEL_DIR"
          
          LTO_ARG=$(echo "$LTO_MODE" | tr '[:upper:]' '[:lower:]')
          
          echo "=========================================="
          echo "Pre-Build System Check"
          echo "=========================================="
          
          echo "Disk space:"
          df -h | grep -E "^/|Filesystem"
          
          echo ""
          echo "Memory available:"
          free -h
          
          echo ""
          echo "CPU cores:"
          nproc
          
          echo ""
          echo "=========================================="
          echo "Building GKI Kernel"
          echo "=========================================="
          echo "Android Version: $ANDROID_VER"
          echo "Kernel Version: $KERNEL_VER"
          echo "Compiler: ${{ github.event.inputs.compiler }}"
          echo "LTO Mode: $LTO_ARG"
          echo "Root Manager: ${{ github.event.inputs.root_manager }}"
          echo "SUSFS: ${{ github.event.inputs.susfs_status }}"
          echo "=========================================="
          
          echo ""
          echo "Verifying build tools..."
          
          if [ ! -x tools/bazel ]; then
            echo "::error::tools/bazel not found or not executable"
            ls -la tools/
            exit 1
          fi
          
          echo "✓ Bazel found"
          echo "Bazel version:"
          tools/bazel version || echo "Could not get Bazel version"
          
          mkdir -p "$HOME/.cache/bazel-disk"
          
          echo ""
          echo "Starting kernel build..."
          echo "Timeout: 240 minutes"
          echo "(Actual build typically takes 30-60 minutes, faster on a cache hit)"
          echo ""
          
          # Run build with explicit timeout and error handling
          timeout 240m bash -c '
          tools/bazel run //common:kernel_aarch64_dist \
            --config=fast \
            --config=stamp \
            --disk_cache="'"$HOME/.cache/bazel-disk"'" \
            --lto="'"$LTO_ARG"'" \
            2>&1 | tee build.log
          exit ${PIPESTATUS[0]}
          '
          
          BUILD_STATUS=$?
          
          echo ""
          echo "=========================================="
          
          if [ $BUILD_STATUS -eq 0 ]; then
            echo "✓ Kernel build completed successfully!"
            echo "=========================================="
            exit 0
          elif [ $BUILD_STATUS -eq 124 ]; then
            echo "::error::Build timeout (exceeded 240 minutes)"
            echo "=========================================="
            exit 1
          else
            echo "::error::Kernel build failed with exit code $BUILD_STATUS"
            echo "=========================================="
            echo ""
            echo "Build log tail (last 200 lines):"
            if [ -f build.log ]; then
              tail -200 build.log
            else
              echo "Build log not found"
            fi
            exit 1
          fi


      # ============================================================
      # [EXPERIMENTAL] INSPECT MEDIATEK DEVICE_MODULES SOURCE
      # ============================================================
      #
      # duchamp's WiFi failure traces to MediaTek's WMT/connectivity
      # driver, which lives entirely OUTSIDE the generic AOSP common
      # kernel tree - in a separate, MediaTek-maintained
      # "device_modules" source (out-of-tree kernel modules built
      # against common's headers, typically via plain `make`, not the
      # Bazel/Kleaf system common uses).
      #
      # This step ONLY downloads and inspects that source - it does
      # NOT build anything and does NOT touch the AK3 zip in any way.
      # Purpose: learn the real build layout (Makefiles, scripts) from
      # the actual source before writing any compile/packaging logic
      # against it, rather than guessing. Getting the real kernel
      # module ABI wrong here is the kind of mistake that could produce
      # a kernel that panics on boot, so this stays strictly read-only
      # until we've confirmed how it actually needs to be built.
      # ============================================================

      - name: "[EXPERIMENTAL] Inspect MediaTek Device Modules"
        if: ${{ github.event.inputs.experimental_mtk_modules == 'enable' }}
        continue-on-error: true
        run: |
          set +e

          echo "=========================================="
          echo "EXPERIMENTAL - investigative only, no build output is affected"
          echo "=========================================="

          MTK_DIR="$KERNEL_DIR/mtk_device_modules"
          rm -rf "$MTK_DIR"

          CLONED=0

          for CANDIDATE_URL in \
            "https://github.com/mt6897-devs/android_kernel_device_modules_6.1" \
            "https://github.com/MinatiScape/mediatek_kernel_device_modules"; do

            echo ""
            echo "Trying: $CANDIDATE_URL"

            if git clone --depth=1 "$CANDIDATE_URL" "$MTK_DIR" 2>&1; then
              CLONED=1
              echo "Cloned successfully from: $CANDIDATE_URL"
              break
            else
              echo "Failed (branch may differ, or repo path may have changed)."
            fi

          done

          if [ "$CLONED" -ne 1 ]; then
            echo ""
            echo "::warning::Could not clone any candidate MediaTek device_modules source."
            echo "::warning::Repo names/branches for community MTK sources change over time -"
            echo "::warning::this needs a manually-verified URL+branch, not a guess."
            exit 0
          fi

          echo ""
          echo "=========================================="
          echo "Top-level structure"
          echo "=========================================="
          find "$MTK_DIR" -maxdepth 1 -mindepth 1 | sort

          echo ""
          echo "=========================================="
          echo "Looking for the mt6897 platform directory"
          echo "=========================================="
          find "$MTK_DIR" -maxdepth 3 -iname "*6897*" -type d

          echo ""
          echo "=========================================="
          echo "Looking for build entry points (Makefile, Kbuild, build.sh)"
          echo "=========================================="
          find "$MTK_DIR" -maxdepth 2 -type f \( -iname "Makefile" -o -iname "Kbuild" -o -iname "build.sh" -o -iname "*.mk" \) | sort

          echo ""
          echo "=========================================="
          echo "Looking for the WMT/connectivity driver specifically"
          echo "=========================================="
          find "$MTK_DIR" -type d -iname "*connectivity*" -o -type d -iname "*wmt*" 2>/dev/null | head -20

          echo ""
          echo "=========================================="
          echo "Contents of mt6897/ (device-specific platform dir)"
          echo "=========================================="
          find "$MTK_DIR/mt6897" -maxdepth 2 2>/dev/null | sort

          echo ""
          echo "=========================================="
          echo "BUILD.bazel targets defined for mt6897"
          echo "=========================================="
          find "$MTK_DIR/mt6897" -iname "BUILD.bazel" -exec echo "--- {} ---" \; -exec cat {} \; 2>/dev/null | head -150

          echo ""
          echo "=========================================="
          echo "Looking for a stated/pinned 'common' kernel revision"
          echo "=========================================="
          echo ""
          echo "-- grep for 'common' mentions in build configs --"
          grep -rl "common" "$MTK_DIR"/build.config* 2>/dev/null | while read -r F; do
            echo "--- $F ---"
            grep -n "common" "$F"
          done

          echo ""
          echo "-- grep for 'common' mentions in top-level BUILD.bazel --"
          grep -n "common" "$MTK_DIR/BUILD.bazel" 2>/dev/null

          echo ""
          echo "-- README / documentation mentioning a compatible revision --"
          find "$MTK_DIR" -maxdepth 1 -iname "README*" -exec cat {} \; 2>/dev/null | head -80

          echo ""
          echo "-- most recent commits (may reference which common tag they synced against) --"
          git -C "$MTK_DIR" log -5 --oneline 2>/dev/null

          echo ""
          echo "=========================================="
          echo "Cloning the 3rd tree: vendor/mediatek/kernel_modules"
          echo "=========================================="
          echo ""
          echo "(build.config.mtk_kernel_device_modules referenced"
          echo "../vendor/mediatek/kernel_modules/connectivity/common -"
          echo "checking it out as a sibling of mtk_device_modules so that"
          echo "relative path resolves the same way it would in a real manifest)"

          VENDOR_MTK_DIR="$KERNEL_DIR/vendor/mediatek/kernel_modules"
          mkdir -p "$(dirname "$VENDOR_MTK_DIR")"
          rm -rf "$VENDOR_MTK_DIR"

          WMT_COMPILE_TEST_DIR=""

          if git clone --depth=1 \
            "https://github.com/mt6897-devs/android_vendor_mediatek_kernel_modules" \
            "$VENDOR_MTK_DIR" 2>&1; then

            echo ""
            echo "Cloned successfully."

            echo ""
            echo "Top-level structure:"
            find "$VENDOR_MTK_DIR" -maxdepth 1 -mindepth 1 | sort

            echo ""
            echo "Looking for connectivity/common specifically:"
            find "$VENDOR_MTK_DIR" -maxdepth 3 -iname "connectivity" -o -maxdepth 3 -iname "common" 2>/dev/null

            echo ""
            echo "Looking for WMT/CONSYS driver source inside it:"
            find "$VENDOR_MTK_DIR" -iname "*wmt*" -o -iname "*consys*" 2>/dev/null | head -30

            echo ""
            echo "=========================================="
            echo "Looking for conninfra's own build entry point"
            echo "=========================================="
            echo ""
            echo "(This is the lower-level power-sequencing/CONSYS layer -"
            echo "the actual kernel log diagnosis pointed here, not at the"
            echo "wlan/adaptor character-device layer above it, so this"
            echo "may matter more for actually fixing WiFi than what was"
            echo "just proven to compile.)"

            find "$VENDOR_MTK_DIR/connectivity/conninfra" \
              -maxdepth 1 \
              -type f \( -iname "Kbuild" -o -iname "Makefile" \) 2>/dev/null | sort

            # NOTE: last run confirmed Kbuild/Makefile live directly in
            # conninfra/ itself - there is no separate per-platform
            # subdirectory with its own Kbuild the way connac3x has for
            # wlan/adaptor. Platform selection (mt6897 vs mt6985 etc.)
            # is presumably an internal Makefile variable instead - if
            # one is required and not defaulted, that will show up
            # clearly in the compile attempt's own output below.

            if [ -f "$VENDOR_MTK_DIR/connectivity/conninfra/Kbuild" ]; then
              CONNINFRA_DIR="$VENDOR_MTK_DIR/connectivity/conninfra"
            else
              CONNINFRA_DIR=""
            fi

            echo ""
            echo "conninfra build dir:"
            echo "${CONNINFRA_DIR:-<none found>}"

            WMT_COMPILE_TEST_DIR="$VENDOR_MTK_DIR/connectivity/wlan/adaptor/build/connac3x"

          else

            echo ""
            echo "::warning::Could not clone android_vendor_mediatek_kernel_modules."
            echo "::warning::Repo name/path may differ from what was found via search."

          fi

          # ------------------------------------------------------------
          # COMPILE TEST (still just a test - nothing here touches the
          # flashable AK3 output). This checks whether the WMT/connac3x
          # driver source even compiles as a standard out-of-tree module
          # against the kernel we already built, using the Module
          # support files GKI kernels publish specifically for this
          # (Module.symvers / headers in dist/). If this fails, that's
          # itself useful information - it would mean MediaTek's driver
          # needs source-level changes to build against this kernel
          # commit, not just the right directory layout.
          # ------------------------------------------------------------

          echo ""
          echo "=========================================="
          echo "Compile test: MediaTek modules vs our built kernel"
          echo "=========================================="

          KERNEL_DIST="$KERNEL_DIR/out/kernel_aarch64/dist"

          # Reusable now that connac3x proved this mechanism actually
          # works: correct clang + its sibling llvm-* tools on PATH,
          # M= relative to common/ (required by MediaTek's custom
          # Kbuild.include path concatenation), built against the
          # published modules_prepare_outdir. Tries a given module
          # directory and reports success/failure - never touches the
          # flashable AK3 output.
          try_compile_mtk_module() {

            local LABEL="$1"
            local SRC_DIR="$2"

            echo ""
            echo "------------------------------------------"
            echo "Target: $LABEL"
            echo "------------------------------------------"

            if [ -z "$SRC_DIR" ] || [ ! -d "$SRC_DIR" ]; then
              echo "Skipping - source directory not available."
              return
            fi

            if [ ! -f "$KERNEL_DIST/kernel_aarch64_Module.symvers" ] || [ ! -f "$KERNEL_DIST/modules_prepare_outdir.tar.gz" ]; then
              echo "Skipping - required dist artifacts not found."
              return
            fi

            echo "Source: $SRC_DIR"

            local PREPARED_OUTDIR="$KERNEL_DIR/modules_prepare_outdir"
            rm -rf "$PREPARED_OUTDIR"
            mkdir -p "$PREPARED_OUTDIR"
            tar -xzf "$KERNEL_DIST/modules_prepare_outdir.tar.gz" -C "$PREPARED_OUTDIR"
            cp "$KERNEL_DIST/kernel_aarch64_Module.symvers" "$PREPARED_OUTDIR/Module.symvers"

            # M= must be relative to common/ - MediaTek's Kbuild.include
            # concatenates $(srctree)/$(M)/../../Kbuild as a literal
            # string, and srctree resolves to $KERNEL_DIR/common.
            local REL_M
            REL_M="$(realpath --relative-to="$KERNEL_DIR/common" "$SRC_DIR")"
            echo "M= (relative to common/): $REL_M"

            timeout 180 make -C "$PREPARED_OUTDIR" \
              M="$REL_M" \
              ARCH=arm64 \
              ${CLANG_BIN:+CC="$CLANG_BIN"} \
              LLVM=1 \
              modules 2>&1 | tail -150

            local COMPILE_RESULT=$?

            echo ""
            if [ "$COMPILE_RESULT" -eq 0 ] && find "$SRC_DIR" -name "*.ko" | grep -q .; then
              echo "✓✓✓ COMPILE SUCCEEDED - .ko produced:"
              find "$SRC_DIR" -name "*.ko"

              mkdir -p "$KERNEL_DIR/mtk_modules_output"
              find "$SRC_DIR" -name "*.ko" -exec cp {} "$KERNEL_DIR/mtk_modules_output/" \;
              echo "Preserved to: $KERNEL_DIR/mtk_modules_output/"
            else
              echo "✗ Compile did not produce a .ko (exit code: $COMPILE_RESULT)."
            fi

            rm -rf "$PREPARED_OUTDIR"

          }

          # ------------------------------------------------------------
          # Locate the correct AOSP clang once (shared by both targets).
          # See prior run notes: Bazel's real output root turned out to
          # be $KERNEL_DIR/out/bazel/output_user_root/<hash>, and the
          # toolchain itself is actually a repo-synced project at
          # prebuilts/clang/host/linux-x86/clang-r487747c, not something
          # Bazel downloaded into its own cache - hence searching by the
          # exact release tag rather than a bare "clang" filename.
          # ------------------------------------------------------------

          CLANG_BIN="$(find "$GITHUB_WORKSPACE/clang" -maxdepth 6 -iname clang -type f 2>/dev/null | head -n1)"

          if [ -z "$CLANG_BIN" ]; then

            BAZEL_OUTPUT_BASE="$(cd "$KERNEL_DIR" 2>/dev/null && tools/bazel info output_base 2>/dev/null)"
            echo "Bazel output_base: ${BAZEL_OUTPUT_BASE:-<not found>}"

            R487747C_DIR="$(find "$KERNEL_DIR" "$BAZEL_OUTPUT_BASE" -maxdepth 15 -type d -iname "*r487747c*" 2>/dev/null | head -n1)"
            echo "r487747c dir: ${R487747C_DIR:-<none>}"

            if [ -n "$R487747C_DIR" ]; then
              CLANG_BIN="$(find "$R487747C_DIR" -type f -iname clang 2>/dev/null | grep -v "clang-tidy\|clang-format\|clang-check" | head -n1)"
            fi

            if [ -z "$CLANG_BIN" ] && [ -n "$BAZEL_OUTPUT_BASE" ] && [ -d "$BAZEL_OUTPUT_BASE" ]; then
              CLANG_BIN="$(timeout 60 find "$BAZEL_OUTPUT_BASE" -type f -iname clang 2>/dev/null | grep -v "clang-tidy\|clang-format\|clang-check" | head -n1)"
            fi

            if [ -z "$CLANG_BIN" ]; then
              CLANG_BIN="$(find "$KERNEL_DIR" -maxdepth 8 -type f -iname clang -path "*clang*/bin/*" 2>/dev/null | head -n1)"
            fi

          fi

          if [ -z "$CLANG_BIN" ]; then
            echo "::warning::Could not find the AOSP clang used for the main build."
          else
            echo "Using: $CLANG_BIN"
            "$CLANG_BIN" --version 2>&1 | head -3
            export PATH="$(dirname "$CLANG_BIN"):$PATH"
            echo "llvm-nm resolves to: $(command -v llvm-nm 2>/dev/null || echo '<not found>')"
          fi

          try_compile_mtk_module \
            "wlan/adaptor connac3x (already proven working)" \
            "$WMT_COMPILE_TEST_DIR"

          try_compile_mtk_module \
            "conninfra (power-sequencing/CONSYS - what the kernel log actually pointed to)" \
            "$CONNINFRA_DIR"

          echo ""
          echo "=========================================="
          echo "Cleaning up - these trees are large and were the direct"
          echo "cause of a 'No space left on device' failure last run"
          echo "=========================================="

          rm -rf "$MTK_DIR" "$KERNEL_DIR/vendor"

          echo ""
          echo "Also freeing Bazel's transient scratch space now that the"
          echo "compile test (which needed its cached clang toolchain) is"
          echo "done with it. Not touching ~/.cache/bazel-disk, the"
          echo "persistent cache actions/cache saves for next run's speed."

          cd "$KERNEL_DIR" 2>/dev/null && tools/bazel shutdown 2>&1 | tail -5
          rm -rf "$HOME/.cache/bazel/_bazel_$(whoami)"/*/execroot 2>/dev/null
          rm -rf "$HOME/.cache/bazel/_bazel_$(whoami)"/*/output-base 2>/dev/null

          df -h "$KERNEL_DIR" 2>/dev/null || true

          echo ""
          echo "=========================================="
          echo "End of inspection - nothing above affects the AK3 zip"
          echo "=========================================="


      # ============================================================
      # VERIFY BUILD OUTPUT
      # ============================================================

      - name: Verify Build Output
        if: success()
        run: |
          set -e
          
          echo "=========================================="
          echo "Verifying Build Output"
          echo "=========================================="
          
          # Check the real Kleaf dist output path first (confirmed from
          # an actual successful build), then a few fallbacks in case
          # the target or Kleaf version ever changes this convention.
          KERNEL_OUT_PATHS=(
            "$KERNEL_DIR/out/kernel_aarch64/dist"
            "$KERNEL_DIR/common/out"
            "$KERNEL_DIR/out"
            "$DIST_DIR"
            "$KERNEL_DIR/common/dist"
          )
          
          FOUND=false
          for OUT_PATH in "${KERNEL_OUT_PATHS[@]}"; do
            if [ -d "$OUT_PATH" ]; then
              echo ""
              echo "Checking $OUT_PATH:"
              if [ -f "$OUT_PATH/vmlinux" ] || [ -f "$OUT_PATH/boot.img" ]; then
                echo "✓ Kernel output files found!"
                find "$OUT_PATH" -type f | head -20
                FOUND=true
                break
              fi
            fi
          done
          
          if [ "$FOUND" = false ]; then
            echo ""
            echo "::error::Kernel output files not found"
            echo ""
            echo "Searching entire kernel directory for output:"
            find "$KERNEL_DIR" -name "vmlinux" -o -name "boot.img" -o -name "Image*" 2>/dev/null | head -20 || echo "No kernel images found"
          fi
          
          echo ""
          echo "✓ Build output verification complete"


      # ============================================================
      # CHECK GKI KMI/ABI COMPLIANCE (DIAGNOSTIC)
      # ============================================================
      #
      # GKI kernels enforce ABI compatibility at runtime via symbol
      # versioning (CONFIG_MODVERSIONS): a vendor's prebuilt kernel
      # module (e.g. the device's WiFi driver) will refuse to load if
      # its expected symbol checksums don't match this kernel's actual
      # ones. The SUSFS patch touches many core files across fs/,
      # security/selinux/, kernel/, mm/ - if any of that shifts a
      # protected symbol's checksum, otherwise-compatible vendor
      # modules can fail to load on real hardware even though the
      # kernel itself compiles and boots fine.
      #
      # This is a best-effort, informational check using whatever the
      # Kleaf build itself already produced (gki_certification_tools) -
      # it does not fail the build either way, since the exact tool
      # interface can change between Kleaf versions and this is meant
      # to surface evidence, not gate the pipeline.
      # ============================================================

      - name: Check GKI KMI/ABI Compliance (diagnostic)
        if: success()
        continue-on-error: true
        run: |
          set +e

          KERNEL_DIST="$KERNEL_DIR/out/kernel_aarch64/dist"
          CERT_TOOLS="$KERNEL_DIST/gki_certification_tools.tar.gz"

          echo "=========================================="
          echo "GKI KMI/ABI compliance check (best-effort)"
          echo "=========================================="

          if [ ! -f "$CERT_TOOLS" ]; then
            echo "gki_certification_tools.tar.gz not found in dist output, skipping."
            exit 0
          fi

          WORKDIR="$KERNEL_DIR/gki_cert_check"
          rm -rf "$WORKDIR"
          mkdir -p "$WORKDIR"

          tar -xzf "$CERT_TOOLS" -C "$WORKDIR"

          echo ""
          echo "Contents of gki_certification_tools.tar.gz:"
          find "$WORKDIR" -maxdepth 2 -type f | sort

          echo ""
          echo "Looking for a runnable certification/check script..."

          CHECK_SCRIPT="$(
            find "$WORKDIR" \
              -maxdepth 2 \
              -type f \
              \( -iname "*certif*" -o -iname "*check*abi*" -o -iname "*kmi*" \) \
              -perm -u+x \
              | head -n1
          )"

          if [ -z "$CHECK_SCRIPT" ]; then
            echo "No obviously-runnable check script found (interface may differ"
            echo "in this Kleaf version). Skipping - this is informational only."
            exit 0
          fi

          echo ""
          echo "Found: $CHECK_SCRIPT"
          echo "Attempting to run it against the dist output (best-effort)..."
          echo ""

          cd "$KERNEL_DIST"
          "$CHECK_SCRIPT" --help 2>&1 | head -40
          echo ""
          echo "(Ran with --help only, to see its expected usage without"
          echo "guessing flags that might not apply to this kernel/target.)"

          echo ""
          echo "=========================================="
          echo "End of GKI KMI/ABI compliance check"
          echo "=========================================="


      # ============================================================
      # PACKAGE ANYKERNEL3 ZIP
      # ============================================================
      #
      # The raw Bazel dist/ output contains a dozen+ files (vmlinux,
      # System.map, several system_dlkm.* variants, boot.img, boot-*.img,
      # Image in three compressions, etc.) - most of which a person
      # flashing the kernel never needs. This step packages just the
      # compiled kernel image into a single ready-to-flash AnyKernel3
      # zip, which is what actually gets flashed via TWRP/recovery or
      # an app like Kernel Flasher.
      # ============================================================

      - name: Package AnyKernel3 Zip
        if: success()
        run: |
          set -e

          KERNEL_DIST="$KERNEL_DIR/out/kernel_aarch64/dist"

          echo "=========================================="
          echo "Packaging AnyKernel3 zip"
          echo "=========================================="

          if [ ! -d "$KERNEL_DIST" ]; then
            echo "::error::Dist directory not found: $KERNEL_DIST"
            exit 1
          fi

          # ------------------------------------------------------------
          # Full kernel version (e.g. "6.1.180"), not just the dropdown's
          # major.minor ("6.1"). The patch/sublevel number only exists
          # in the actual checked-out source, read straight from the
          # kernel Makefile the same way the kernel build itself does.
          # ------------------------------------------------------------

          echo ""
          echo "Reading full kernel version from Makefile..."

          cd "$KERNEL_DIR/common"

          KVERSION="$(grep -m1 '^VERSION = ' Makefile | awk '{print $3}')"
          KPATCHLEVEL="$(grep -m1 '^PATCHLEVEL = ' Makefile | awk '{print $3}')"
          KSUBLEVEL="$(grep -m1 '^SUBLEVEL = ' Makefile | awk '{print $3}')"

          if [ -z "$KVERSION" ] || [ -z "$KPATCHLEVEL" ] || [ -z "$KSUBLEVEL" ]; then
            echo "::warning::Could not fully parse kernel version from Makefile, falling back to dropdown value"
            FULL_KERNEL_VERSION="${{ github.event.inputs.kernel_version }}"
          else
            FULL_KERNEL_VERSION="$KVERSION.$KPATCHLEVEL.$KSUBLEVEL"
          fi

          echo "Full kernel version: $FULL_KERNEL_VERSION"

          cd "$KERNEL_DIR"

          echo ""
          echo "Selecting kernel image..."

          KERNEL_IMAGE=""
          for CANDIDATE in Image Image.lz4 Image.gz; do
            if [ -f "$KERNEL_DIST/$CANDIDATE" ]; then
              KERNEL_IMAGE="$KERNEL_DIST/$CANDIDATE"
              break
            fi
          done

          if [ -z "$KERNEL_IMAGE" ]; then
            echo "::error::No kernel Image (Image / Image.lz4 / Image.gz) found in $KERNEL_DIST"
            ls -la "$KERNEL_DIST"
            exit 1
          fi

          echo "Using: $(basename "$KERNEL_IMAGE") ($(du -h "$KERNEL_IMAGE" | cut -f1))"

          # ------------------------------------------------------------
          # Root manager display name (for the filename, banner and
          # Telegram caption) and its manager-app download link. The
          # kernel driver is fully active the moment the phone boots
          # this kernel - what still needs a manual, separate install
          # is the userspace manager APK, which is true for every
          # KernelSU-family kernel, not something a kernel zip can
          # bundle/auto-install safely. Pointing straight at the right
          # link removes the guesswork.
          # ------------------------------------------------------------

          ROOT_MANAGER="${{ github.event.inputs.root_manager }}"
          ROOT_MANAGER_SLUG="$(echo "$ROOT_MANAGER" | tr -d '-')"

          case "$ROOT_MANAGER" in
            "KernelSU-Next")
              MANAGER_APP_URL="https://github.com/KernelSU-Next/KernelSU-Next/releases"
              ;;
            "SukiSU-Ultra")
              MANAGER_APP_URL="https://github.com/SukiSU-Ultra/SukiSU-Ultra/releases"
              ;;
            "ReSukiSU")
              MANAGER_APP_URL="https://resukisu.github.io/"
              ;;
            "Vanilla")
              MANAGER_APP_URL=""
              ;;
          esac

          if [ "${{ github.event.inputs.susfs_status }}" = "enable" ]; then
            SUSFS_SLUG="SUSFS"
          else
            SUSFS_SLUG="NoSUSFS"
          fi

          BUILD_NUMBER="$(printf '%03d' "${{ github.run_number }}")"

          echo ""
          echo "Fetching AnyKernel3 template (KernelSU-Next fork - GKI-ready)..."

          rm -rf "$KERNEL_DIR/AnyKernel3"

          git clone \
            --depth=1 \
            --no-tags \
            https://github.com/KernelSU-Next/AnyKernel3.git \
            "$KERNEL_DIR/AnyKernel3"

          cd "$KERNEL_DIR/AnyKernel3"

          rm -rf .git
          rm -f Image* zImage* *-dtb 2>/dev/null || true
          # NOTE: LICENSE is intentionally kept - AnyKernel3's own
          # instructions require it to remain in the final zip.

          cp "$KERNEL_IMAGE" "./$(basename "$KERNEL_IMAGE")"

          echo ""
          echo "Writing banner..."

          {
            echo "============================================="
            echo " ${{ github.event.inputs.kernel_name }}"
            echo " GKI $FULL_KERNEL_VERSION (Android ${{ env.ANDROID_VERSION }})"
            echo "============================================="
            echo " Compiler   : ${{ github.event.inputs.compiler }}"
            echo " LTO        : ${{ github.event.inputs.lto_mode }}"
            echo " Root       : $ROOT_MANAGER"
            echo " SUSFS      : ${{ github.event.inputs.susfs_status }}"
            echo " Build      : #$BUILD_NUMBER"
            echo "============================================="
            if [ -n "$MANAGER_APP_URL" ]; then
              echo " Install the matching manager app after boot:"
              echo " $MANAGER_APP_URL"
              echo "============================================="
            fi
          } > banner

          KERNEL_STRING="${{ github.event.inputs.kernel_name }} | GKI $FULL_KERNEL_VERSION | $ROOT_MANAGER | SUSFS=${{ github.event.inputs.susfs_status }}"

          sed -i "s#kernel\.string=.*#kernel.string=$KERNEL_STRING#" anykernel.sh

          echo ""
          echo "Adding banner display to anykernel.sh..."

          # Print the banner as the very first thing the installer does.
          # ui_print is already defined by the update-binary wrapper that
          # sources this script, so it's safe to call here before the
          # properties block / ak3-core.sh sourcing further down. Using
          # cat+move here instead of sed's insert command since the
          # snippet contains characters (quotes, $, ;) that are easy to
          # get subtly wrong through sed's own escaping rules.
          {
            echo 'if [ -f banner ]; then while IFS= read -r bannerline || [ -n "$bannerline" ]; do ui_print "$bannerline"; done < banner; fi'
            cat anykernel.sh
          } > anykernel.sh.new
          mv anykernel.sh.new anykernel.sh
          chmod +x anykernel.sh

          echo ""
          echo "anykernel.sh header:"
          grep -m1 "kernel.string" anykernel.sh

          ZIP_NAME="${{ github.event.inputs.kernel_name }}-AK3-${FULL_KERNEL_VERSION}-${ROOT_MANAGER_SLUG}-${SUSFS_SLUG}-${BUILD_NUMBER}.zip"

          echo ""
          echo "Building zip: $ZIP_NAME"

          zip -r9 "$KERNEL_DIR/$ZIP_NAME" . -x ".git*"

          cd "$KERNEL_DIR"

          echo ""
          echo "AK3_ZIP_PATH=$KERNEL_DIR/$ZIP_NAME" >> "$GITHUB_ENV"
          echo "AK3_ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"
          echo "AK3_ZIP_BASENAME=${ZIP_NAME%.zip}" >> "$GITHUB_ENV"
          echo "FULL_KERNEL_VERSION=$FULL_KERNEL_VERSION" >> "$GITHUB_ENV"
          echo "MANAGER_APP_URL=$MANAGER_APP_URL" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"

          echo ""
          echo "✓ AnyKernel3 zip ready: $ZIP_NAME ($(du -h "$KERNEL_DIR/$ZIP_NAME" | cut -f1))"




      - name: Generate Build Summary
        if: success()
        run: |
          set -e
          
          echo "=========================================="
          echo "BUILD SUMMARY"
          echo "=========================================="
          echo ""
          echo "Status: ✓ SUCCESS"
          echo "Build Date: $(date)"
          echo ""
          echo "Configuration:"
          echo "  Kernel Name: ${{ github.event.inputs.kernel_name }}"
          echo "  Android Version: ${{ env.ANDROID_VERSION }}"
          echo "  Kernel Version: ${{ env.FULL_KERNEL_VERSION }}"
          echo "  Compiler: ${{ github.event.inputs.compiler }}"
          echo "  LTO Mode: ${{ github.event.inputs.lto_mode }}"
          echo "  Root Manager: ${{ github.event.inputs.root_manager }}"
          echo "  SUSFS: ${{ github.event.inputs.susfs_status }}"
          echo "  Build Number: ${{ env.BUILD_NUMBER }}"
          echo ""
          echo "AnyKernel3 zip: ${{ env.AK3_ZIP_NAME }}"
          echo ""
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Workflow: $GITHUB_WORKFLOW"
          echo "Run ID: $GITHUB_RUN_ID"
          echo ""
          echo "=========================================="


      # ============================================================
      # UPLOAD ARTIFACTS
      # ============================================================

      - name: Upload Build Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.AK3_ZIP_BASENAME }}
          path: ${{ env.AK3_ZIP_PATH }}
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Raw Dist Files (advanced/debugging)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: raw-dist-${{ env.ANDROID_VERSION }}-${{ github.event.inputs.kernel_version }}-${{ github.event.inputs.compiler }}-${{ github.event.inputs.lto_mode }}-${{ env.BUILD_NUMBER }}
          path: ${{ env.KERNEL_DIR }}/out/kernel_aarch64/dist
          retention-days: 7
          if-no-files-found: warn

      - name: "[EXPERIMENTAL] Upload MediaTek Connectivity Modules"
        if: ${{ github.event.inputs.experimental_mtk_modules == 'enable' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: mtk-connectivity-modules-${{ env.BUILD_NUMBER }}
          path: ${{ env.KERNEL_DIR }}/mtk_modules_output
          retention-days: 7
          if-no-files-found: warn


      # ============================================================
      # SEND KERNEL TO TELEGRAM
      # ============================================================

      - name: Send Build to Telegram
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          THREAD_ID: '4'
        shell: bash
        run: |
          set -e
          
          echo "=========================================="
          echo "Sending build to Telegram"
          echo "=========================================="
          
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::error::Telegram secrets not configured"
            echo "Please setup TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID in GitHub Secrets"
            exit 1
          fi
          
          if [ -z "${AK3_ZIP_PATH:-}" ] || [ ! -f "$AK3_ZIP_PATH" ]; then
            echo "::warning::No AnyKernel3 zip found to send (AK3_ZIP_PATH='$AK3_ZIP_PATH')"
            exit 0
          fi
          
          FILENAME="$(basename "$AK3_ZIP_PATH")"
          FILESIZE="$(du -h "$AK3_ZIP_PATH" | cut -f1)"
          RUN_URL="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          
          echo ""
          echo "Sending: $FILENAME ($FILESIZE)"
          
          # ------------------------------------------------------------
          # NOTE: this previously used parse_mode=Markdown (legacy), which
          # actually FAILED against the real Telegram API: it treats a
          # lone "_" as the start of an italic span, and values like
          # "Amon_Kernel" contain one. With an odd/mismatched number of
          # underscores across the message, Telegram couldn't resolve
          # the entity and rejected the whole request with "can't parse
          # entities" - confirmed from an actual failed run, not just a
          # local simulation (bash-level newline handling was already
          # correct; this was purely a Telegram-side parsing rule).
          #
          # HTML mode doesn't have that problem: only "<", ">" and "&"
          # are special, so kernel names/filenames with underscores,
          # dots, dashes etc. are always safe. The only thing this still
          # needs to guard is escaping those three characters in any
          # value that came from free text (kernel_name).
          # ------------------------------------------------------------
          
          html_escape() {
            local s="$1"
            s="${s//&/&amp;}"
            s="${s//</&lt;}"
            s="${s//>/&gt;}"
            printf '%s' "$s"
          }
          
          KERNEL_NAME_ESC="$(html_escape "${{ github.event.inputs.kernel_name }}")"
          FILENAME_ESC="$(html_escape "$FILENAME")"
          
          CAPTION_LINES=(
            "✨ <b>${KERNEL_NAME_ESC} Build Success</b> ✨"
            ""
            "<pre>"
            "Kernel      : Linux ${{ env.ANDROID_VERSION }}-$FULL_KERNEL_VERSION"
            "Compiler    : ${{ github.event.inputs.compiler }}"
            "LTO         : ${{ github.event.inputs.lto_mode }}"
            ""
            "Root Manager: ${{ github.event.inputs.root_manager }}"
            "SUSFS       : ${{ github.event.inputs.susfs_status }}"
            ""
            "File        : $FILENAME_ESC"
            "Size        : $FILESIZE"
            "Build       : #$BUILD_NUMBER"
            "</pre>"
            ""
            "✅ Ready to flash (AnyKernel3)!"
          )
          
          # "Manager app version: <short commit>" - the commit is what
          # this specific build actually compiled against (captured by
          # the "Capture Root Manager Info" step), linked to the
          # community Telegram channel for that root manager. There is
          # no reliable way to query "the current latest CI build
          # number" from inside this workflow, so this links to the
          # channel itself rather than guessing a number that might not
          # match.
          if [ -n "${ROOT_MANAGER_COMMIT:-}" ] && [ -n "${ROOT_MANAGER_TG_URL:-}" ]; then
            CAPTION_LINES+=("📲 Manager app version: <a href=\"$ROOT_MANAGER_TG_URL\">$ROOT_MANAGER_COMMIT</a>")
          fi
          
          CAPTION_LINES+=("🔗 Run: #$GITHUB_RUN_ID")
          
          CAPTION="$(printf '%s\n' "${CAPTION_LINES[@]}")"
          
          RESPONSE=$(curl -s -F chat_id="$TELEGRAM_CHAT_ID" \
               -F message_thread_id="$THREAD_ID" \
               -F document=@"$AK3_ZIP_PATH" \
               -F caption="$CAPTION" \
               -F parse_mode="HTML" \
               "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendDocument")
          
          if echo "$RESPONSE" | grep -q '"ok":true'; then
            echo ""
            echo "=========================================="
            echo "✓ AnyKernel3 zip sent to Telegram"
            echo "=========================================="
          else
            echo "::error::Failed to upload file to Telegram"
            echo "Response: $RESPONSE"
            exit 1
          fi
