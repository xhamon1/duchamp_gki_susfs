name: Build GKI Kernel with Custom Options

on:
  workflow_dispatch:
    inputs:
      compiler:
        description: 'Select Compiler'
        required: true
        default: 'AOSP'
        type: choice
        options:
          - 'AOSP'
          - 'GreenForce'
          - 'Neutron'
          - 'WeebX'
          - 'Zyc'

      kernel_version:
        description: 'Kernel Version'
        required: true
        default: '6.1'
        type: choice
        options:
          - '6.1'

      root_manager:
        description: 'Select Root Manager / Mode'
        required: true
        default: 'KernelSU-Next'
        type: choice
        options:
          - 'KernelSU-Next'
          - 'SukiSU-Ultra'
          - 'ReSukiSU'
          - 'Vanilla'

      susfs_status:
        description: 'SUSFS'
        required: true
        default: 'enable'
        type: choice
        options:
          - 'enable'
          - 'disable'

      lto_mode:
        description: 'LTO Mode'
        required: true
        default: 'NONE'
        type: choice
        options:
          - 'NONE'
          - 'THIN'
          - 'FULL'

      run_mode:
        description: 'Run Mode'
        required: true
        default: 'Build'
        type: choice
        options:
          - 'Build'
          - 'Test Only'

jobs:
  build:
    name: Build GKI
    runs-on: ubuntu-22.04

    steps:

      # ---------------------------------------------------------
      # Maximize build space
      # ---------------------------------------------------------
      - name: Maximize Build Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY" || true

          df -h

      # ---------------------------------------------------------
      # Checkout repository
      # ---------------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # Install dependencies
      # ---------------------------------------------------------
      - name: Install Dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            cpio \
            curl \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            lz4 \
            patch \
            python3 \
            python3-pip \
            rsync \
            unzip \
            wget \
            zip

      # ---------------------------------------------------------
      # Setup compiler selection
      #
      # NOTE:
      # Android Common Kernel Android 14 uses Kleaf/Bazel
      # with its own hermetic AOSP Clang toolchain.
      #
      # The external compiler repositories are kept here for
      # compatibility with the existing workflow, but Kleaf
      # will use the kernel's configured toolchain by default.
      # ---------------------------------------------------------
      - name: Setup Clang Compiler
        env:
          SELECTED_COMPILER: ${{ github.event.inputs.compiler }}
        run: |
          echo "Selected compiler: $SELECTED_COMPILER"

          case "$SELECTED_COMPILER" in
            "AOSP")
              echo "Using the hermetic AOSP Clang toolchain provided by Kleaf."
              ;;

            "GreenForce")
              echo "::warning::GreenForce selected. Kleaf Android 14 uses its configured hermetic toolchain; external PATH clang is not automatically used."
              ;;

            "Neutron")
              echo "::warning::Neutron selected. Kleaf Android 14 uses its configured hermetic toolchain; external PATH clang is not automatically used."
              ;;

            "WeebX")
              echo "::warning::WeebX selected. Kleaf Android 14 uses its configured hermetic toolchain; external PATH clang is not automatically used."
              ;;

            "Zyc")
              echo "::warning::Zyc selected. Kleaf Android 14 uses its configured hermetic toolchain; external PATH clang is not automatically used."
              ;;

            *)
              echo "::error::Unknown compiler selection."
              exit 1
              ;;
          esac

      # ---------------------------------------------------------
      # Clone Android Common Kernel
      # ---------------------------------------------------------
      - name: Clone GKI Source
        env:
          K_VER: ${{ github.event.inputs.kernel_version }}
        run: |
          set -e

          echo "=========================================="
          echo "Cloning Android Common Kernel"
          echo "Branch: android14-$K_VER"
          echo "=========================================="

          git clone \
            https://android.googlesource.com/kernel/common \
            -b "android14-$K_VER" \
            --depth=1 \
            kernel_source

          cd kernel_source

          echo "Kernel commit:"
          git log -1 --oneline

          echo
          echo "Checking Kleaf files..."

          test -f BUILD.bazel
          test -f WORKSPACE || test -f MODULE.bazel
          test -x tools/bazel

          echo "Kleaf/Bazel environment detected successfully."

      # ---------------------------------------------------------
      # Apply Root Manager
      # ---------------------------------------------------------
      - name: Apply Root Manager
        if: ${{ github.event.inputs.root_manager != 'Vanilla' }}
        env:
          ROOT_MGR: ${{ github.event.inputs.root_manager }}
        run: |
          set -e

          cd kernel_source

          echo "=========================================="
          echo "Applying Root Manager: $ROOT_MGR"
          echo "=========================================="

          case "$ROOT_MGR" in

            "KernelSU-Next")
              echo "Installing KernelSU-Next..."

              curl -LSs \
                "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/kernel/setup.sh" \
                | bash -s main
              ;;

            "SukiSU-Ultra")
              echo "Installing SukiSU-Ultra..."

              curl -LSs \
                "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" \
                | bash -s main
              ;;

            "ReSukiSU")
              echo "Installing ReSukiSU..."

              curl -LSs \
                "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" \
                | bash -s main
              ;;

            *)
              echo "::error::Unsupported root manager: $ROOT_MGR"
              exit 1
              ;;
          esac

          echo
          echo "Root manager installation completed."

      # ---------------------------------------------------------
      # Apply SUSFS
      # ---------------------------------------------------------
      - name: Download and Apply SUSFS Patch
        if: ${{ github.event.inputs.susfs_status == 'enable' && github.event.inputs.root_manager != 'Vanilla' }}
        run: |
          set -e

          cd kernel_source

          echo "=========================================="
          echo "Downloading SUSFS"
          echo "=========================================="

          git clone \
            https://gitlab.com/simonpunk/susfs4ksu.git \
            -b gki-android14-6.1 \
            --depth=1 \
            susfs4ksu

          echo
          echo "Copying SUSFS kernel files..."

          cp -rf susfs4ksu/kernel_patches/fs/* fs/
          cp -rf susfs4ksu/kernel_patches/include/* include/

          echo
          echo "Applying SUSFS patch..."

          patch \
            -p1 \
            --ignore-whitespace \
            -i susfs4ksu/kernel_patches/50_add_susfs_in_gki-android14-6.1.patch

          echo
          echo "SUSFS patch applied successfully."

      # ---------------------------------------------------------
      # Show build configuration
      # ---------------------------------------------------------
      - name: Show Build Configuration
        env:
          ROOT_MGR: ${{ github.event.inputs.root_manager }}
          SUSFS: ${{ github.event.inputs.susfs_status }}
          LTO: ${{ github.event.inputs.lto_mode }}
          COMPILER: ${{ github.event.inputs.compiler }}
        run: |
          echo "=========================================="
          echo "BUILD CONFIGURATION"
          echo "=========================================="
          echo "Kernel      : Android 14 - 6.1"
          echo "Compiler    : $COMPILER"
          echo "Root Manager: $ROOT_MGR"
          echo "SUSFS       : $SUSFS"
          echo "LTO         : $LTO"
          echo "=========================================="

      # ---------------------------------------------------------
      # Build GKI using Kleaf/Bazel
      # ---------------------------------------------------------
      - name: Build GKI Kernel
        if: ${{ github.event.inputs.run_mode == 'Build' }}
        env:
          LTO_VAL: ${{ github.event.inputs.lto_mode }}
        run: |
          set -e

          cd kernel_source

          DIST_DIR="$GITHUB_WORKSPACE/kernel_source/out/dist"

          mkdir -p "$DIST_DIR"

          echo "=========================================="
          echo "Preparing Kleaf build"
          echo "=========================================="

          case "$LTO_VAL" in
            "NONE")
              LTO_ARG="default"
              ;;

            "THIN")
              LTO_ARG="thin"
              ;;

            "FULL")
              LTO_ARG="full"
              ;;

            *)
              echo "::error::Invalid LTO mode: $LTO_VAL"
              exit 1
              ;;
          esac

          echo "LTO mode: $LTO_ARG"
          echo "Distribution directory: $DIST_DIR"

          echo
          echo "Bazel version:"
          tools/bazel --version

          echo
          echo "=========================================="
          echo "Starting Android Common Kernel build"
          echo "Target: //common:kernel_aarch64_dist"
          echo "=========================================="

          tools/bazel run \
            --lto="$LTO_ARG" \
            //common:kernel_aarch64_dist \
            -- \
            --dist_dir="$DIST_DIR"

          echo
          echo "=========================================="
          echo "Build completed successfully"
          echo "=========================================="

          echo
          echo "Generated artifacts:"
          find "$DIST_DIR" -maxdepth 2 -type f -print | sort

      # ---------------------------------------------------------
      # Test Only mode
      # ---------------------------------------------------------
      - name: Test Kleaf Configuration
        if: ${{ github.event.inputs.run_mode == 'Test Only' }}
        run: |
          set -e

          cd kernel_source

          echo "=========================================="
          echo "Testing Kleaf configuration"
          echo "=========================================="

          tools/bazel query //common:kernel_aarch64_dist

          echo
          echo "Kleaf target is available."

      # ---------------------------------------------------------
      # Verify artifacts
      # ---------------------------------------------------------
      - name: Verify Kernel Artifacts
        if: ${{ github.event.inputs.run_mode == 'Build' }}
        run: |
          set -e

          DIST_DIR="$GITHUB_WORKSPACE/kernel_source/out/dist"

          echo "=========================================="
          echo "Verifying build artifacts"
          echo "=========================================="

          if [ ! -d "$DIST_DIR" ]; then
            echo "::error::Distribution directory does not exist."
            exit 1
          fi

          if [ -z "$(find "$DIST_DIR" -type f -print -quit)" ]; then
            echo "::error::No build artifacts were generated."
            exit 1
          fi

          echo
          echo "Artifacts found:"
          find "$DIST_DIR" -type f -printf '%P\n' | sort

      # ---------------------------------------------------------
      # Upload artifacts
      # ---------------------------------------------------------
      - name: Upload Kernel Artifacts
        if: ${{ github.event.inputs.run_mode == 'Build' }}
        uses: actions/upload-artifact@v4
        with:
          name: GKI-${{ github.event.inputs.kernel_version }}-${{ github.event.inputs.compiler }}-${{ github.event.inputs.root_manager }}-SUSFS-${{ github.event.inputs.susfs_status }}-LTO-${{ github.event.inputs.lto_mode }}
          path: |
            kernel_source/out/dist/**
          if-no-files-found: error
          retention-days: 7

      # ---------------------------------------------------------
      # Cleanup
      # ---------------------------------------------------------
      - name: Build Summary
        if: always()
        env:
          ROOT_MGR: ${{ github.event.inputs.root_manager }}
          SUSFS: ${{ github.event.inputs.susfs_status }}
          LTO: ${{ github.event.inputs.lto_mode }}
        run: |
          echo "=========================================="
          echo "BUILD SUMMARY"
          echo "=========================================="
          echo "Kernel      : Android 14 - 6.1"
          echo "Root Manager: $ROOT_MGR"
          echo "SUSFS       : $SUSFS"
          echo "LTO         : $LTO"
          echo "=========================================="
