name: Build GKI Kernel with Custom Options

on:
  workflow_dispatch:
    inputs:
      compiler:
        description: 'Select Compiler (Clang)'
        required: true
        default: 'AOSP'
        type: choice
        options:
          - 'AOSP'
          - 'GreenForce'
          - 'Neutron'
          - 'WeebX'
          - 'Zyc'

      kernel_version:
        description: 'Kernel Version'
        required: true
        default: '6.1'
        type: choice
        options:
          - '6.1'

      root_manager:
        description: 'Select Root Manager / Mode'
        required: true
        default: 'KernelSU-Next'
        type: choice
        options:
          - 'KernelSU-Next'
          - 'SukiSU-Ultra'
          - 'ReSukiSU'
          - 'Vanilla'

      susfs_status:
        description: 'SUSFS'
        required: true
        default: 'enable'
        type: choice
        options:
          - 'enable'
          - 'disable'

      lto_mode:
        description: 'LTO Mode'
        required: true
        default: 'NONE'
        type: choice
        options:
          - 'NONE'
          - 'THIN'
          - 'FULL'

      run_mode:
        description: 'Run Mode'
        required: true
        default: 'Build'
        type: choice
        options:
          - 'Build'
          - 'Test Only'


jobs:
  build:
    name: Build GKI
    runs-on: ubuntu-22.04

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      KERNEL_DIR: ${{ github.workspace }}/kernel_source
      DIST_DIR: ${{ github.workspace }}/kernel_dist


    steps:

      # ============================================================
      # MAXIMIZE BUILD SPACE
      # ============================================================

      - name: Maximize Build Space
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "Free space before cleanup"
          echo "=========================================="

          df -h

          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo rm -rf /usr/local/lib/android/sdk
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/lib/jvm

          echo
          echo "=========================================="
          echo "Free space after cleanup"
          echo "=========================================="

          df -h


      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout Repository
        uses: actions/checkout@v5


      # ============================================================
      # INSTALL DEPENDENCIES
      # ============================================================

      - name: Install Dependencies
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ca-certificates \
            cpio \
            curl \
            flex \
            git \
            git-lfs \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            jq \
            libxml2-utils \
            lz4 \
            openssl \
            patch \
            python3 \
            python3-pip \
            rsync \
            unzip \
            wget \
            zip \
            xz-utils \
            zstd \
            openjdk-17-jdk

          git lfs install --skip-repo


      # ============================================================
      # INSTALL REPO TOOL
      # ============================================================

      - name: Install Repo Tool
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/.bin"

          curl -L \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/.bin/repo"

          chmod +x "$HOME/.bin/repo"

          echo "$HOME/.bin" >> "$GITHUB_PATH"

          export PATH="$HOME/.bin:$PATH"

          repo --version


      # ============================================================
      # SETUP CLANG
      # ============================================================

      - name: Setup Clang Compiler
        env:
          SELECTED_COMPILER: ${{ github.event.inputs.compiler }}
        shell: bash
        run: |
          set -e

          rm -rf "$GITHUB_WORKSPACE/clang"
          mkdir -p "$GITHUB_WORKSPACE/clang"

          echo "=========================================="
          echo "Selected compiler: $SELECTED_COMPILER"
          echo "=========================================="

          # ------------------------------------------------------------
          # NOTE:
          # None of these projects ship usable prebuilt clang binaries
          # directly inside their git repository anymore (git-cloning
          # them only gets you scripts/metadata, not a working
          # toolchain). They all now publish prebuilt toolchains as
          # tarball assets on their GitHub "Releases" page instead.
          #
          # This function grabs the most recent release of a given
          # repo, finds the first tar.gz/tar.xz/tar.zst asset, and
          # extracts it into $GITHUB_WORKSPACE/clang.
          # ------------------------------------------------------------

          download_latest_release_tarball() {

            REPO="$1"
            DEST_DIR="$2"

            echo
            echo "Repo: $REPO"
            echo "Looking up latest release..."

            ASSET_URL="$(
              curl -sL \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/$REPO/releases/latest" \
                | jq -r '.assets[]?.browser_download_url' \
                | grep -Ei '\.(tar\.zst|tar\.xz|tar\.gz|tgz)$' \
                | head -n1
            )"

            if [ -z "$ASSET_URL" ] || [ "$ASSET_URL" = "null" ]; then

              echo "No asset found via /releases/latest, checking full release list..."

              ASSET_URL="$(
                curl -sL \
                  -H "Accept: application/vnd.github+json" \
                  "https://api.github.com/repos/$REPO/releases" \
                  | jq -r '.[0].assets[]?.browser_download_url' \
                  | grep -Ei '\.(tar\.zst|tar\.xz|tar\.gz|tgz)$' \
                  | head -n1
              )"

            fi

            if [ -z "$ASSET_URL" ] || [ "$ASSET_URL" = "null" ]; then
              echo "::error::Could not find a downloadable release tarball for $REPO"
              exit 1
            fi

            echo "Download: $ASSET_URL"

            FILENAME="$(basename "$ASSET_URL")"

            curl -Ls "$ASSET_URL" -o "$FILENAME"

            echo "Extracting $FILENAME ..."

            case "$FILENAME" in

              *.tar.zst)
                zstd -d -f --long=31 "$FILENAME" -o "${FILENAME%.zst}"
                tar -xf "${FILENAME%.zst}" -C "$DEST_DIR"
                rm -f "${FILENAME%.zst}"
                ;;

              *.tar.xz|*.tar.gz|*.tgz)
                tar -xf "$FILENAME" -C "$DEST_DIR"
                ;;

              *)
                echo "::error::Unrecognized archive format: $FILENAME"
                exit 1
                ;;

            esac

            rm -f "$FILENAME"

            echo "Extraction complete."

          }

          case "$SELECTED_COMPILER" in

            "GreenForce")
              download_latest_release_tarball \
                "greenforce-project/clang-llvm" \
                "$GITHUB_WORKSPACE/clang"
              ;;

            "Neutron")
              download_latest_release_tarball \
                "Neutron-Toolchains/clang-build-catalogue" \
                "$GITHUB_WORKSPACE/clang"
              ;;

            "WeebX")
              download_latest_release_tarball \
                "XSans0/WeebX-Clang" \
                "$GITHUB_WORKSPACE/clang"
              ;;

            "Zyc")
              download_latest_release_tarball \
                "ZyCromerZ/Clang" \
                "$GITHUB_WORKSPACE/clang"
              ;;

            "AOSP")
              echo "Using AOSP/Kleaf resolved Clang toolchain."
              ;;

            *)
              echo "::error::Unknown compiler: $SELECTED_COMPILER"
              exit 1
              ;;

          esac

          if [ "$SELECTED_COMPILER" != "AOSP" ]; then

            echo
            echo "=========================================="
            echo "Searching custom Clang"
            echo "=========================================="

            find "$GITHUB_WORKSPACE/clang" \
              -maxdepth 6 \
              -type f \
              -name clang \
              -print \
              | head -n 20

            if ! find "$GITHUB_WORKSPACE/clang" \
              -maxdepth 6 \
              -type f \
              -name clang \
              -print \
              | grep -q .; then

              echo "::error::clang binary was not found after extracting the release tarball."
              echo "::error::The toolchain's release layout may have changed upstream."
              exit 1
            fi

          fi


      # ============================================================
      # INITIALIZE GKI MANIFEST
      # ============================================================

      - name: Initialize GKI Manifest
        env:
          K_VER: ${{ github.event.inputs.kernel_version }}
        shell: bash
        run: |
          set -e

          rm -rf "$KERNEL_DIR"

          mkdir -p "$KERNEL_DIR"

          cd "$KERNEL_DIR"

          echo "=========================================="
          echo "Initializing Android Common Kernel"
          echo "Branch: common-android14-$K_VER"
          echo "=========================================="

          repo init \
            -u https://android.googlesource.com/kernel/manifest \
            -b "common-android14-$K_VER" \
            --depth=1 \
            --no-clone-bundle \
            --no-repo-verify

          echo
          echo "Repo manifest initialized."
          echo "Revision snapshot will be generated after repo sync."


      # ============================================================
      # SYNC GKI SOURCE
      # ============================================================

      - name: Sync GKI Source
        shell: bash
        run: |
          set -e

          cd "$KERNEL_DIR"

          echo "=========================================="
          echo "Synchronizing Android Common Kernel"
          echo "=========================================="

          repo sync \
            -c \
            --no-tags \
            --no-clone-bundle \
            --optimized-fetch \
            --prune \
            --force-sync \
            -j2

          echo
          echo "=========================================="
          echo "Verifying GKI workspace"
          echo "=========================================="

          REQUIRED_PATHS=(
            "common"
            "build/kernel"
            "tools"
            "prebuilts"
            "external"
          )

          for path in "${REQUIRED_PATHS[@]}"; do

            if [ ! -e "$path" ]; then
              echo "::error::Required path missing after repo sync: $path"

              echo
              echo "Workspace:"
              ls -la

              echo
              echo "Repo projects:"
              repo list -p || true

              exit 1
            fi

            echo "OK: $path"

          done

          echo
          echo "=========================================="
          echo "Checking Kleaf/Bazel"
          echo "=========================================="

          if [ ! -x tools/bazel ]; then
            echo "::error::tools/bazel is missing or not executable."
            ls -la tools || true
            exit 1
          fi

          tools/bazel --version || true

          echo
          echo "=========================================="
          echo "Kernel build repository"
          echo "=========================================="

          git -C build/kernel rev-parse --show-toplevel
          git -C build/kernel rev-parse HEAD

          echo
          echo "=========================================="
          echo "Common kernel"
          echo "=========================================="

          git -C common log -1 --oneline || true

          echo
          echo "Generating pinned manifest..."

          repo manifest -r > "$GITHUB_WORKSPACE/repo-manifest.xml"

          echo
          echo "Manifest saved:"
          echo "$GITHUB_WORKSPACE/repo-manifest.xml"


      # ============================================================
      # VALIDATE ROOT MANAGER / SUSFS
      # ============================================================

      - name: Validate Root Manager Selection
        env:
          ROOT_MGR: ${{ github.event.inputs.root_manager }}
          SUSFS: ${{ github.event.inputs.susfs_status }}
        shell: bash
        run: |
          set -e

          echo "Root manager : $ROOT_MGR"
          echo "SUSFS        : $SUSFS"

          if [ "$SUSFS" = "enable" ] && [ "$ROOT_MGR" != "KernelSU-Next" ]; then
            echo "::error::SUSFS integration requires KernelSU-Next."
            echo "::error::Select KernelSU-Next when SUSFS is enabled."
            exit 1
          fi


      # ============================================================
      # VERIFY REPO ENVIRONMENT
      # ============================================================

      - name: Verify Repo Environment
        shell: bash
        run: |
          set -e

          export PATH="$HOME/.bin:$PATH"

          echo "repo:"
          repo --version

          echo
          echo "python:"
          python3 --version

          echo
          echo "java:"
          java -version 2>&1 | head -n 3


      # ============================================================
      # DOWNLOAD SUSFS
      # ============================================================

      - name: Download SUSFS Source
        if: ${{ github.event.inputs.susfs_status == 'enable' }}
        shell: bash
        run: |
          set -e

          cd "$KERNEL_DIR"

          rm -rf susfs4ksu

          echo "=========================================="
          echo "Downloading SUSFS"
          echo "=========================================="

          git clone \
            --depth=3 \
            --no-tags \
            --single-branch \
            -b gki-android14-6.1-dev \
            https://gitlab.com/pershoot/susfs4ksu.git \
            susfs4ksu

          echo
          echo "SUSFS commit:"
          git -C susfs4ksu log -1 --oneline

          echo
          echo "=========================================="
          echo "Available SUSFS patch files"
          echo "=========================================="

          find "$KERNEL_DIR/susfs4ksu/kernel_patches" \
            -type f \
            -name "*.patch" \
            -print \
            | sort

          # --------------------------------------------------------
          # IMPORTANT:
          # The current SUSFS branch provides:
          #
          # 50_add_susfs_in_gki-android14-6.1.patch
          #
          # NOT:
          #
          # 50_add_susfs_in_gki-android14-6.1_GKI.patch
          #
          # --------------------------------------------------------

          SUSFS_GKI_PATCH="$KERNEL_DIR/susfs4ksu/kernel_patches/50_add_susfs_in_gki-android14-6.1.patch"

          SUSFS_KSU_PATCH="$KERNEL_DIR/susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch"

          echo
          echo "Checking required SUSFS files..."

          if [ ! -f "$SUSFS_GKI_PATCH" ]; then
            echo "::error::Missing SUSFS GKI patch:"
            echo "$SUSFS_GKI_PATCH"

            echo
            echo "Available patches:"
            find "$KERNEL_DIR/susfs4ksu/kernel_patches" \
              -type f \
              -name "*.patch" \
              -print \
              | sort

            exit 1
          fi

          echo "OK: $SUSFS_GKI_PATCH"

          if [ ! -f "$SUSFS_KSU_PATCH" ]; then
            echo "::error::Missing SUSFS KernelSU patch:"
            echo "$SUSFS_KSU_PATCH"

            exit 1
          fi

          echo "OK: $SUSFS_KSU_PATCH"

          echo
          echo "SUSFS source verification completed."


      # ============================================================
      # FIND KERNEL COMMIT COMPATIBLE WITH SUSFS PATCH
      # ============================================================
      #
      # The SUSFS GKI patch is generated against a specific snapshot of
      # the Android common kernel. "repo sync" above always fetches the
      # LATEST HEAD of the common-android14-<version> branch, which keeps
      # moving forward as Google lands new commits. When HEAD has moved
      # past the commit the SUSFS patch was built for, one or more hunks
      # no longer match and the patch fails to apply ("cannot be applied
      # cleanly").
      #
      # This step deepens the shallow "common" checkout and walks
      # backwards through its history, dry-running the SUSFS GKI patch
      # against each commit, until it finds one the patch actually
      # applies to cleanly. It then checks the kernel source out at that
      # commit so the next step succeeds.
      # ============================================================

      - name: Find Compatible Kernel Commit for SUSFS Patch
        if: ${{ github.event.inputs.susfs_status == 'enable' }}
        env:
          K_VER: ${{ github.event.inputs.kernel_version }}
        shell: bash
        run: |
          set -e

          COMMON="$KERNEL_DIR/common"
          SUSFS="$KERNEL_DIR/susfs4ksu"
          SUSFS_GKI_PATCH="$SUSFS/kernel_patches/50_add_susfs_in_gki-android14-6.1.patch"
          MAX_COMMITS_TO_TRY=300

          cd "$COMMON"

          echo "=========================================="
          echo "Kernel commit from repo sync (HEAD)"
          echo "=========================================="

          git log -1 --oneline

          echo
          echo "=========================================="
          echo "Checking if the patch already applies at HEAD"
          echo "=========================================="

          if patch \
            --dry-run \
            --forward \
            --batch \
            -p1 \
            < "$SUSFS_GKI_PATCH" > /dev/null 2>&1; then

            echo "HEAD is already compatible. No changes needed."

          else

            echo "HEAD is NOT compatible. Searching history for a commit that is..."

            echo
            echo "=========================================="
            echo "Deepening shallow checkout of 'common'"
            echo "=========================================="

            REMOTE="$(git remote | head -n1)"

            if [ -z "$REMOTE" ]; then
              echo "::error::No git remote found for common kernel checkout."
              exit 1
            fi

            echo "Remote: $REMOTE"

            CURRENT_SHA="$(git rev-parse HEAD)"

            # The manifest branch name (e.g. "common-android14-6.1") is not
            # guaranteed to match the actual ref name on this project's
            # remote, so we deliberately avoid fetching by branch name.
            # Try, in order:
            #   1) deepen using the refspec 'repo' already configured
            #   2) fetch more history directly by the current commit SHA
            #   3) fully unshallow as a last resort (slow, but always works)

            if git fetch --deepen="$MAX_COMMITS_TO_TRY" "$REMOTE"; then

              echo "Deepened using configured remote refspec."

            elif git fetch --depth="$MAX_COMMITS_TO_TRY" "$REMOTE" "$CURRENT_SHA"; then

              echo "Deepened by fetching current commit SHA directly."

            elif git fetch --unshallow "$REMOTE"; then

              echo "Fully unshallowed (this may take a while)."

            else

              echo "::error::Failed to fetch deeper history for the common kernel checkout."
              exit 1

            fi

            # None of the fallbacks above move HEAD, they only make more
            # history reachable from the commit we already have checked out.
            git checkout --quiet --detach "$CURRENT_SHA"

            echo
            echo "Commits available locally now:"
            git log --oneline | wc -l

            echo
            echo "=========================================="
            echo "Searching for a compatible commit"
            echo "=========================================="

            FOUND_COMMIT=""

            for COMMIT in $(git log --format='%H' -n "$MAX_COMMITS_TO_TRY"); do

              git checkout --quiet --detach "$COMMIT"

              if patch \
                --dry-run \
                --forward \
                --batch \
                -p1 \
                < "$SUSFS_GKI_PATCH" > /dev/null 2>&1; then

                FOUND_COMMIT="$COMMIT"
                break

              fi

            done

            if [ -z "$FOUND_COMMIT" ]; then

              echo "::error::No compatible kernel commit found in the last $MAX_COMMITS_TO_TRY commits."
              echo "::error::The SUSFS patch may target a much older kernel snapshot,"
              echo "::error::or the susfs4ksu branch needs to be updated for this kernel branch."

              exit 1

            fi

            echo
            echo "Compatible commit found:"
            git log -1 --oneline "$FOUND_COMMIT"

            git checkout --quiet --detach "$FOUND_COMMIT"

          fi

          echo
          echo "=========================================="
          echo "Final kernel commit to be used for the build"
          echo "=========================================="

          git log -1 --oneline


      # ============================================================
      # APPLY SUSFS SOURCE + GKI PATCH
      # ============================================================

      - name: Apply SUSFS GKI Patch
        if: ${{ github.event.inputs.susfs_status == 'enable' }}
        shell: bash
        run: |
          set -e

          cd "$KERNEL_DIR"

          COMMON="$KERNEL_DIR/common"
          SUSFS="$KERNEL_DIR/susfs4ksu"

          SUSFS_GKI_PATCH="$SUSFS/kernel_patches/50_add_susfs_in_gki-android14-6.1.patch"

          echo "=========================================="
          echo "Installing SUSFS source files"
          echo "=========================================="

          if [ ! -d "$SUSFS/kernel_patches/fs" ]; then
            echo "::error::SUSFS fs source directory is missing."
            exit 1
          fi

          if [ ! -d "$SUSFS/kernel_patches/include/linux" ]; then
            echo "::error::SUSFS include/linux source directory is missing."
            exit 1
          fi

          cp -a \
            "$SUSFS/kernel_patches/fs/." \
            "$COMMON/fs/"

          cp -a \
            "$SUSFS/kernel_patches/include/linux/." \
            "$COMMON/include/linux/"

          echo
          echo "SUSFS source files copied."

          echo
          echo "=========================================="
          echo "Copying GKI SUSFS patch"
          echo "=========================================="

          cp -f \
            "$SUSFS_GKI_PATCH" \
            "$COMMON/50_add_susfs_in_gki-android14-6.1.patch"

          cd "$COMMON"

          echo
          echo "=========================================="
          echo "Testing GKI SUSFS patch"
          echo "=========================================="

          if ! patch \
            --dry-run \
            --forward \
            --batch \
            -p1 \
            < 50_add_susfs_in_gki-android14-6.1.patch; then

            echo "::error::GKI SUSFS patch cannot be applied cleanly."

            echo
            echo "Kernel commit:"
            git log -1 --oneline || true

            echo
            echo "Patch:"
            sed -n '1,260p' \
              50_add_susfs_in_gki-android14-6.1.patch

            exit 1
          fi

          echo
          echo "Dry-run successful."

          echo
          echo "=========================================="
          echo "Applying GKI SUSFS patch"
          echo "=========================================="

          patch \
            --forward \
            --batch \
            -p1 \
            < 50_add_susfs_in_gki-android14-6.1.patch

          echo
          echo "GKI SUSFS patch applied successfully."


      # ============================================================
      # INSTALL ROOT MANAGER
      # ============================================================

      - name: Apply Root Manager
        if: ${{ github.event.inputs.root_manager != 'Vanilla' }}
        env:
          ROOT_MGR: ${{ github.event.inputs.root_manager }}
          SUSFS: ${{ github.event.inputs.susfs_status }}
        shell: bash
        run: |
          set -e

          cd "$KERNEL_DIR"

          echo "=========================================="
          echo "Installing Root Manager"
          echo "=========================================="

          echo "Root manager: $ROOT_MGR"
          echo "SUSFS: $SUSFS"

          case "$ROOT_MGR" in

            "KernelSU-Next")

              if [ "$SUSFS" = "enable" ]; then

                echo
                echo "Installing SUSFS-compatible KernelSU-Next..."

                curl -LSs \
                  "https://raw.githubusercontent.com/pershoot/KernelSU-Next/refs/heads/next-susfs/kernel/setup.sh" \
                  | bash -s next-susfs

              else

                echo
                echo "Installing standard KernelSU-Next..."

                curl -LSs \
                  "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/kernel/setup.sh" \
                  | bash -s main

              fi

              ;;

            "SukiSU-Ultra")

              echo
              echo "Installing SukiSU-Ultra..."

              curl -LSs \
                "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" \
                | bash -s main

              ;;

            "ReSukiSU")

              echo
              echo "Installing ReSukiSU..."

              curl -LSs \
                "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" \
                | bash -s main

              ;;

            *)

              echo "::error::Unknown root manager: $ROOT_MGR"
              exit 1

              ;;

          esac

          echo
          echo "=========================================="
          echo "Root manager installation completed"
          echo "=========================================="


      # ============================================================
      # APPLY SUSFS KERNELSU PATCH
      # ============================================================

      - name: Apply SUSFS KernelSU Patch
        if: ${{ github.event.inputs.susfs_status == 'enable' && github.event.inputs.root_manager == 'KernelSU-Next' }}
        shell: bash
        run: |
          set -e

          cd "$KERNEL_DIR"

          COMMON="$KERNEL_DIR/common"
          SUSFS="$KERNEL_DIR/susfs4ksu"
          KSU_DIR="$COMMON/KernelSU"

          KSU_PATCH="$SUSFS/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch"

          echo "=========================================="
          echo "Applying SUSFS KernelSU patch"
          echo "=========================================="

          if [ ! -d "$KSU_DIR" ]; then
            echo "::error::KernelSU directory was not found:"
            echo "$KSU_DIR"

            echo
            echo "Searching for KernelSU:"
            find "$COMMON" \
              -maxdepth 3 \
              -type d \
              -iname "*kernelsu*" \
              -print || true

            exit 1
          fi

          if [ ! -f "$KSU_PATCH" ]; then
            echo "::error::SUSFS KernelSU patch was not found:"
            echo "$KSU_PATCH"
            exit 1
          fi

          cp -f \
            "$KSU_PATCH" \
            "$KSU_DIR/10_enable_susfs_for_ksu.patch"

          cd "$KSU_DIR"

          echo
          echo "KernelSU directory:"
          pwd

          echo
          echo "KernelSU HEAD:"
          git log -1 --oneline || true

          echo
          echo "Testing SUSFS KernelSU patch..."

          if ! patch \
            --dry-run \
            --forward \
            --batch \
            -p1 \
            < 10_enable_susfs_for_ksu.patch; then

            echo "::error::SUSFS KernelSU patch cannot be applied cleanly."

            echo
            echo "Patch:"
            sed -n '1,260p' \
              10_enable_susfs_for_ksu.patch

            exit 1
          fi

          echo
          echo "Dry-run successful."

          echo
          echo "Applying SUSFS KernelSU patch..."

          patch \
            --forward \
            --batch \
            -p1 \
            < 10_enable_susfs_for_ksu.patch

          echo
          echo "SUSFS KernelSU patch applied successfully."


      # ============================================================
      # FINALIZE SUSFS
      # ============================================================

      - name: Finalize SUSFS Integration
        if: ${{ github.event.inputs.susfs_status == 'enable' && github.event.inputs.root_manager == 'KernelSU-Next' }}
        shell: bash
        run: |
          set -e

          cd "$KERNEL_DIR"

          COMMON="$KERNEL_DIR/common"

          echo "=========================================="
          echo "Finalizing SUSFS integration"
          echo "=========================================="

          echo
          echo "Checking KernelSU..."

          if [ ! -d "$COMMON/KernelSU" ]; then
            echo "::error::KernelSU directory was not found."
            exit 1
          fi

          echo "KernelSU found."

          echo
          echo "Checking SUSFS source..."

          SUSFS_SOURCE_COUNT="$(
            find "$COMMON" \
              -type f \
              \( \
                -name "susfs*.c" \
                -o -name "susfs*.h" \
              \) \
              | wc -l
          )"

          echo "SUSFS source files found: $SUSFS_SOURCE_COUNT"

          if [ "$SUSFS_SOURCE_COUNT" -eq 0 ]; then
            echo "::error::No SUSFS source files were found."
            exit 1
          fi

          find "$COMMON" \
            -type f \
            \( \
              -name "susfs*.c" \
              -o -name "susfs*.h" \
            \) \
            -print \
            | sort

          echo
          echo "Checking SUSFS configuration..."

          grep -R \
            "CONFIG_KSU_SUSFS" \
            "$COMMON" \
            --include="Kconfig*" \
            --include="*.c" \
            --include="*.h" \
            2>/dev/null \
            | head -n 50 || true

          echo
          echo "Removing temporary patch files..."

          rm -f \
            "$COMMON/50_add_susfs_in_gki-android14-6.1.patch" \
            "$COMMON/KernelSU/10_enable_susfs_for_ksu.patch"

          echo
          echo "SUSFS finalization completed."


      # ============================================================
      # VERIFY KERNEL MODIFICATIONS
      # ============================================================

      - name: Verify Kernel Modifications
        shell: bash
        run: |
          set -e

          cd "$KERNEL_DIR"

          echo "=========================================="
          echo "Kernel Workspace"
          echo "=========================================="

          echo
          echo "Kernel commit:"
          git -C common log -1 --oneline || true

          echo
          echo "Git status:"
          git -C common status --short || true

          echo
          echo "KernelSU:"

          if [ -d common/KernelSU ]; then
            echo "KernelSU installed."
          else
            echo "KernelSU not installed."
          fi

          echo
          echo "Kleaf:"

          if [ -x tools/bazel ]; then
            echo "Kleaf/Bazel available."
          else
            echo "::error::tools/bazel is missing."
            exit 1
          fi

          echo
          echo "Build/kernel:"

          if [ -d build/kernel ]; then
            echo "build/kernel exists."
            git -C build/kernel rev-parse HEAD || true
          else
            echo "::error::build/kernel is missing."
            exit 1
          fi


      # ============================================================
      # TEST ONLY
      # ============================================================

      - name: Test Kleaf Target
        if: ${{ github.event.inputs.run_mode == 'Test Only' }}
        shell: bash
        run: |
          set -e

          cd "$KERNEL_DIR"

          echo "=========================================="
          echo "Testing Kleaf target"
          echo "=========================================="

          tools/bazel query //common:kernel_aarch64_dist

          echo
          echo "Kleaf target is available."

          if [ "${{ github.event.inputs.susfs_status }}" = "enable" ]; then

            echo
            echo "Checking SUSFS..."

            grep -R \
              "CONFIG_KSU_SUSFS" \
              common \
              --include="Kconfig*" \
              --include="*.c" \
              --include="*.h" \
              2>/dev/null \
              | head -n 30 || true

          fi


      # ============================================================
      # SHOW BUILD CONFIGURATION
      # ============================================================

      - name: Show Build Configuration
        if: ${{ github.event.inputs.run_mode == 'Build' }}
        env:
          LTO_MODE: ${{ github.event.inputs.lto_mode }}
          SELECTED_COMPILER: ${{ github.event.inputs.compiler }}
          ROOT_MGR: ${{ github.event.inputs.root_manager }}
          SUSFS: ${{ github.event.inputs.susfs_status }}
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "BUILD CONFIGURATION"
          echo "=========================================="

          echo
          echo "Kernel       : Android 14 / 6.1"
          echo "Compiler     : $SELECTED_COMPILER"
          echo "Root Manager : $ROOT_MGR"
          echo "SUSFS        : $SUSFS"
          echo "LTO          : $LTO_MODE"
          echo "Runner       : ubuntu-22.04"

          echo
          echo "Workspace:"
          du -sh "$KERNEL_DIR" || true

          echo
          echo "Disk:"
          df -h


      # ============================================================
      # BUILD GKI
      # ============================================================

      - name: Build GKI Kernel
        if: ${{ github.event.inputs.run_mode == 'Build' }}
        env:
          LTO_MODE: ${{ github.event.inputs.lto_mode }}
          SELECTED_COMPILER: ${{ github.event.inputs.compiler }}
        shell: bash
        run: |
          set -e

          cd "$KERNEL_DIR"

          rm -rf "$DIST_DIR"
          mkdir -p "$DIST_DIR"

          case "$LTO_MODE" in

            "NONE")
              LTO_VALUE="none"
              ;;

            "THIN")
              LTO_VALUE="thin"
              ;;

            "FULL")
              LTO_VALUE="full"
              ;;

            *)
              echo "::error::Invalid LTO mode: $LTO_MODE"
              exit 1
              ;;

          esac

          echo "=========================================="
          echo "Starting GKI build"
          echo "=========================================="

          echo
          echo "Compiler : $SELECTED_COMPILER"
          echo "LTO      : $LTO_VALUE"
          echo "Dist dir : $DIST_DIR"

          BAZEL_ARGS=(
            "--config=fast"
            "--config=stamp"
            "--lto=$LTO_VALUE"
          )

          if [ "$SELECTED_COMPILER" != "AOSP" ]; then

            CLANG_ROOT="$GITHUB_WORKSPACE/clang"

            echo
            echo "=========================================="
            echo "Using custom Clang"
            echo "=========================================="

            echo "Clang root:"
            echo "$CLANG_ROOT"

            CLANG_BIN=""

            if [ -x "$CLANG_ROOT/bin/clang" ]; then

              CLANG_BIN="$CLANG_ROOT/bin"

            else

              FOUND_CLANG="$(
                find "$CLANG_ROOT" \
                  -type f \
                  -name clang \
                  -perm -111 \
                  | head -n 1 || true
              )"

              if [ -n "$FOUND_CLANG" ]; then
                CLANG_BIN="$(dirname "$FOUND_CLANG")"
              fi

            fi

            if [ -z "$CLANG_BIN" ]; then
              echo "::error::Unable to locate custom Clang."

              find "$CLANG_ROOT" \
                -type f \
                -name clang \
                -print \
                | head -n 50 || true

              exit 1
            fi

            echo
            echo "Custom Clang bin:"
            echo "$CLANG_BIN"

            export PATH="$CLANG_BIN:$PATH"

            echo
            echo "clang:"
            clang --version | head -n 5

            BAZEL_ARGS+=(
              "--user_clang_toolchain"
            )

            export KLEAF_USER_CLANG_TOOLCHAIN_PATH="$CLANG_BIN"

          else

            echo
            echo "Using Kleaf resolved AOSP Clang toolchain."

          fi

          echo
          echo "=========================================="
          echo "Bazel arguments"
          echo "=========================================="

          printf '%s\n' "${BAZEL_ARGS[@]}"

          echo
          echo "=========================================="
          echo "Kleaf build"
          echo "=========================================="

          tools/bazel run \
            "${BAZEL_ARGS[@]}" \
            //common:kernel_aarch64_dist \
            -- \
            --dist_dir="$DIST_DIR"


      # ============================================================
      # VERIFY KERNEL ARTIFACTS
      # ============================================================

      - name: Verify Kernel Artifacts
        if: ${{ github.event.inputs.run_mode == 'Build' }}
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "Kernel Artifacts"
          echo "=========================================="

          if [ ! -d "$DIST_DIR" ]; then
            echo "::error::Distribution directory does not exist."
            exit 1
          fi

          echo
          echo "Files:"

          find "$DIST_DIR" \
            -maxdepth 3 \
            -type f \
            -printf '%p\n' \
            | sort

          echo
          echo "=========================================="
          echo "Artifact sizes"
          echo "=========================================="

          du -ah "$DIST_DIR" \
            | sort -h \
            | tail -n 50

          echo
          echo "=========================================="
          echo "Important kernel files"
          echo "=========================================="

          FOUND_IMAGE=0

          for file in \
            "$DIST_DIR/Image" \
            "$DIST_DIR/Image.gz" \
            "$DIST_DIR/Image.lz4" \
            "$DIST_DIR/boot.img"; do

            if [ -f "$file" ]; then
              echo "FOUND: $file"
              FOUND_IMAGE=1
            fi

          done

          if [ "$FOUND_IMAGE" -eq 0 ]; then

            echo "::warning::No standard Image file found at top level."

            echo
            echo "Searching recursively..."

            find "$DIST_DIR" \
              -type f \
              \( \
                -name "Image" \
                -o -name "Image.gz" \
                -o -name "Image.lz4" \
                -o -name "boot.img" \
              \) \
              -print

          fi


      # ============================================================
      # CREATE BUILD MANIFEST
      # ============================================================

      - name: Create Build Manifest
        if: ${{ github.event.inputs.run_mode == 'Build' }}
        env:
          SELECTED_COMPILER: ${{ github.event.inputs.compiler }}
          ROOT_MGR: ${{ github.event.inputs.root_manager }}
          SUSFS: ${{ github.event.inputs.susfs_status }}
          LTO_MODE: ${{ github.event.inputs.lto_mode }}
        shell: bash
        run: |
          set -e

          MANIFEST="$DIST_DIR/build-manifest.txt"

          {
            echo "=========================================="
            echo "GKI BUILD MANIFEST"
            echo "=========================================="

            echo
            echo "Repository : ${{ github.repository }}"
            echo "Commit     : ${{ github.sha }}"
            echo "Run ID     : ${{ github.run_id }}"

            echo
            echo "Kernel     : Android 14 / 6.1"
            echo "Compiler   : $SELECTED_COMPILER"
            echo "Root       : $ROOT_MGR"
            echo "SUSFS      : $SUSFS"
            echo "LTO        : $LTO_MODE"

            echo
            echo "Kernel commit:"

            git -C "$KERNEL_DIR/common" \
              log -1 --oneline

            echo
            echo "SUSFS commit:"

            if [ -d "$KERNEL_DIR/susfs4ksu/.git" ]; then
              git -C "$KERNEL_DIR/susfs4ksu" \
                log -1 --oneline
            else
              echo "N/A"
            fi

            echo
            echo "KernelSU commit:"

            if [ -d "$KERNEL_DIR/common/KernelSU/.git" ]; then
              git -C "$KERNEL_DIR/common/KernelSU" \
                log -1 --oneline
            else
              echo "N/A"
            fi

            echo
            echo "=========================================="

          } > "$MANIFEST"

          cat "$MANIFEST"


      # ============================================================
      # UPLOAD ARTIFACTS
      # ============================================================

      - name: Upload Kernel Artifacts
        if: ${{ github.event.inputs.run_mode == 'Build' }}
        uses: actions/upload-artifact@v7
        with:
          name: GKI-android14-6.1-${{ github.event.inputs.compiler }}-${{ github.event.inputs.root_manager }}-SUSFS-${{ github.event.inputs.susfs_status }}-LTO-${{ github.event.inputs.lto_mode }}
          if-no-files-found: error
          compression-level: 0
          path: |
            kernel_dist/**


      # ============================================================
      # BUILD SUMMARY
      # ============================================================

      - name: Build Summary
        if: always()
        env:
          SELECTED_COMPILER: ${{ github.event.inputs.compiler }}
          ROOT_MGR: ${{ github.event.inputs.root_manager }}
          SUSFS: ${{ github.event.inputs.susfs_status }}
          LTO_MODE: ${{ github.event.inputs.lto_mode }}
          RUN_MODE: ${{ github.event.inputs.run_mode }}
        shell: bash
        run: |
          echo
          echo "=========================================="
          echo "BUILD SUMMARY"
          echo "=========================================="

          echo
          echo "Kernel       : Android 14 / 6.1"
          echo "Compiler     : $SELECTED_COMPILER"
          echo "Root Manager : $ROOT_MGR"
          echo "SUSFS        : $SUSFS"
          echo "LTO          : $LTO_MODE"
          echo "Run Mode     : $RUN_MODE"

          echo
          echo "=========================================="

          if [ -d "$DIST_DIR" ]; then

            echo
            echo "Artifacts:"

            find "$DIST_DIR" \
              -maxdepth 2 \
              -type f \
              -printf '%p\n' \
              | sort \
              | head -n 200

          fi

          echo
          echo "=========================================="
