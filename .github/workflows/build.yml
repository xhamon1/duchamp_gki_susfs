name: Build GKI Kernel with Custom Options

on:
  workflow_dispatch:
    inputs:
      compiler:
        description: 'Select Compiler'
        required: true
        default: 'AOSP'
        type: choice
        options:
          - 'AOSP'
          - 'GreenForce'
          - 'Neutron'
          - 'WeebX'
          - 'Zyc'

      kernel_version:
        description: 'Kernel Version'
        required: true
        default: '6.1'
        type: choice
        options:
          - '6.1'

      root_manager:
        description: 'Select Root Manager / Mode'
        required: true
        default: 'KernelSU-Next'
        type: choice
        options:
          - 'KernelSU-Next'
          - 'SukiSU-Ultra'
          - 'ReSukiSU'
          - 'Vanilla'

      susfs_status:
        description: 'SUSFS'
        required: true
        default: 'enable'
        type: choice
        options:
          - 'enable'
          - 'disable'

      lto_mode:
        description: 'LTO Mode'
        required: true
        default: 'NONE'
        type: choice
        options:
          - 'NONE'
          - 'THIN'
          - 'FULL'

      run_mode:
        description: 'Run Mode'
        required: true
        default: 'Build'
        type: choice
        options:
          - 'Build'
          - 'Test Only'


jobs:
  build:
    name: Build GKI
    runs-on: ubuntu-22.04

    steps:

      # =========================================================
      # MAXIMIZE BUILD SPACE
      # =========================================================
      - name: Maximize Build Space
        run: |
          set -e

          echo "Cleaning unnecessary preinstalled software..."

          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY" || true

          echo
          echo "Available disk space:"
          df -h


      # =========================================================
      # CHECKOUT WORKFLOW REPOSITORY
      # =========================================================
      - name: Checkout Repository
        uses: actions/checkout@v4


      # =========================================================
      # INSTALL DEPENDENCIES
      # =========================================================
      - name: Install Dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            cpio \
            curl \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            lz4 \
            patch \
            python3 \
            python3-pip \
            rsync \
            unzip \
            wget \
            zip

          echo
          echo "Installed dependency versions:"
          git --version
          python3 --version
          curl --version | head -n 1


      # =========================================================
      # COMPILER SELECTION
      #
      # IMPORTANT:
      # Android 14+ Kleaf uses Bazel toolchain resolution.
      # The external clang directories used by the old workflow
      # are NOT automatically selected by Kleaf.
      #
      # Therefore AOSP is the supported compiler for this build.
      # Other selections are rejected instead of silently using
      # the wrong compiler.
      # =========================================================
      - name: Validate Compiler Selection
        env:
          SELECTED_COMPILER: ${{ github.event.inputs.compiler }}
        run: |
          set -e

          echo "Selected compiler: $SELECTED_COMPILER"

          if [ "$SELECTED_COMPILER" != "AOSP" ]; then
            echo "::error::Custom clang '$SELECTED_COMPILER' is not yet supported by this Kleaf workflow."
            echo "::error::Please select AOSP for the first successful build."
            echo "::error::Kleaf uses Bazel toolchain resolution instead of the old PATH-based clang method."
            exit 1
          fi

          echo "Using Android Common Kernel / Kleaf hermetic AOSP toolchain."


      # =========================================================
      # CLONE ANDROID COMMON KERNEL
      #
      # Uses:
      #   - HTTP/1.1
      #   - retry
      #   - single branch
      #   - shallow clone
      #   - blob filtering
      #
      # This is more tolerant of GitHub Actions network failures.
      # =========================================================
      - name: Clone GKI Source
        env:
          K_VER: ${{ github.event.inputs.kernel_version }}
        run: |
          set -e

          BRANCH="android14-${K_VER}"

          echo "=========================================="
          echo "Android Common Kernel"
          echo "Branch: $BRANCH"
          echo "=========================================="

          rm -rf kernel_source

          echo
          echo "Cloning kernel source..."

          for attempt in 1 2 3; do
            echo
            echo "Clone attempt: $attempt / 3"

            rm -rf kernel_source

            if git \
              -c http.version=HTTP/1.1 \
              clone \
              --depth=1 \
              --single-branch \
              --filter=blob:none \
              --branch "$BRANCH" \
              https://android.googlesource.com/kernel/common \
              kernel_source; then
              break
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "::error::Failed to clone Android Common Kernel after 3 attempts."
              exit 1
            fi

            echo "Clone failed. Retrying in 10 seconds..."
            sleep 10
          done

          cd kernel_source

          echo
          echo "=========================================="
          echo "Kernel source information"
          echo "=========================================="

          git branch --show-current
          git log -1 --oneline

          echo
          echo "Checking required Kleaf files..."

          test -f BUILD.bazel
          test -f build.config.aarch64
          test -x tools/bazel

          echo
          echo "Kleaf files detected successfully."

          echo
          echo "Bazel version:"
          tools/bazel --version


      # =========================================================
      # APPLY ROOT MANAGER
      # =========================================================
      - name: Apply Root Manager
        if: ${{ github.event.inputs.root_manager != 'Vanilla' }}
        env:
          ROOT_MGR: ${{ github.event.inputs.root_manager }}
        run: |
          set -e

          cd kernel_source

          echo "=========================================="
          echo "Root Manager: $ROOT_MGR"
          echo "=========================================="

          case "$ROOT_MGR" in

            "KernelSU-Next")
              echo "Installing KernelSU-Next..."

              curl -LSs \
                "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/kernel/setup.sh" \
                | bash -s main
              ;;

            "SukiSU-Ultra")
              echo "Installing SukiSU-Ultra..."

              curl -LSs \
                "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" \
                | bash -s main
              ;;

            "ReSukiSU")
              echo "Installing ReSukiSU..."

              curl -LSs \
                "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" \
                | bash -s main
              ;;

            *)
              echo "::error::Unknown root manager: $ROOT_MGR"
              exit 1
              ;;
          esac

          echo
          echo "Root manager installation completed."

          echo
          echo "KernelSU files:"
          test -d KernelSU || true
          test -d KernelSU-Next || true


      # =========================================================
      # APPLY SUSFS
      #
      # SUSFS has a dedicated gki-android14-6.1 branch.
      # The upstream project specifically documents this branch
      # for GKI Android 14 6.1.
      # =========================================================
      - name: Download and Apply SUSFS Patch
        if: ${{ github.event.inputs.susfs_status == 'enable' && github.event.inputs.root_manager != 'Vanilla' }}
        run: |
          set -e

          cd kernel_source

          echo "=========================================="
          echo "Downloading SUSFS"
          echo "=========================================="

          rm -rf susfs4ksu

          git clone \
            --depth=1 \
            --single-branch \
            --branch gki-android14-6.1 \
            https://gitlab.com/simonpunk/susfs4ksu.git \
            susfs4ksu

          echo
          echo "SUSFS commit:"
          cd susfs4ksu
          git log -1 --oneline
          cd ..

          echo
          echo "Copying SUSFS kernel files..."

          if [ -d "susfs4ksu/kernel_patches/fs" ]; then
            cp -rf susfs4ksu/kernel_patches/fs/. fs/
          fi

          if [ -d "susfs4ksu/kernel_patches/include" ]; then
            cp -rf susfs4ksu/kernel_patches/include/. include/
          fi

          echo
          echo "Applying SUSFS kernel patch..."

          PATCH_FILE="susfs4ksu/kernel_patches/50_add_susfs_in_gki-android14-6.1.patch"

          if [ ! -f "$PATCH_FILE" ]; then
            echo "::error::SUSFS patch file not found:"
            echo "$PATCH_FILE"
            exit 1
          fi

          patch \
            -p1 \
            --ignore-whitespace \
            < "$PATCH_FILE"

          echo
          echo "SUSFS patch applied successfully."


      # =========================================================
      # VERIFY ROOT + SUSFS
      # =========================================================
      - name: Verify Kernel Modifications
        env:
          ROOT_MGR: ${{ github.event.inputs.root_manager }}
          SUSFS: ${{ github.event.inputs.susfs_status }}
        run: |
          set -e

          cd kernel_source

          echo "=========================================="
          echo "Verifying modifications"
          echo "=========================================="

          if [ "$ROOT_MGR" != "Vanilla" ]; then
            echo
            echo "KernelSU related files:"
            find kernel -maxdepth 2 -type f 2>/dev/null | head -n 30 || true
          fi

          if [ "$SUSFS" = "enable" ] && [ "$ROOT_MGR" != "Vanilla" ]; then
            echo
            echo "Checking SUSFS configuration..."

            if grep -R "KSU_SUSFS" kernel/Kconfig kernel 2>/dev/null | head -n 10; then
              echo
              echo "SUSFS configuration detected."
            else
              echo "::warning::KSU_SUSFS configuration was not detected by grep."
              echo "The build will determine whether the patch is usable."
            fi
          fi


      # =========================================================
      # SHOW BUILD CONFIGURATION
      # =========================================================
      - name: Show Build Configuration
        env:
          COMPILER: ${{ github.event.inputs.compiler }}
          KERNEL_VERSION: ${{ github.event.inputs.kernel_version }}
          ROOT_MGR: ${{ github.event.inputs.root_manager }}
          SUSFS: ${{ github.event.inputs.susfs_status }}
          LTO: ${{ github.event.inputs.lto_mode }}
          RUN_MODE: ${{ github.event.inputs.run_mode }}
        run: |
          echo
          echo "=========================================="
          echo "BUILD CONFIGURATION"
          echo "=========================================="
          echo "Compiler     : $COMPILER"
          echo "Kernel       : Android 14 - $KERNEL_VERSION"
          echo "Root Manager : $ROOT_MGR"
          echo "SUSFS        : $SUSFS"
          echo "LTO          : $LTO"
          echo "Run Mode     : $RUN_MODE"
          echo "=========================================="
          echo


      # =========================================================
      # TEST KLEAF TARGET
      #
      # Test Only mode does not compile the complete kernel.
      # It verifies that the target exists and Bazel can resolve it.
      # =========================================================
      - name: Test Kleaf Target
        if: ${{ github.event.inputs.run_mode == 'Test Only' }}
        run: |
          set -e

          cd kernel_source

          echo "=========================================="
          echo "Testing Kleaf target"
          echo "=========================================="

          tools/bazel query //common:kernel_aarch64_dist

          echo
          echo "Kleaf target resolved successfully."


      # =========================================================
      # BUILD GKI KERNEL
      #
      # Official AOSP Android 14+ method:
      #
      # tools/bazel run //common:kernel_aarch64_dist
      #
      # LTO:
      # NONE -> none
      # THIN -> thin
      # FULL -> full
      #
      # default is intentionally NOT used for NONE because the
      # user explicitly requested NONE.
      # =========================================================
      - name: Build GKI Kernel
        if: ${{ github.event.inputs.run_mode == 'Build' }}
        env:
          LTO_VAL: ${{ github.event.inputs.lto_mode }}
        run: |
          set -e

          cd kernel_source

          DIST_DIR="$GITHUB_WORKSPACE/kernel_source/out/dist"

          rm -rf "$DIST_DIR"
          mkdir -p "$DIST_DIR"

          echo "=========================================="
          echo "Preparing GKI build"
          echo "=========================================="

          case "$LTO_VAL" in
            "NONE")
              LTO_ARG="none"
              ;;

            "THIN")
              LTO_ARG="thin"
              ;;

            "FULL")
              LTO_ARG="full"
              ;;

            *)
              echo "::error::Invalid LTO mode: $LTO_VAL"
              exit 1
              ;;
          esac

          echo
          echo "LTO mode: $LTO_ARG"
          echo "Dist directory: $DIST_DIR"

          echo
          echo "Bazel:"
          tools/bazel --version

          echo
          echo "=========================================="
          echo "Starting Kleaf GKI build"
          echo "Target: //common:kernel_aarch64_dist"
          echo "=========================================="

          tools/bazel run \
            --lto="$LTO_ARG" \
            //common:kernel_aarch64_dist \
            -- \
            --destdir="$DIST_DIR"

          echo
          echo "=========================================="
          echo "Kleaf build completed"
          echo "=========================================="

          echo
          echo "Generated files:"
          find "$DIST_DIR" -maxdepth 3 -type f -printf '%P\n' | sort


      # =========================================================
      # VERIFY BUILD OUTPUT
      # =========================================================
      - name: Verify Kernel Artifacts
        if: ${{ github.event.inputs.run_mode == 'Build' }}
        run: |
          set -e

          DIST_DIR="$GITHUB_WORKSPACE/kernel_source/out/dist"

          echo "=========================================="
          echo "Verifying artifacts"
          echo "=========================================="

          if [ ! -d "$DIST_DIR" ]; then
            echo "::error::Dist directory does not exist."
            exit 1
          fi

          FILE_COUNT=$(find "$DIST_DIR" -type f | wc -l)

          echo "Number of generated files: $FILE_COUNT"

          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "::error::No kernel artifacts were generated."
            exit 1
          fi

          echo
          echo "Artifacts:"
          find "$DIST_DIR" -type f -printf '%P\n' | sort

          echo
          echo "Important kernel files:"

          find "$DIST_DIR" \
            -type f \
            \( \
              -name "Image" \
              -o -name "Image.lz4" \
              -o -name "Image.lz4-dtb" \
              -o -name "boot.img" \
              -o -name "vendor_boot.img" \
              -o -name "*.ko" \
            \) \
            -print | sort || true


      # =========================================================
      # CREATE SIMPLE ARTIFACT MANIFEST
      # =========================================================
      - name: Create Artifact Manifest
        if: ${{ github.event.inputs.run_mode == 'Build' }}
        env:
          COMPILER: ${{ github.event.inputs.compiler }}
          KERNEL_VERSION: ${{ github.event.inputs.kernel_version }}
          ROOT_MGR: ${{ github.event.inputs.root_manager }}
          SUSFS: ${{ github.event.inputs.susfs_status }}
          LTO: ${{ github.event.inputs.lto_mode }}
        run: |
          set -e

          DIST_DIR="$GITHUB_WORKSPACE/kernel_source/out/dist"

          {
            echo "GKI BUILD MANIFEST"
            echo "=================="
            echo
            echo "Kernel: Android 14 - $KERNEL_VERSION"
            echo "Compiler: $COMPILER"
            echo "Root Manager: $ROOT_MGR"
            echo "SUSFS: $SUSFS"
            echo "LTO: $LTO"
            echo
            echo "Kernel commit:"
            cd "$GITHUB_WORKSPACE/kernel_source"
            git log -1 --oneline || true
            echo
            echo "Artifacts:"
            find "$DIST_DIR" -type f -printf '%P\n' | sort
          } > "$DIST_DIR/BUILD-MANIFEST.txt"

          echo "Manifest created."


      # =========================================================
      # UPLOAD ARTIFACTS
      # =========================================================
      - name: Upload Kernel Artifacts
        if: ${{ github.event.inputs.run_mode == 'Build' }}
        uses: actions/upload-artifact@v4
        with:
          name: GKI-${{ github.event.inputs.kernel_version }}-${{ github.event.inputs.compiler }}-${{ github.event.inputs.root_manager }}-SUSFS-${{ github.event.inputs.susfs_status }}-LTO-${{ github.event.inputs.lto_mode }}
          path: |
            kernel_source/out/dist/**
          if-no-files-found: error
          retention-days: 7


      # =========================================================
      # BUILD SUMMARY
      # =========================================================
      - name: Build Summary
        if: always()
        env:
          COMPILER: ${{ github.event.inputs.compiler }}
          KERNEL_VERSION: ${{ github.event.inputs.kernel_version }}
          ROOT_MGR: ${{ github.event.inputs.root_manager }}
          SUSFS: ${{ github.event.inputs.susfs_status }}
          LTO: ${{ github.event.inputs.lto_mode }}
          RUN_MODE: ${{ github.event.inputs.run_mode }}
        run: |
          echo
          echo "=========================================="
          echo "BUILD SUMMARY"
          echo "=========================================="
          echo "Compiler     : $COMPILER"
          echo "Kernel       : Android 14 - $KERNEL_VERSION"
          echo "Root Manager : $ROOT_MGR"
          echo "SUSFS        : $SUSFS"
          echo "LTO          : $LTO"
          echo "Run Mode     : $RUN_MODE"
          echo "=========================================="
